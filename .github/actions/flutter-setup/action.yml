name: Lythaus Flutter setup
description: Install and optionally cache the exact Flutter SDK declared by the repository
inputs:
  flutter-version-file:
    description: JSON file containing the Flutter SDK version
    required: false
    default: .fvmrc
  channel:
    description: Flutter release channel
    required: false
    default: stable
  cache:
    description: Restore the exact SDK cache; only main pushes may save it
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve exact Flutter SDK
      id: sdk
      shell: bash
      env:
        FLUTTER_VERSION_FILE: ${{ inputs.flutter-version-file }}
        FLUTTER_CHANNEL: ${{ inputs.channel }}
        FLUTTER_CACHE: ${{ inputs.cache }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/ci/setup-flutter-sdk.sh" resolve
    - name: Restore exact Flutter SDK cache
      if: inputs.cache == 'true'
      id: sdk_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.sdk.outputs.root }}
        key: lythaus-flutter-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ inputs.channel }}-${{ hashFiles('.github/actions/flutter-setup/action.yml', 'scripts/ci/setup-flutter-sdk.sh') }}
    - name: Install and verify exact Flutter SDK
      shell: bash
      env:
        FLUTTER_VERSION_FILE: ${{ inputs.flutter-version-file }}
        FLUTTER_CHANNEL: ${{ inputs.channel }}
        FLUTTER_CACHE: ${{ inputs.cache }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/ci/setup-flutter-sdk.sh" install
    - name: Save verified Flutter SDK before application commands
      if: inputs.cache == 'true' && steps.sdk_cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.sdk.outputs.root }}
        key: ${{ steps.sdk_cache.outputs.cache-primary-key }}
