name: WP004A Cloudflare Workers AI access preflight

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Workers AI model schema to inspect (metadata only)'
        required: true
        default: '@cf/moondream/moondream3.1-9B-A2B'
        type: choice
        options:
          - '@cf/moondream/moondream3.1-9B-A2B'
          - '@cf/openai/gpt-oss-20b'

permissions:
  contents: read

jobs:
  cloudflare_access_preflight:
    name: Read-only Workers AI model schema check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run read-only Workers AI access preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/authenticity/wp004a-cloudflare-access-preflight.mjs --model '${{ inputs.model }}' --allow-network
