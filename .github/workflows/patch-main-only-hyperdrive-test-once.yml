name: Patch main-only Hyperdrive invariant once

on:
  push:
    branches:
      - fix/waitlist-single-planetscale-main-proof
    paths:
      - .github/workflows/patch-main-only-hyperdrive-test-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/waitlist-single-planetscale-main-proof
          fetch-depth: 0
      - name: Replace stale development-branch assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tests/native-architecture-invariants.test.js')
          source = path.read_text()
          old = "  assert.match(verifier, /developmentOriginFingerprint/);"
          new = "\n".join([
              "  assert.match(verifier, /manifest\\.expectedMainOriginFingerprint/);",
              "  assert.match(verifier, /observedFingerprint === mainFingerprint/);",
              "  assert.doesNotMatch(verifier, /PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL/);",
              "  assert.doesNotMatch(verifier, /PLANETSCALE_API_TOKEN/);",
          ])
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/tests/native-architecture-invariants.test.js
          git commit -m 'test: align Hyperdrive invariant with main-only proof'
          git push origin HEAD:fix/waitlist-single-planetscale-main-proof
