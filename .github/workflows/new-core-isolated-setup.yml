name: New-core isolated Admin setup
run-name: ${{ inputs.operation }} admin-new-core-test.lythaus.co at ${{ inputs.control_sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect inputs, apply fresh setup, or continue a recorded isolated setup
        required: true
        type: choice
        options:
          - inspect
          - diagnose-admin-read
          - setup
          - resume-access
          - resume-worker-script-settings
          - stage-one-nonserving-version
      prior_run:
        description: Prior protected setup run containing the cumulative isolated Worker receipt
        required: false
        type: string
      control_sha:
        description: Exact reviewed protected main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: lythaus-new-core-isolated-setup
  cancel-in-progress: false
env:
  REQUESTED_CONTROL_SHA: ${{ inputs.control_sha }}
  REQUESTED_OPERATION: ${{ inputs.operation }}
  PRIOR_RUN: ${{ inputs.prior_run }}
  NODE_DEBUG: ''
  NODE_OPTIONS: ''

jobs:
  control:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed application ancestry before the environment review
        if: inputs.operation != 'inspect'
        run: git merge-base --is-ancestor 3fbaea846f67fe5ad452d53c456b5355069757ca "$GITHUB_SHA"
      - name: Verify pinned receipts, workflow and review gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/new-core-setup-control.mjs before-review

  isolated:
    name: Owner review for isolated setup
    needs: control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 276b43265584ec0dc158e67cbdb13cb58ece75db
          path: worker-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies without provider credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the pinned Worker and assets without provider credentials
        if: inputs.operation != 'inspect' && inputs.operation != 'diagnose-admin-read'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pin=3fbaea846f67fe5ad452d53c456b5355069757ca
          git merge-base --is-ancestor "$pin" "$GITHUB_SHA"
          git worktree add --detach application-source "$pin"
          npm --prefix application-source ci --ignore-scripts --no-audit --no-fund
          npm --prefix application-source/apps/control-panel ci --ignore-scripts --no-audit --no-fund
          node scripts/check-npm-audit.js application-source
          node scripts/check-npm-audit.js application-source/apps/control-panel
          (cd application-source && node --experimental-strip-types --test apps/lythaus-admin-api/tests/admin-access-runtime-policy.test.mjs apps/lythaus-admin-api/tests/new-core-test-worker.test.mjs apps/lythaus-admin-api/tests/first-admin-bootstrap.test.mjs)
          node scripts/ci/new-core-isolated-worker.mjs prepare application-source "$RUNNER_TEMP/new-core-artifacts"
          node scripts/ci/new-core-isolated-worker-rehearsal.mjs application-source "$RUNNER_TEMP/new-core-artifacts"
          node scripts/ci/new-core-worker-wire-contract.mjs application-source "$RUNNER_TEMP/new-core-artifacts"
          bash scripts/ci/new-core-isolated-pg-test.sh application-source "$RUNNER_TEMP/new-core-artifacts"
      - name: Require actual owner approval and current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/new-core-setup-control.mjs after-review
      - name: Perform only the selected operation on the isolated target
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LYTHAUS_NEW_CORE_OWNER_EMAIL: ${{ secrets.LYTHAUS_NEW_CORE_OWNER_EMAIL }}
          LYTHAUS_NEW_CORE_ADMIN_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_ADMIN_DATABASE_URL }}
          LYTHAUS_NEW_CORE_VERIFIER_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_VERIFIER_DATABASE_URL }}
        run: node scripts/ci/run-new-core-setup.mjs
      - name: Retain the sanitized Worker lineage receipt
        if: always() && inputs.operation != 'inspect' && inputs.operation != 'diagnose-admin-read'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-worker-lineage-${{ github.run_id }}-1
          path: ${{ runner.temp }}/isolated-worker-lineage.json
          if-no-files-found: ignore
          retention-days: 30
