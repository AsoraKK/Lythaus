name: Read-only product privilege preflight

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current protected main SHA for read-only rewards and Black News Board privilege inspection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-product-privilege-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect mapped public API product privileges
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require protected main and exact current source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Verify read-only boundaries without provider access
        run: |
          node --check scripts/ci/product-privilege-preflight.mjs
          node --test scripts/tests/product-privilege-preflight.test.mjs
          npm run validate:cloudflare-hyperdrive-targets:manifest
      - name: Recheck current main before protected reads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Read existing provider mapping and effective catalog privileges
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/product-privilege-preflight.mjs > "$RUNNER_TEMP/product-privilege-summary.json"
      - name: Retain only sanitized role and privilege evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-privilege-preflight-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/product-privilege-summary.json
          if-no-files-found: ignore
          retention-days: 7
