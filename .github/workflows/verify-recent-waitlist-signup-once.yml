name: Verify recent waitlist signup once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-recent-waitlist-signup-once.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-recent-waitlist-signup'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_BASE_SHA: d93cd20b8a8b03e249b8e8edf40944b0f9d9f618
      WINDOW_START_UTC: '2026-08-17T20:04:00Z'
      WINDOW_END_UTC: '2026-08-17T20:10:00Z'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Require read-only verification PR against reviewed main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE_SHA"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.head.ref }}" = ops/verify-recent-waitlist-signup

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Query sanitized recent waitlist metadata
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p "$RUNNER_TEMP/recent-waitlist-verification"
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import fs from 'node:fs';

          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          const start = process.env.WINDOW_START_UTC;
          const end = process.env.WINDOW_END_UTC;
          if (!start || !end) throw new Error('verification window missing');

          try {
            await client.connect();
            const result = await client.query(
              `select created_at, status, source, consent_version, encryption_key_version
                 from marketing.waitlist_signups
                where created_at >= $1::timestamptz
                  and created_at < $2::timestamptz
                order by created_at asc
                limit 10`,
              [start, end],
            );

            const rows = result.rows.map((row) => ({
              createdAt: new Date(row.created_at).toISOString(),
              status: row.status,
              source: row.source,
              consentVersion: row.consent_version,
              encryptionKeyVersionPresent: typeof row.encryption_key_version === 'string' && row.encryption_key_version.length > 0,
            }));

            const evidence = {
              schemaVersion: 1,
              status: rows.length > 0 ? 'pass' : 'no_match',
              windowStartUtc: start,
              windowEndUtc: end,
              matchingRows: rows.length,
              rows,
              piiReturned: false,
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/recent-waitlist-verification/evidence.json`, JSON.stringify(evidence, null, 2));
            console.log(JSON.stringify({ status: evidence.status, matchingRows: evidence.matchingRows, rows }));
            if (rows.length === 0) process.exitCode = 2;
          } finally {
            await client.end().catch(() => {});
          }
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recent-waitlist-verification-${{ github.sha }}
          path: ${{ runner.temp }}/recent-waitlist-verification
          if-no-files-found: warn
          retention-days: 30
