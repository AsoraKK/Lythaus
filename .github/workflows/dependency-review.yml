name: Dependency review

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact 40-character base commit for this comparison
        required: true
        type: string
      head_sha:
        description: Exact distinct candidate commit matching the selected dispatch revision
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DENY_LICENSES: GPL-3.0, AGPL-3.0
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: .trusted-main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.3
      - name: Load independently reviewed verifier from protected main
        id: bootstrap
        run: |
          if [[ ! -f .trusted-main/scripts/ci/canonical-sdk-bootstrap.mjs ]]; then
            mkdir -p .artifacts/security-run-evidence
            node -e 'require("node:fs").writeFileSync(".artifacts/security-run-evidence/run.json", JSON.stringify({baseSha:process.env.BASE_SHA,candidateSha:process.env.HEAD_SHA,conclusion:"failure",coverageEligible:false,reason:"TRUSTED_VERIFIER_BOOTSTRAP_REQUIRED"}) + "\n")'
            echo 'TRUSTED_VERIFIER_BOOTSTRAP_REQUIRED'
            exit 1
          fi
          node .trusted-main/scripts/ci/canonical-sdk-bootstrap.mjs --prepare-only
      - name: Exercise trusted verifier regression tests
        run: |
          node --test .trusted-verifier/scripts/tests/canonical-sdk-verification.test.mjs
          python3 .trusted-verifier/scripts/ci/test_sdk_archive_cache.py
      - name: Install pinned isolation toolchain
        run: node .trusted-verifier/scripts/ci/setup-canonical-sdk-tools.mjs
      - name: Exercise real isolation and cancellation controls
        env:
          LYTHAUS_RUN_ISOLATION_TEST: '1'
          LYTHAUS_ISOLATION_TOOLS: ${{ github.workspace }}/.trusted-verifier/tools.json
        run: node --test .trusted-verifier/scripts/tests/canonical-sdk-isolation.test.mjs
      - name: Probe native review and direct/transitive coverage
        id: dependency_graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .trusted-verifier/scripts/ci/dependency-review-native.mjs
      - name: Test narrowly scoped license resolution
        run: python3 .trusted-verifier/scripts/ci/test_dart_license_review.py
      - name: Verify exact public Dart archive licenses
        id: licenses
        run: python3 .trusted-verifier/scripts/ci/dart-license-review.py
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        id: native
        with:
          fail-on-severity: high
          deny-licenses: ${{ env.DENY_LICENSES }}
          allow-dependencies-licenses: ${{ steps.licenses.outputs.resolved }}
          base-ref: ${{ env.BASE_SHA }}
          head-ref: ${{ env.HEAD_SHA }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Verify fresh SDK source and complete native policy review
        if: always() && steps.bootstrap.outcome == 'success'
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          LICENSE_OUTCOME: ${{ steps.licenses.outcome }}
        run: node .trusted-verifier/scripts/ci/canonical-sdk-bootstrap.mjs
      - name: Upload exact comparison and security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-run-evidence-Dependency-review-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/security-run-evidence/*.json
