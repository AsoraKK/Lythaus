name: Dependency review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect GitHub dependency graph support
        id: dependency_graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" || true)"
          supported="$(REPOSITORY_RESPONSE="$response" node -e 'try { const repository = JSON.parse(process.env.REPOSITORY_RESPONSE || "{}"); const security = repository.security_and_analysis ?? {}; const supported = security.advanced_security?.status === "enabled" && security.dependency_graph?.status === "enabled"; process.stdout.write(supported ? "true" : "false"); } catch { process.stdout.write("false"); }' 2>/dev/null || printf 'false')"
          if [[ "$supported" == "true" ]]; then
            {
              echo "supported=true"
              echo "mode=native"
              echo "reason=github_dependency_graph_enabled"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "supported=false"
              echo "mode=local-fallback"
              echo "reason=github_advanced_security_unavailable"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        if: steps.dependency_graph.outputs.supported == 'true'
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          base-ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.event_name == 'push' && github.event.before || github.sha }}
          head-ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
      - name: Run fail-closed local dependency review fallback
        if: steps.dependency_graph.outputs.supported != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/dependency-review-fallback.mjs
      - name: Write exact-SHA security evidence
        shell: bash
        env:
          DEPENDENCY_REVIEW_MODE: ${{ steps.dependency_graph.outputs.mode }}
          DEPENDENCY_REVIEW_REASON: ${{ steps.dependency_graph.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/security-run-evidence
          printf '{"workflow":"Dependency review","headSha":"%s","conclusion":"success","mode":"%s","reason":"%s"}\n' \
            "$GITHUB_SHA" "${DEPENDENCY_REVIEW_MODE:-unknown}" "${DEPENDENCY_REVIEW_REASON:-unknown}" \
            > .artifacts/security-run-evidence/run.json
      - name: Upload exact-SHA security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-run-evidence-Dependency-review-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/security-run-evidence/run.json
