name: Contribution feedback PostgreSQL validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/contribution-feedback-pg17.yml'
      - 'apps/lythaus-public-api/src/**'
      - 'apps/lythaus-public-api/tests/contribution-feedback*'
      - 'apps/lythaus-public-api/tests/native-postgres-*-fixture.mjs'
      - 'apps/lythaus-public-api/tests/privacy-postgres-target.mjs'
      - 'apps/lythaus-jobs/src/**'
      - 'apps/lythaus-jobs/tests/helpers/install-reputation-lock-fixture.mjs'
      - 'packages/db/**'
      - 'packages/**'
      - 'docs/proposals/contribution-feedback-schema.sql'
      - 'database/planetscale/**'
      - 'scripts/ci/run-contribution-feedback-pg17.mjs'
      - 'scripts/ci/validate-planetscale-postgres17.mjs'
      - 'scripts/ci/planetscale-*.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: contribution-feedback-pg17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run feedback and privacy workflows in disposable PostgreSQL databases
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/ci/run-contribution-feedback-pg17.mjs
