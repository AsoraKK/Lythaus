name: Deploy Lythaus control panel

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged main SHA to build and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-control-panel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PAGES_PROJECT: ${{ vars.LYTHAUS_ADMIN_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require exact merged main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full 40-character commit SHA" >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -n "$PAGES_PROJECT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-panel/package-lock.json

      - name: Build control-panel artifact
        working-directory: apps/control-panel
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Deploy exact control-panel artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.110.0 pages deploy apps/control-panel/dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false
