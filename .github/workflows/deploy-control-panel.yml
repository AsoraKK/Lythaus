name: Deploy Lythaus control panel

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged main SHA to build and deploy
        required: true
        type: string
      pages_project:
        description: Approved control-panel Pages project name; blank uses the repository variable
        required: false
        default: ''
        type: string
      ci_run_id:
        description: Successful CI run ID for the exact production release SHA
        required: true
        type: string
      codeql_run_id:
        description: Successful CodeQL run ID for the exact production release SHA
        required: true
        type: string
      dependency_review_run_id:
        description: Successful dependency review run ID for the exact production release SHA
        required: true
        type: string
      secret_scan_run_id:
        description: Successful native secret scan run ID for the exact production release SHA
        required: true
        type: string
      historical_reconciliation_run_id:
        description: Successful historical reconciliation run ID for the exact production release SHA
        required: true
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: Exact merged main SHA to build and deploy
        required: true
        type: string
      pages_project:
        description: Approved control-panel Pages project name
        required: true
        type: string
      source_evidence_verified:
        description: The canonical parent already verified exact CI/security evidence
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: Successful CI run ID for the exact production release SHA
        required: true
        type: string
      codeql_run_id:
        description: Successful CodeQL run ID for the exact production release SHA
        required: true
        type: string
      dependency_review_run_id:
        description: Successful dependency review run ID for the exact production release SHA
        required: true
        type: string
      secret_scan_run_id:
        description: Successful native secret scan run ID for the exact production release SHA
        required: true
        type: string
      historical_reconciliation_run_id:
        description: Successful historical reconciliation run ID for the exact production release SHA
        required: true
        type: string
    outputs:
      pages_deployment_id:
        description: Exact Pages deployment identifier selected for the release SHA
        value: ${{ jobs.deploy.outputs.pages_deployment_id }}
      pages_deployment_url:
        description: Exact Pages deployment URL selected for the release SHA
        value: ${{ jobs.deploy.outputs.pages_deployment_url }}
      pages_project:
        description: Canonical control-panel Pages project
        value: ${{ jobs.deploy.outputs.pages_project }}
      pages_branch:
        description: Pages branch used for the release
        value: ${{ jobs.deploy.outputs.pages_branch }}
      deployed_sha:
        description: Pages commit SHA verified after deployment
        value: ${{ jobs.deploy.outputs.deployed_sha }}

permissions:
  contents: read

concurrency:
  group: lythaus-control-panel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    outputs:
      pages_deployment_id: ${{ steps.pages_evidence.outputs.deployment_id }}
      pages_deployment_url: ${{ steps.pages_evidence.outputs.deployment_url }}
      pages_project: ${{ steps.pages_evidence.outputs.pages_project }}
      pages_branch: ${{ steps.pages_evidence.outputs.pages_branch }}
      deployed_sha: ${{ steps.pages_evidence.outputs.deployed_sha }}
    env:
      PAGES_PROJECT: ${{ inputs.pages_project || vars.LYTHAUS_ADMIN_PAGES_PROJECT }}
      APPROVED_PAGES_PROJECT: ${{ vars.LYTHAUS_ADMIN_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require exact merged main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full 40-character commit SHA" >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -n "$PAGES_PROJECT"
          test -n "$APPROVED_PAGES_PROJECT"
          [[ "$PAGES_PROJECT" =~ ^lythaus-[A-Za-z0-9-]+$ ]]
          test "$PAGES_PROJECT" = "$APPROVED_PAGES_PROJECT" || {
            echo 'Refusing control-panel deployment to a Pages project other than the protected canonical project.' >&2
            exit 1
          }

      - name: Require exact production CI and security evidence
        if: inputs.source_evidence_verified != true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          DEPENDENCY_REVIEW_RUN_ID: ${{ inputs.dependency_review_run_id }}
          SECRET_SCAN_RUN_ID: ${{ inputs.secret_scan_run_id }}
          HISTORICAL_RECONCILIATION_RUN_ID: ${{ inputs.historical_reconciliation_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-exact-release-evidence.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-panel/package-lock.json

      - name: Build control-panel artifact
        working-directory: apps/control-panel
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Deploy exact control-panel artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.123.0 pages deploy apps/control-panel/dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify exact Pages deployment evidence
        id: pages_evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PAGES_BRANCH: main
          PAGES_DEPLOYMENT_EVIDENCE_OUTPUT: control-panel-pages-deployment-evidence.json
        run: |
          set -euo pipefail
          node scripts/cloudflare/verify-pages-deployment.mjs
          {
            echo "deployment_id=$(jq -r '.deploymentId' control-panel-pages-deployment-evidence.json)"
            echo "deployment_url=$(jq -r '.deploymentUrl' control-panel-pages-deployment-evidence.json)"
            echo "pages_project=$(jq -r '.project' control-panel-pages-deployment-evidence.json)"
            echo "pages_branch=$(jq -r '.branch' control-panel-pages-deployment-evidence.json)"
            echo "deployed_sha=$(jq -r '.commitSha' control-panel-pages-deployment-evidence.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload control-panel deployment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: control-panel-pages-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: control-panel-pages-deployment-evidence.json
