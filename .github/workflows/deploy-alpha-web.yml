name: Deploy Alpha web (approved exact artifact)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA already validated by CI
        required: true
        type: string
      ci_run_id:
        description: Successful CI workflow run ID for the exact release SHA
        required: true
        type: string
      security_run_ids_json:
        description: JSON object containing exact CodeQL, dependency review, secret scan, and historical reconciliation run IDs
        required: false
        default: '{}'
        type: string
      target_environment:
        description: Cloudflare deployment class
        required: true
        type: choice
        options: [preview, mvp, production]
      pages_project:
        description: Cloudflare Pages project name
        required: true
        default: lythaus-web
        type: string
      pages_branch:
        description: Pages branch alias to deploy
        required: true
        default: alpha
        type: string
      web_base_url:
        description: Public HTTPS URL expected to serve this deployment
        required: true
        type: string
      api_base_url:
        description: Canonical Alpha API HTTPS /api URL
        required: true
        type: string
      admin_api_url:
        description: Cloudflare-protected admin API origin
        required: true
        type: string
      run_browser_smoke:
        description: Optional authenticated browser convenience smoke; never required for release activation
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA already validated by CI
        required: true
        type: string
      ci_run_id:
        description: Successful CI workflow run ID for the exact release SHA
        required: true
        type: string
      security_run_ids_json:
        description: JSON object containing exact CodeQL, dependency review, secret scan, and historical reconciliation run IDs
        required: false
        default: '{}'
        type: string
      target_environment:
        description: Cloudflare deployment class
        required: true
        type: string
      pages_project:
        description: Cloudflare Pages project name
        required: true
        type: string
      pages_branch:
        description: Pages branch alias to deploy
        required: true
        type: string
      web_base_url:
        description: Public HTTPS URL expected to serve this deployment
        required: true
        type: string
      api_base_url:
        description: Canonical Alpha API HTTPS /api URL
        required: true
        type: string
      admin_api_url:
        description: Cloudflare-protected admin API origin
        required: true
        type: string
      source_evidence_verified:
        description: The canonical parent already verified exact CI/security evidence
        required: false
        default: false
        type: boolean
      owner_testing_deployment:
        required: false
        default: false
        type: boolean
      owner_testing_recovery_exception:
        required: false
        default: false
        type: boolean
      run_browser_smoke:
        description: Optional authenticated browser convenience smoke; never required for release activation
        required: false
        default: false
        type: boolean
      app_only_preparation_json:
        description: Exact protected app-only preparation from the canonical transaction
        required: false
        default: ''
        type: string
      release_mode:
        description: Canonical caller's release mode; app-only is accepted only from production-release.yml
        required: false
        default: automatic
        type: string
    outputs:
      pages_deployment_id:
        description: Exact Pages deployment identifier selected for the release SHA
        value: ${{ jobs.deploy-and-smoke.outputs.pages_deployment_id }}
      pages_deployment_url:
        description: Exact Pages deployment URL selected for the release SHA
        value: ${{ jobs.deploy-and-smoke.outputs.pages_deployment_url }}
      pages_project:
        description: Canonical Flutter web Pages project
        value: ${{ jobs.deploy-and-smoke.outputs.pages_project }}
      pages_branch:
        description: Pages branch used for the release
        value: ${{ jobs.deploy-and-smoke.outputs.pages_branch }}
      deployed_sha:
        description: Pages commit SHA verified after deployment
        value: ${{ jobs.deploy-and-smoke.outputs.deployed_sha }}

permissions:
  actions: read
  contents: read

# Direct production deployments of lythaus-web share the canonical release
# lock. A reusable child called by that workflow uses a per-run group because
# its caller already holds the lock. Preview targets and other projects remain
# independently runnable.
concurrency:
  group: >-
    ${{ github.workflow_ref == format('{0}/.github/workflows/production-release.yml@refs/heads/main', github.repository)
        && format('lythaus-alpha-web-delegated-{0}', github.run_id)
        || (inputs.target_environment == 'production' && inputs.pages_project == 'lythaus-web'
            && 'lythaus-canonical-production-release')
        || format('lythaus-alpha-web-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment == 'production' && 'production' || inputs.target_environment }}
    timeout-minutes: 35
    env:
      RELEASE_MODE: ${{ inputs.release_mode || '' }}
    outputs:
      pages_deployment_id: ${{ steps.pages_evidence.outputs.deployment_id }}
      pages_deployment_url: ${{ steps.pages_evidence.outputs.deployment_url }}
      pages_project: ${{ steps.pages_evidence.outputs.pages_project }}
      pages_branch: ${{ steps.pages_evidence.outputs.pages_branch }}
      deployed_sha: ${{ steps.pages_evidence.outputs.deployed_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact-SHA CI and download immutable web artifact
        id: web_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          APP_ONLY_CANONICAL: ${{ github.workflow_ref == format('{0}/.github/workflows/production-release.yml@refs/heads/main', github.repository) && inputs.target_environment == 'production' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full commit SHA"; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ci_run_id must be numeric"; exit 1; }
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$RELEASE_SHA"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = "CI"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

          if [[ "${RELEASE_MODE:-}" == 'app_only' ]]; then
            test "$APP_ONLY_CANONICAL" = 'true' || { echo 'Unverified app-only workflow context.' >&2; exit 1; }
            # This branch is derived from the canonical dispatch, not a
            # reusable-workflow input. Hash the downloaded ZIP and deploy the
            # very bytes that passed safe extraction.
            node scripts/ci/verify-extract-app-artifact.mjs > "$RUNNER_TEMP/app-only-web-artifact.json"
            WEB_DIGEST="$(jq -er '.archiveDigest' "$RUNNER_TEMP/app-only-web-artifact.json")"
            mkdir -p downloaded
            mv "$RUNNER_TEMP/verified-app-only-artifact" downloaded/web
          else
            ARTIFACTS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts")
            WEB_DIGEST=$(jq -r '.artifacts[] | select(.name == "flutter-web-release") | .digest' <<<"$ARTIFACTS_JSON")
            test -n "$WEB_DIGEST" && test "$WEB_DIGEST" != "null"
            mkdir -p downloaded/web
            gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name flutter-web-release --dir downloaded/web
          fi
          test -f downloaded/web/index.html
          test -f downloaded/web/_headers
          test -f downloaded/web/_redirects
          scripts/secret-scan.sh --artifact downloaded/web
          bash scripts/check-web-security-headers.sh downloaded/web/_headers
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Require canonical Flutter Pages project
        env:
          PAGES_PROJECT: ${{ inputs.pages_project }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PAGES_PROJECT" = 'lythaus-web' || {
            echo 'Refusing Flutter web deployment to a non-canonical Pages project.' >&2
            exit 1
          }

      - name: Require exact production CI and security evidence
        if: inputs.target_environment == 'production' && inputs.source_evidence_verified != true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SECURITY_RUN_IDS_JSON: ${{ inputs.security_run_ids_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e 'type == "object"' <<<"$SECURITY_RUN_IDS_JSON" >/dev/null
          CODEQL_RUN_ID="$(jq -r '.CODEQL_RUN_ID // empty' <<<"$SECURITY_RUN_IDS_JSON")"
          DEPENDENCY_REVIEW_RUN_ID="$(jq -r '.DEPENDENCY_REVIEW_RUN_ID // empty' <<<"$SECURITY_RUN_IDS_JSON")"
          SECRET_SCAN_RUN_ID="$(jq -r '.SECRET_SCAN_RUN_ID // empty' <<<"$SECURITY_RUN_IDS_JSON")"
          HISTORICAL_RECONCILIATION_RUN_ID="$(jq -r '.HISTORICAL_RECONCILIATION_RUN_ID // empty' <<<"$SECURITY_RUN_IDS_JSON")"
          export CODEQL_RUN_ID DEPENDENCY_REVIEW_RUN_ID SECRET_SCAN_RUN_ID HISTORICAL_RECONCILIATION_RUN_ID
          node scripts/ci/verify-exact-release-evidence.mjs

      - name: Recheck app-only acceptance and live dependencies immediately before activation
        env:
          APP_ONLY_PREPARATION_JSON: ${{ inputs.app_only_preparation_json }}
          APP_ONLY_CANONICAL: ${{ github.workflow_ref == format('{0}/.github/workflows/production-release.yml@refs/heads/main', github.repository) && inputs.target_environment == 'production' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          LYTHAUS_WEB_PAGES_BRANCH: ${{ vars.LYTHAUS_WEB_PAGES_BRANCH }}
          LYTHAUS_ADMIN_PAGES_PROJECT: ${{ vars.LYTHAUS_ADMIN_PAGES_PROJECT }}
          PAGES_BRANCH: ${{ inputs.pages_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
          GH_TOKEN: ${{ github.token }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_MODE:-}" == app_only ]]; then
            test "$APP_ONLY_CANONICAL" = true
            test "$LYTHAUS_WEB_PAGES_BRANCH" = "$PAGES_BRANCH"
            export RELEASE_MODE=app_only
            PREVIOUS_PRODUCTION_SHA="$(jq -er '.previousProductionSha' <<<"$APP_ONLY_PREPARATION_JSON")"
            PREVIOUS_PRODUCTION_RUN_ID="$(jq -er '.previousRunId' <<<"$APP_ONLY_PREPARATION_JSON")"
            export PREVIOUS_PRODUCTION_SHA PREVIOUS_PRODUCTION_RUN_ID
            node scripts/ci/recheck-app-only-release.mjs
          fi

      - name: Require fresh protected native recovery evidence
        if: inputs.target_environment == 'production'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OWNER_TESTING_DEPLOYMENT: ${{ inputs.owner_testing_deployment }}
          OWNER_TESTING_RECOVERY_EXCEPTION: ${{ inputs.owner_testing_recovery_exception }}
          PLANETSCALE_OWNER_RECOVERY_EXCEPTION_JSON: ${{ vars.PLANETSCALE_OWNER_RECOVERY_EXCEPTION_JSON }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_PRODUCTION_BACKUP_ID: ${{ vars.PLANETSCALE_PRODUCTION_BACKUP_ID }}
        shell: bash
        run: node scripts/ci/verify-production-recovery-readiness.mjs
      - name: Recheck app-only Pages serving evidence
        if: inputs.target_environment == 'production' && github.event_name == 'workflow_dispatch' && inputs.release_mode == 'app_only'
        env:
          APP_ONLY_CANONICAL: ${{ github.workflow_ref == format('{0}/.github/workflows/production-release.yml@refs/heads/main', github.repository) && inputs.target_environment == 'production' }}
          APP_ONLY_PREPARATION_JSON: ${{ inputs.app_only_preparation_json }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LYTHAUS_WEB_PAGES_BRANCH: ${{ vars.LYTHAUS_WEB_PAGES_BRANCH }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: app_only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_MODE:-}" == app_only ]]; then
            test "$APP_ONLY_CANONICAL" = true
            node scripts/ci/recheck-app-only-serving-proof.mjs
          fi
      - name: Deploy immutable Pages artifact
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          PAGES_BRANCH: ${{ inputs.pages_branch }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ "${RELEASE_MODE:-}" == 'app_only' ]]; then
            npx --yes wrangler@4.123.0 pages deploy downloaded/web \
              --project-name "$PAGES_PROJECT" \
              --branch "$PAGES_BRANCH" \
              --commit-hash "$RELEASE_SHA" \
              --commit-dirty=false | tee "$RUNNER_TEMP/alpha-web-deploy-output.txt"
            deployment_url="$(node scripts/ci/extract-pages-deployment-url.mjs "$PAGES_PROJECT" "$RUNNER_TEMP/alpha-web-deploy-output.txt")"
            echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          else
            npx --yes wrangler@4.123.0 pages deploy downloaded/web \
              --project-name "$PAGES_PROJECT" \
              --branch "$PAGES_BRANCH" \
              --commit-hash "$RELEASE_SHA" \
              --commit-dirty=false
          fi

      - name: Verify exact Pages deployment evidence
        id: pages_evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ONLY_CANONICAL: ${{ github.workflow_ref == format('{0}/.github/workflows/production-release.yml@refs/heads/main', github.repository) && inputs.target_environment == 'production' }}
          APP_ONLY_PREPARATION_JSON: ${{ inputs.app_only_preparation_json }}
          RELEASE_MODE: ${{ inputs.release_mode || '' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          PAGES_BRANCH: ${{ inputs.pages_branch }}
          PAGES_ENVIRONMENT: ${{ inputs.target_environment == 'production' && 'production' || 'preview' }}
          PAGES_EXPECTED_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PAGES_DEPLOYMENT_EVIDENCE_OUTPUT: alpha-web-pages-deployment-evidence.json
        run: |
          set -euo pipefail
          node scripts/cloudflare/verify-pages-deployment.mjs
          if [[ "${RELEASE_MODE:-}" == 'app_only' ]]; then
            jq -e --arg branch "$PAGES_BRANCH" --arg sha "$RELEASE_SHA" '
              .project == "lythaus-web" and .environment == "production" and .branch == $branch and .commitSha == $sha
              and (.deploymentId | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))
              and (.deploymentUrl | test("^https://[a-z0-9-]+\\.lythaus-web\\.pages\\.dev$"))
            ' alpha-web-pages-deployment-evidence.json >/dev/null
          fi
          {
            echo "deployment_id=$(jq -r '.deploymentId' alpha-web-pages-deployment-evidence.json)"
            echo "deployment_url=$(jq -r '.deploymentUrl' alpha-web-pages-deployment-evidence.json)"
            echo "pages_project=$(jq -r '.project' alpha-web-pages-deployment-evidence.json)"
            echo "pages_branch=$(jq -r '.branch' alpha-web-pages-deployment-evidence.json)"
            echo "deployed_sha=$(jq -r '.commitSha' alpha-web-pages-deployment-evidence.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Write web deployment evidence
        if: success()
        env:
          WEB_GITHUB_DIGEST: ${{ steps.web_artifact.outputs.web_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          WEB_BASE_URL: ${{ inputs.web_base_url }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PAGES_DEPLOYMENT_ID: ${{ steps.pages_evidence.outputs.deployment_id }}
          PAGES_DEPLOYMENT_URL: ${{ steps.pages_evidence.outputs.deployment_url }}
        run: |
          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg webGithubArtifactDigest "$WEB_GITHUB_DIGEST" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg webBaseUrl "$WEB_BASE_URL" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg deploymentId "$PAGES_DEPLOYMENT_ID" \
            --arg deploymentUrl "$PAGES_DEPLOYMENT_URL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 2, commitSha: $commitSha, webGithubArtifactDigest: $webGithubArtifactDigest, ciRunId: $ciRunId, webBaseUrl: $webBaseUrl, environment: $environment, deploymentId: $deploymentId, deploymentUrl: $deploymentUrl, deployedAt: $date}' \
            > alpha-web-deployment-evidence.json

      - name: Upload browser and web deployment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: alpha-web-deployment-evidence-${{ inputs.release_sha }}
          path: |
            alpha-web-deployment-evidence.json
            alpha-web-pages-deployment-evidence.json
          if-no-files-found: warn

  browser-smoke:
    name: Run authenticated web browser smoke
    needs: deploy-and-smoke
    if: inputs.run_browser_smoke == true
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment == 'production' && 'production' || 'dev' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install browser smoke tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run optional web Alpha browser smoke
        env:
          WEB_BASE_URL: ${{ inputs.web_base_url }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          ADMIN_API_URL: ${{ inputs.admin_api_url }}
          RUNTIME_AUTH_API_BASE_URL: ${{ inputs.api_base_url }}
          RUNTIME_AUTH_EMAIL: ${{ inputs.target_environment == 'production' && secrets.CODEX_TEST_EMAIL || secrets.MVP_SMOKE_EMAIL }}
          RUNTIME_AUTH_PASSWORD: ${{ inputs.target_environment == 'production' && secrets.CODEX_TEST_PASSWORD || secrets.MVP_SMOKE_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BETA_SMOKE_REPORT_PATH: ${{ runner.temp }}/alpha-web-smoke-report.json
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 20 "$WEB_BASE_URL"
          node scripts/release/runtime-authenticated-command.mjs \
            --token-env LYTHAUS_RUNTIME_ACCESS_TOKEN -- node scripts/beta-smoke.mjs

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: alpha-web-smoke-evidence-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/alpha-web-smoke-report.json
          if-no-files-found: warn
