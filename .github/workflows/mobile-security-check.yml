name: Mobile Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check-pins-and-integrity:
    name: Validate mobile security contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for SPKI pin placeholders
        shell: bash
        run: |
          set -euo pipefail
          placeholder_matches="$(find . -name "*.dart" -type f -exec grep -Hn "sha256/.*REPLACE_WITH_SPKI\|sha256/.*YOUR_SPKI_PIN\|sha256/.*TODO\|sha256/.*FIXME" {} \; 2>/dev/null || true)"
          if [ -n "$placeholder_matches" ]; then
            echo "::error::Found SPKI pin placeholders in pin values:"
            printf '%s\n' "$placeholder_matches"
            exit 1
          fi

      - name: Check preview and production pin lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="lib/core/config/environment_config.dart"
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found"; exit 1; }
          get_state() {
            awk "/^const $1/,/^const $2/" "$ENV_FILE" \
              | sed -n 's/.*lifecycleState: PinLifecycleState\.\([a-z]*\).*/\1/p' \
              | head -n 1
          }
          for state in "$(get_state _previewMobileSecurity _previewConfig)" "$(get_state _prodMobileSecurity _prodConfig)"; do
            case "$state" in live|planned|deprecated|disabled) ;; *) echo "::error::Invalid or missing pin lifecycle state"; exit 1;; esac
          done

      - name: Reject strict pinning without validated pins
        shell: bash
        run: bash scripts/validate-mvp-tls-pinning.sh

      - name: Upload pin verification report
        uses: actions/upload-artifact@v6
        with:
          name: mobile-pin-report
          path: mobile-pin-report.json
          if-no-files-found: error

      - name: Check for security placeholders
        shell: bash
        run: |
          set -euo pipefail
          security_matches="$(find . -name "*.dart" -type f -exec grep -Hn "TODO.*[Ss]ecurity\|FIXME.*[Ss]ecurity\|PLACEHOLDER.*[Ss]ecurity" {} \; 2>/dev/null || true)"
          if [ -n "$security_matches" ]; then
            echo "::warning::Security-related placeholders require review:"
            printf '%s\n' "$security_matches"
          fi
