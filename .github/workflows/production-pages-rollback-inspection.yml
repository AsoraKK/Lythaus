name: Inspect production Pages rollback targets

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed protected main commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: lythaus-production-pages-rollback-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository_id == '1010752912' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify reviewed source and current protected branch
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')" = "$GITHUB_SHA"
          node --test scripts/tests/production-pages-rollback.test.mjs
      - name: Read the three canonical Pages deployments and their registered domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/inspect-production-pages-rollback.mjs
