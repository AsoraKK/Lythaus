name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
      - name: Write exact-SHA security evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/security-run-evidence
          printf '{"workflow":"CodeQL","headSha":"%s","conclusion":"success"}\n' "$GITHUB_SHA" > .artifacts/security-run-evidence/run.json
      - name: Upload exact-SHA security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-run-evidence-CodeQL-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/security-run-evidence/run.json
