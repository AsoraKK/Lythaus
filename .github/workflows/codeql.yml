name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect GitHub code scanning support
        id: code_scanning
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" || true)"
          supported="$(REPOSITORY_RESPONSE="$response" node -e 'try { const repository = JSON.parse(process.env.REPOSITORY_RESPONSE || "{}"); const security = repository.security_and_analysis ?? {}; const supported = security.advanced_security?.status === "enabled"; process.stdout.write(supported ? "true" : "false"); } catch { process.stdout.write("false"); }' 2>/dev/null || printf 'false')"
          if [[ "$supported" == "true" ]]; then
            {
              echo "upload=true"
              echo "mode=native-upload"
              echo "reason=github_code_scanning_enabled"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "upload=false"
              echo "mode=local-analysis"
              echo "reason=github_code_scanning_unavailable"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          upload: ${{ steps.code_scanning.outputs.upload }}
      - name: Write exact-SHA security evidence
        shell: bash
        env:
          CODEQL_MODE: ${{ steps.code_scanning.outputs.mode }}
          CODEQL_REASON: ${{ steps.code_scanning.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/security-run-evidence
          printf '{"workflow":"CodeQL","headSha":"%s","conclusion":"success","mode":"%s","reason":"%s"}\n' \
            "$GITHUB_SHA" "${CODEQL_MODE:-unknown}" "${CODEQL_REASON:-unknown}" \
            > .artifacts/security-run-evidence/run.json
      - name: Upload exact-SHA security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-run-evidence-CodeQL-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/security-run-evidence/run.json
