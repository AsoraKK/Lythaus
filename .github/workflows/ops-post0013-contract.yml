name: Derive live post-0013 schema contract

on:
  push:
    branches:
      - ops/release-e19c5ac4
    paths:
      - .github/workflows/ops-post0013-contract.yml

permissions:
  contents: read

jobs:
  derive-contract:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: 1fa4e08014096bb2357c1b725d1a3208a4e4607f
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact reviewed main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Derive and validate live post-0013 contract read-only
        shell: bash
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import pg from 'pg';
          import { expectedMigrationPrefix } from './scripts/ci/planetscale-migration-manifest.mjs';

          const { Client } = pg;
          const rawUrl = process.env.PLANETSCALE_SCHEMA_READ_DATABASE_URL ?? '';
          if (!rawUrl) throw new Error('PLANETSCALE_ADMIN_DATABASE_URL is required');
          const connection = new URL(rawUrl);
          if (connection.searchParams.get('sslmode') !== 'verify-full') throw new Error('live contract derivation requires sslmode=verify-full');
          if (connection.searchParams.get('sslrootcert') === 'system') connection.searchParams.delete('sslrootcert');
          const roleIdentifiers = JSON.parse(process.env.PSCALE_ROLE_IDENTIFIERS ?? '{}');
          const runtime = roleIdentifiers.lythaus_runtime;
          const admin = roleIdentifiers.lythaus_admin;
          const privacy = roleIdentifiers.lythaus_privacy;
          if (![runtime, admin, privacy].every((value) => /^pscale_api_[a-z0-9]+$/.test(value ?? ''))) {
            throw new Error('canonical PlanetScale role identifiers are required');
          }
          const applicationSchemas = ['identity', 'content', 'social', 'feed', 'moderation', 'privacy', 'trust', 'media', 'editorial', 'marketing', 'system'];
          const schemaParams = applicationSchemas.map((_, index) => `$${index + 1}`).join(', ');
          const client = new Client({ connectionString: connection.toString(), ssl: { rejectUnauthorized: true } });
          await client.connect();
          try {
            await client.query('BEGIN READ ONLY');
            const registry = await client.query('SELECT version, checksum FROM system.schema_migrations ORDER BY version');
            const expected = expectedMigrationPrefix('0013_marketing_waitlist.sql');
            if (registry.rows.length !== expected.length) throw new Error(`migration registry has ${registry.rows.length} entries; expected ${expected.length}`);
            expected.forEach((migration, index) => {
              const row = registry.rows[index];
              if (row?.version !== migration.name || row?.checksum !== migration.appliedSha256) {
                throw new Error(`migration registry mismatch: ${migration.name}`);
              }
            });

            const catalog = await client.query(`SELECT
              to_regclass('marketing.waitlist_signups') IS NOT NULL AS waitlist_table,
              to_regclass('marketing.waitlist_signups_created_cursor_idx') IS NOT NULL AS cursor_index,
              to_regclass('marketing.waitlist_signups_due_purge_idx') IS NOT NULL AS purge_index,
              to_regclass('system.rate_limit_windows') IS NOT NULL AS rate_limit_windows,
              to_regclass('feed.notification_devices') IS NOT NULL AS notification_devices,
              to_regclass('trust.user_activity_events') IS NOT NULL AS activity_events,
              to_regclass('moderation.appeal_review_votes') IS NOT NULL AS appeal_review_votes,
              EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'waitlist_signups_email_lookup_hmac_unique' AND contype = 'u') AS unique_hmac,
              NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'marketing' AND table_name = 'waitlist_signups'
                  AND column_name IN ('email', 'plain_email', 'raw_ip', 'ip_address', 'user_agent', 'turnstile_token')
              ) AS prohibited_columns_absent`);
            if (Object.values(catalog.rows[0] ?? {}).some((value) => value !== true)) throw new Error('post-0013 catalog contract is incomplete');

            const privileges = await client.query(`SELECT
              has_column_privilege($1, 'marketing.waitlist_signups', 'email_lookup_hmac', 'INSERT') AS runtime_insert_hmac,
              has_table_privilege($1, 'marketing.waitlist_signups', 'SELECT') AS runtime_select,
              has_column_privilege($2, 'marketing.waitlist_signups', 'email_ciphertext', 'SELECT') AS admin_select_ciphertext,
              has_column_privilege($2, 'marketing.waitlist_signups', 'email_lookup_hmac', 'SELECT') AS admin_select_hmac,
              has_column_privilege($2, 'marketing.waitlist_signups', 'status', 'UPDATE') AS admin_update_status,
              has_column_privilege($2, 'marketing.waitlist_signups', 'email_ciphertext', 'UPDATE') AS admin_update_ciphertext,
              has_table_privilege($3, 'marketing.waitlist_signups', 'DELETE') AS privacy_delete,
              has_column_privilege($3, 'marketing.waitlist_signups', 'purge_after', 'SELECT') AS privacy_select_purge,
              has_column_privilege($3, 'marketing.waitlist_signups', 'email_ciphertext', 'SELECT') AS privacy_select_ciphertext`, [runtime, admin, privacy]);
            const p = privileges.rows[0];
            if (!p?.runtime_insert_hmac || p.runtime_select || !p.admin_select_ciphertext || p.admin_select_hmac
              || !p.admin_update_status || p.admin_update_ciphertext || !p.privacy_delete || !p.privacy_select_purge || p.privacy_select_ciphertext) {
              throw new Error('post-0013 least-privilege contract failed');
            }

            const [relations, columns, constraints, indexes, functions, extensions] = await Promise.all([
              client.query(`SELECT table_type, table_schema, table_name FROM information_schema.tables WHERE table_schema IN (${schemaParams}) ORDER BY table_type, table_schema, table_name`, applicationSchemas),
              client.query(`SELECT table_schema, table_name, ordinal_position, column_name, udt_name, is_nullable, COALESCE(column_default, '') AS column_default FROM information_schema.columns WHERE table_schema IN (${schemaParams}) ORDER BY table_schema, table_name, ordinal_position`, applicationSchemas),
              client.query(`SELECT namespace.nspname AS table_schema, relation.relname AS table_name, constraint_row.conname, constraint_row.contype, constraint_row.convalidated, pg_get_constraintdef(constraint_row.oid, true) AS definition FROM pg_constraint constraint_row JOIN pg_class relation ON relation.oid = constraint_row.conrelid JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace WHERE namespace.nspname IN (${schemaParams}) ORDER BY namespace.nspname, relation.relname, constraint_row.conname`, applicationSchemas),
              client.query(`SELECT schemaname, tablename, indexname, indexdef FROM pg_indexes WHERE schemaname IN (${schemaParams}) ORDER BY schemaname, tablename, indexname`, applicationSchemas),
              client.query(`SELECT namespace.nspname AS function_schema, procedure.proname, pg_get_function_identity_arguments(procedure.oid) AS arguments, pg_get_function_result(procedure.oid) AS result_type, procedure.prosecdef, COALESCE(array_to_string(procedure.proconfig, ','), '') AS configuration FROM pg_proc procedure JOIN pg_namespace namespace ON namespace.oid = procedure.pronamespace WHERE namespace.nspname IN (${schemaParams}) ORDER BY namespace.nspname, procedure.proname, arguments`, applicationSchemas),
              client.query('SELECT extname, extversion FROM pg_extension ORDER BY extname'),
            ]);
            const sections = [
              ['relations', relations.rows],
              ['columns', columns.rows],
              ['constraints', constraints.rows],
              ['indexes', indexes.rows],
              ['functions', functions.rows],
              ['extensions', extensions.rows],
              ['migrations', registry.rows],
            ];
            const payload = sections.map(([name, rows]) => `--${name}--\n${rows.map((row) => JSON.stringify(row)).join('\n')}`).join('\n');
            const fingerprint = createHash('sha256').update(payload).digest('hex');
            const relationCount = relations.rowCount ?? relations.rows.length;
            await client.query('ROLLBACK');
            console.log(`PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT=${fingerprint}`);
            console.log(`PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT=${relationCount}`);
            console.log('Live post-0013 migration registry, catalog, and least-privilege checks passed.');
          } catch (error) {
            await client.query('ROLLBACK').catch(() => undefined);
            throw error;
          } finally {
            await client.end();
          }
          NODE
