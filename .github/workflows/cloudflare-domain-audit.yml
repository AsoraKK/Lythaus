name: Cloudflare account audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare/audit-account.mjs'
      - '.github/workflows/cloudflare-domain-audit.yml'
      - 'infrastructure/lythaus-resource-registry.json'
      - 'infrastructure/cloudflare/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-account-audit
  cancel-in-progress: false

jobs:
  inventory:
    name: Sanitized Cloudflare inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
      CLOUDFLARE_AUDIT_OUTPUT: .artifacts/provider-inventory/cloudflare.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Capture read-only account inventory
        run: node scripts/cloudflare/audit-account.mjs
      - name: Reject active legacy-named Cloudflare resources after cutover
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.resources.pages | type == "array"' .artifacts/provider-inventory/cloudflare.json >/dev/null
          jq -e '.resources.workers | type == "array"' .artifacts/provider-inventory/cloudflare.json >/dev/null
          jq -e '.resources.access | type == "array"' .artifacts/provider-inventory/cloudflare.json >/dev/null
          echo "Legacy-named resource count: $(jq '.legacyNamedResources | length' .artifacts/provider-inventory/cloudflare.json)"
      - name: Upload sanitized provider evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-account-audit-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/provider-inventory/cloudflare.json
