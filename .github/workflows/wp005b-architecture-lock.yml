name: WP005B authenticity architecture lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lythaus-wp005b-architecture-lock
  cancel-in-progress: false

jobs:
  bounded-qualification:
    name: Run bounded WP005B qualification
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Run WP005B offline contract tests
        run: npm run test:authenticity-wp005b

      - name: Run one bounded finalist qualification
        run: npm run authenticity:wp005b-architecture-lock -- --allow-network --output-dir="$RUNNER_TEMP/wp005b"

      - name: Upload sanitized WP005B evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lythaus-wp005b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wp005b/wp005b-final-result.json
            ${{ runner.temp }}/wp005b/wp005b-call-accounting.json
            ${{ runner.temp }}/wp005b/wp005b-budget-finalizer.json
            ${{ runner.temp }}/wp005b/wp005b-model-ranking.json
          if-no-files-found: error
