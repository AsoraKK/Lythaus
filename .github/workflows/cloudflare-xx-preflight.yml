name: Cloudflare XX account preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    if: github.repository_id == '1010752912' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the requested Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          account_id = '1287414aff8f43a171972562f83fbd22'
          account = f'/accounts/{account_id}'
          token = os.environ.get('CLOUDFLARE_API_TOKEN')
          if not token:
              raise SystemExit('CLOUDFLARE_API_TOKEN is unavailable to this job')

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())

          def observe(label, path):
              request = Request('https://api.cloudflare.com/client/v4' + path, method='GET',
                                headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              try:
                  response = opener.open(request, timeout=10)
              except HTTPError as error:
                  response = error
              except (URLError, TimeoutError):
                  print(json.dumps({'check': label, 'transport_error': True}))
                  return None
              with response:
                  try:
                      envelope = json.loads(response.read(1_000_000))
                  except (ValueError, UnicodeError):
                      envelope = {}
                  envelope = envelope if isinstance(envelope, dict) else {}
                  result = envelope.get('result')
                  success = response.status == 200 and envelope.get('success') is True
                  errors = envelope.get('errors')
                  summary = {'check': label, 'http': response.status, 'success': success}
                  if isinstance(errors, list):
                      summary['error_codes'] = [error['code'] for error in errors
                                                if isinstance(error, dict) and type(error.get('code')) is int]
                  if success and isinstance(result, list):
                      summary['returned_count'] = len(result)
                  if success and isinstance(result, dict):
                      summary['object_returned'] = True
                  print(json.dumps(summary))
                  return envelope if success else None

          identity = observe('account', account)
          details = identity.get('result') if identity else None
          if not isinstance(details, dict) or details.get('id') != account_id:
              raise SystemExit('Exact account identity was not verified')
          print(json.dumps({'verified_account_id': account_id, 'account_name_is_xx': details.get('name') == 'XX'}))

          zones = set()
          for page in range(1, 6):
              query = urlencode({'account.id': account_id, 'page': page, 'per_page': 50})
              inventory = observe(f'zones page {page}', '/zones?' + query)
              rows = inventory.get('result') if inventory else None
              info = inventory.get('result_info') if inventory else None
              if (not isinstance(rows, list) or not isinstance(info, dict)
                      or info.get('page') != page or type(info.get('total_pages')) is not int):
                  raise SystemExit('Zone inventory was incomplete')
              for row in rows:
                  zone_id = row.get('id') if isinstance(row, dict) else None
                  owner = row.get('account') if isinstance(row, dict) else None
                  if (not isinstance(owner, dict) or owner.get('id') != account_id
                          or not isinstance(zone_id, str) or not re.fullmatch(r'[0-9a-f]{32}', zone_id)
                          or zone_id in zones):
                      raise SystemExit('Unexpected zone identity in XX inventory')
                  zones.add(zone_id)
              if page >= info['total_pages']:
                  break
          else:
              raise SystemExit('Zone inventory exceeded the bounded page limit')
          if len(zones) > 10:
              raise SystemExit('Zone Logpush inspection exceeded the bounded request limit')

          checks = [
              ('account Logpush', account + '/logpush/jobs'),
              ('Gateway', account + '/gateway'),
              ('Access organization', account + '/access/organizations'),
              *[(f'zone Logpush {index}', f'/zones/{zone_id}/logpush/jobs')
                for index, zone_id in enumerate(sorted(zones), start=1)],
          ]
          results = [observe(label, path) for label, path in checks]
          if any(result is None for result in results):
              raise SystemExit('Account dependency inspection was incomplete')
          PY
