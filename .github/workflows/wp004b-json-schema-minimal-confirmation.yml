name: WP004B Minimal JSON Schema Confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json_schema_minimal_confirmation:
    name: Single GPT-OSS minimal JSON Schema confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run single bounded minimal JSON Schema confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/authenticity/wp004b-json-schema-minimal-confirmation.mjs --allow-network --output .artifacts/wp004b-json-schema-minimal-confirmation.json --journal .artifacts/wp004b-json-schema-minimal-confirmation-call-accounting.json
      - name: Finalize sanitized confirmation accounting
        if: always()
        run: node --experimental-strip-types scripts/authenticity/wp004b-budget-finalizer.mjs --journal .artifacts/wp004b-json-schema-minimal-confirmation-call-accounting.json --output .artifacts/wp004b-json-schema-minimal-confirmation-budget-finalizer.json --case-order H1 --max-calls 1
      - name: Stage sanitized confirmation artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target="wp004b-json-schema-minimal-confirmation-sanitized-artifacts"
          mkdir -p "$target"
          test -s .artifacts/wp004b-json-schema-minimal-confirmation.json
          test -s .artifacts/wp004b-json-schema-minimal-confirmation-call-accounting.json
          test -s .artifacts/wp004b-json-schema-minimal-confirmation-budget-finalizer.json
          cp -- .artifacts/wp004b-json-schema-minimal-confirmation.json "$target/final-result.json"
          cp -- .artifacts/wp004b-json-schema-minimal-confirmation-call-accounting.json "$target/call-accounting.json"
          cp -- .artifacts/wp004b-json-schema-minimal-confirmation-budget-finalizer.json "$target/budget-finalizer.json"
          test "$(find "$target" -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Upload sanitized confirmation artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp004b-json-schema-minimal-confirmation-result
          path: wp004b-json-schema-minimal-confirmation-sanitized-artifacts
          if-no-files-found: error
          retention-days: 7
