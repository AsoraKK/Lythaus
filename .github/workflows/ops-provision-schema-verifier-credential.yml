name: Temporary Lythaus schema verifier credential setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      GITHUB_ADMIN_TOKEN: ${{ secrets.CONSOLIDATION_GH_PAT }}
      PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
      EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
      EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
      PLANETSCALE_CONTRACT_AUDIT_OUTPUT: .artifacts/provider-inventory/planetscale-production-contract.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create least-privilege schema verifier role
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLANETSCALE_API_TOKEN"
          test -n "$GITHUB_ADMIN_TOKEN"
          test -n "$PSCALE_ROLE_IDENTIFIERS"
          test "$EXPECTED_DATABASE_SCHEMA_FINGERPRINT" = '672dc746e50b868d4997e3cb9fca47b5426747bc992db2bdc3a33f8d2671415c'
          test "$EXPECTED_DATABASE_RELATION_COUNT" = '94'
          response_file="$RUNNER_TEMP/lythaus-schema-verifier-role.json"
          payload="$(jq -n --arg name "lythaus-schema-verifier-${GITHUB_RUN_ID}" '{name:$name,ttl:31536000,inherited_roles:["pg_read_all_data"],require_where_on_delete:"on",require_where_on_update:"on"}')"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url 'https://api.planetscale.com/v1/organizations/lythaus/databases/lythaus-core/branches/main/roles' \
            --header "Authorization: Bearer ${PLANETSCALE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          if [[ "$http_code" != '200' && "$http_code" != '201' ]]; then
            echo "PlanetScale schema verifier role creation failed with HTTP $http_code." >&2
            jq -c '{error:(.error // .message // "unknown")}' "$response_file" >&2 || true
            exit 1
          fi
          role_url="$(jq -r '.access_host_url // empty' "$response_file")"
          role_username="$(jq -r '.username // empty' "$response_file")"
          role_password="$(jq -r '.password // empty' "$response_file")"
          role_database="$(jq -r '.database_name // empty' "$response_file")"
          test -n "$role_url" && test -n "$role_username" && test -n "$role_password" && test -n "$role_database"
          database_url="$(ROLE_URL="$role_url" ROLE_USERNAME="$role_username" ROLE_PASSWORD="$role_password" ROLE_DATABASE="$role_database" node --input-type=module -e '
            const raw = process.env.ROLE_URL;
            const url = raw.includes("://") ? new URL(raw) : new URL(`postgresql://${encodeURIComponent(process.env.ROLE_USERNAME)}:${encodeURIComponent(process.env.ROLE_PASSWORD)}@${raw.replace(/^\/+/, "")}/${encodeURIComponent(process.env.ROLE_DATABASE)}`);
            url.searchParams.set("sslmode", "verify-full");
            url.searchParams.delete("sslrootcert");
            process.stdout.write(url.toString());
          ')"
          echo "::add-mask::$database_url"
          GH_TOKEN="$GITHUB_ADMIN_TOKEN" gh secret set PLANETSCALE_SCHEMA_READ_DATABASE_URL \
            --repo "$GITHUB_REPOSITORY" --env production --body "$database_url"
          PLANETSCALE_SCHEMA_READ_DATABASE_URL="$database_url" \
            PSCALE_BRANCH_NAME=main \
            REQUIRE_PRODUCT_INTEGRITY_MIGRATION=true \
            node scripts/planetscale/audit-production-contract.mjs
          rm -f "$response_file"
          echo 'Dedicated read-only PlanetScale schema verifier configured and validated without printing its URL.'
