name: Support feedback scoped validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/support-feedback-pg17.yml'
      - 'api/openapi/openapi.yaml'
      - 'api/openapi/support-feedback.yaml'
      - 'api/openapi/dist/openapi.json'
      - 'apps/lythaus-public-api/src/index.ts'
      - 'apps/lythaus-public-api/tests/support-feedback-routing.test.mjs'
      - 'apps/lythaus-admin-api/src/index.ts'
      - 'apps/lythaus-admin-api/tests/support-feedback-routing.test.mjs'
      - 'apps/lythaus-jobs/src/index.ts'
      - 'lib/core/routing/app_router.dart'
      - 'lib/ui/screens/profile/settings_screen.dart'
      - 'lib/features/support/**'
      - 'test/features/support/**'
      - 'lib/generated/api_client/**'
      - 'apps/control-panel/package.json'
      - 'apps/control-panel/package-lock.json'
      - 'apps/control-panel/src/App.jsx'
      - 'apps/control-panel/src/components/Nav.jsx'
      - 'apps/control-panel/src/support-feedback-config*'
      - 'apps/control-panel/src/support-feedback-routing.test.jsx'
      - 'apps/control-panel/src/pages/SupportFeedback*'
      - 'database/planetscale/proposals/support-feedback.local.sql'
      - 'docs/runbooks/support-feedback-roadmap.md'
      - 'docs/testing/support-feedback-local-services.md'
      - 'packages/contracts/src/support-feedback.ts'
      - 'packages/contracts/tests/support-feedback.test.mjs'
      - 'packages/db/src/support-feedback*.ts'
      - 'packages/db/tests/support-feedback*.mjs'

permissions:
  contents: read

concurrency:
  group: support-feedback-pg17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lythaus_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lythaus_support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts
      - name: Run support contract, HTTP and runtime tests
        run: node --experimental-strip-types --experimental-test-module-mocks --test packages/contracts/tests/support-feedback.test.mjs packages/db/tests/support-feedback-http.test.mjs packages/db/tests/support-feedback-runtime.test.mjs apps/lythaus-public-api/tests/support-feedback-routing.test.mjs apps/lythaus-admin-api/tests/support-feedback-routing.test.mjs
      - name: Typecheck native support services
        run: npm run typecheck:native
      - name: Exercise isolated support services against PostgreSQL 17
        env:
          SUPPORT_LOCAL_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/lythaus_support_test?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks --test packages/db/tests/support-feedback.postgres.mjs

  owner-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-panel/package-lock.json
      - name: Install pinned control-panel dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/control-panel
      - name: Run control-panel tests
        run: npm test -- --silent=true
        working-directory: apps/control-panel
      - name: Build control panel
        run: npm run build
        working-directory: apps/control-panel

  member-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check support UI formatting
        run: dart format --output=none --set-exit-if-changed lib/features/support lib/core/routing/app_router.dart lib/ui/screens/profile/settings_screen.dart test/features/support
      - name: Print support UI formatter patch after a format failure
        if: failure()
        run: |
          dart format lib/features/support lib/core/routing/app_router.dart lib/ui/screens/profile/settings_screen.dart test/features/support || true
          git --no-pager diff --color=never -- lib/features/support lib/core/routing/app_router.dart lib/ui/screens/profile/settings_screen.dart test/features/support
      - name: Analyze support UI
        run: flutter analyze lib/features/support lib/core/routing/app_router.dart lib/ui/screens/profile/settings_screen.dart
      - name: Test support forms, history, cancellation and account switching
        run: flutter test test/features/support/presentation/support_feedback_screen_test.dart --reporter expanded
      - name: Test existing settings and application routes
        run: flutter test test/ui/screens/profile/settings_screen_test.dart test/core/routing/app_router_test.dart --reporter expanded
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Validate generated OpenAPI Dart client parity
        run: npm run openapi:test:dart
