name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository_hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install ripgrep and ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep shellcheck
      - name: Reject repository entropy
        run: node scripts/validate-repository-hygiene.mjs
      - name: Check active Lythaus naming
        run: bash scripts/check-branding.sh
      - name: Check documentation secret hygiene
        run: bash scripts/scan-doc-secrets.sh
      - name: Run repository secret scan
        run: scripts/secret-scan.sh
      - name: Reject retired provider dependencies
        run: node scripts/validate-no-retired-provider-dependencies.mjs

  workflow_lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download actionlint
        run: |
          set -euo pipefail
          mkdir -p ./bin
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.7 ./bin
      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2126
        run: ./bin/actionlint -color
      - name: Require immutable action pins
        run: npm run validate:workflow-action-pins
      - name: Validate production release contract
        run: npm run validate:production-release-contract
      - name: Validate read-only Cloudflare audit contract
        run: node --test scripts/tests/cloudflare-audit-contract.test.mjs
      - name: Validate read-only GitHub controls audit contract
        run: node --test scripts/tests/github-controls-audit.test.mjs

  native_runtime:
    name: Native Workers and PlanetScale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck:native
      - run: node --experimental-strip-types --test packages/security/tests/critical-security-policy.test.mjs
      - run: npm run test:native-architecture
      - run: node --test scripts/tests/real-email-acceptance-evidence.test.mjs
      - run: npm run test:product-integrity-runtime
      - run: npm run test:product-contracts
      - run: npm run test:critical-coverage
      - run: npm run test:authenticity-foundation
      - run: npm run test:database-identity
      - run: npm run test:budget
      - name: Validate release manifest contract
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: npm run validate:release-manifest
      - run: npm run validate:native-workers
      - run: npm run validate:native-scope
      - run: npm run validate:no-retired-provider-dependencies
      - run: npm run validate:planetscale-migrations
      - run: npm run validate:planetscale-extensions

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: npm ci --ignore-scripts --no-audit
      - run: flutter pub get
      - run: npm run openapi:lint
      - run: npm run openapi:bundle
      - run: npm run openapi:check:bundle
      - run: npm run openapi:validate:examples
      - name: Pin OpenAPI generator version
        env:
          OPENAPI_GENERATOR_CLI_SEARCH_URL: DEFAULT
        run: npx openapi-generator-cli version-manager set 7.7.0
      - run: npm run openapi:gen:dart
      - run: npm run openapi:check:dart
      - run: npm run openapi:test:dart
      - run: npm run openapi:test:contract

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: bash scripts/test-with-coverage.sh
      - run: bash scripts/check_coverage_gates.sh
      - name: Build immutable web release artifact
        run: |
          set -euo pipefail
          source cloudflare/pages-release.sh
          bash scripts/cf-pages-build.sh
          test -f build/web/_headers
          test -f build/web/_redirects
          test -f build/web/index.html
          bash scripts/check-web-security-headers.sh build/web/_headers
          bash scripts/check-web-release-hosts.sh
          if rg -n 'package:dio/io.dart|IOHttpClientAdapter|dart:io' \
            lib/core/network/dio_client.dart \
            lib/core/security/cert_pinning.dart; then
            echo "Web-incompatible import found in shared web runtime files"
            exit 1
          fi
      - name: Publish immutable web release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flutter-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7

  frontends:
    name: Web frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --ignore-scripts --no-audit --prefix apps/control-panel
      - run: npm ci --ignore-scripts --no-audit --prefix apps/marketing-site
      - run: npm --prefix apps/control-panel test
      - run: node --test apps/marketing-site/tests/*.test.mjs
      - run: npm --prefix apps/control-panel run build
      - run: npm --prefix apps/marketing-site run build

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: always()
    needs: [repository_hygiene, workflow_lint, native_runtime, openapi, flutter, frontends]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --ignore-scripts --no-audit --prefix apps/control-panel
      - run: npm ci --ignore-scripts --no-audit --prefix apps/marketing-site
      - name: Audit root dependencies
        run: node scripts/check-npm-audit.js
      - name: Audit control panel dependencies
        run: node scripts/check-npm-audit.js apps/control-panel
      - name: Audit marketing site dependencies
        run: node scripts/check-npm-audit.js apps/marketing-site
      - name: Write launch blockers summary
        if: always()
        shell: bash
        env:
          REPOSITORY_HYGIENE: ${{ needs.repository_hygiene.result }}
          WORKFLOW_LINT: ${{ needs.workflow_lint.result }}
          NATIVE_RUNTIME: ${{ needs.native_runtime.result }}
          OPENAPI: ${{ needs.openapi.result }}
          FLUTTER: ${{ needs.flutter.result }}
          FRONTENDS: ${{ needs.frontends.result }}
          DEPENDENCY_AUDIT: ${{ job.status }}
        run: |
          set -euo pipefail
          blockers=0
          {
            echo '## Launch blockers CI summary'
            echo
            echo '| Gate | Status |'
            echo '| --- | --- |'
            for pair in \
              "Repository hygiene:$REPOSITORY_HYGIENE" \
              "Workflow lint:$WORKFLOW_LINT" \
              "Native runtime:$NATIVE_RUNTIME" \
              "OpenAPI:$OPENAPI" \
              "Flutter:$FLUTTER" \
              "Web frontends:$FRONTENDS" \
              "Dependency audit:$DEPENDENCY_AUDIT"; do
              gate="${pair%%:*}"
              result="${pair#*:}"
              echo "| $gate | $result |"
              [[ "$result" == success ]] || blockers=$((blockers + 1))
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $blockers -eq 0 ]]
