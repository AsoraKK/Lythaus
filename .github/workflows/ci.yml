name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository_hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install ripgrep and ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep shellcheck
      - name: Reject repository entropy
        run: node scripts/validate-repository-hygiene.mjs
      - name: Check active Lythaus naming
        run: bash scripts/check-branding.sh
      - name: Check documentation secret hygiene
        run: bash scripts/scan-doc-secrets.sh
      - name: Run repository secret scan
        run: scripts/secret-scan.sh
      - name: Reject retired provider dependencies
        run: node scripts/validate-no-retired-provider-dependencies.mjs

  workflow_lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download actionlint
        run: |
          set -euo pipefail
          mkdir -p ./bin
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.7 ./bin
      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2126
        run: ./bin/actionlint -color
      - name: Require immutable action pins
        run: npm run validate:workflow-action-pins
      - name: Validate production release contract
        run: npm run validate:production-release-contract
      - name: Validate read-only Cloudflare audit contract
        run: node --test scripts/tests/cloudflare-audit-contract.test.mjs scripts/tests/attach-auth-email-consumer.test.mjs
      - name: Validate read-only GitHub controls audit contract
        run: node --test scripts/tests/github-controls-audit.test.mjs

  native_runtime:
    name: Native Workers and PlanetScale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run validate:cloudflare-hyperdrive-targets:manifest
      - run: npm run validate:ai-gateway-paths
      - run: npm run typecheck:native
      - name: Verify file-object safety with synthetic local fixtures
        run: node --test scripts/tests/file-io-security.test.mjs
      - name: Verify private auth-email service boundary in workerd
        run: node --test --test-timeout=60000 scripts/tests/private-email-binding.workerd.mjs
      - name: Verify owner profile posts in workerd
        run: node --test --test-timeout=60000 apps/lythaus-public-api/tests/owner-content-reader.workerd.mjs
      - name: Verify mailbox provider observation in workerd
        run: node --test --test-timeout=60000 apps/lythaus-auth-acceptance-coordinator/tests/mailbox-provider.workerd.mjs
      - run: node --experimental-strip-types --test packages/security/tests/critical-security-policy.test.mjs
      - name: Verify credential-bearing provider redirect boundaries in workerd
        run: node --test --test-timeout=60000 scripts/tests/auth-provider-redirects.workerd.mjs
      - run: npm run test:native-architecture
      - name: Verify owner-only read-only account support
        run: node --experimental-strip-types --experimental-test-module-mocks --test packages/contracts/tests/account-support.test.mjs apps/lythaus-admin-api/tests/account-support-runtime.test.mjs apps/lythaus-admin-api/tests/account-support-handler.test.mjs
      - name: Verify bounded owner-only Overview analytics
        run: node --experimental-strip-types --experimental-test-module-mocks --test apps/lythaus-admin-api/tests/overview-policy.test.mjs apps/lythaus-admin-api/tests/overview-runtime.test.mjs apps/lythaus-admin-api/tests/overview-handler.test.mjs
      - name: Verify owner-testing authentication release scope
        run: node --test scripts/tests/owner-testing-auth-scope.test.mjs
      - run: node --test scripts/tests/real-email-acceptance-evidence.test.mjs
      - run: npm run test:product-integrity-runtime
      - run: npm run test:product-contracts
      - name: Verify monthly reputation and candidate peer policy
        run: >-
          node --experimental-strip-types --experimental-test-coverage
          '--test-coverage-include=packages/contracts/src/monthly-*.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test packages/contracts/tests/monthly-reputation.test.mjs
          packages/contracts/tests/monthly-peer-appeal.test.mjs
          packages/contracts/tests/monthly-earning.test.mjs
          packages/contracts/tests/monthly-maintenance.test.mjs
      - run: npm run test:critical-coverage
      - run: npm run test:authenticity-foundation
      - run: npm run test:database-identity
      - run: npm run test:budget
      - run: npm ci --ignore-scripts --prefix apps/lythaus-authenticity-runtime
      - run: npx tsc -p apps/lythaus-authenticity-runtime/tsconfig.json --noEmit
      - run: node --experimental-strip-types --test packages/authenticity/tests/beta.test.mjs packages/authenticity/tests/wp005a.test.mjs packages/authenticity/tests/wp005b.test.mjs
      - name: Exercise private alpha hardening regressions
        run: npm run test:authenticity-private-alpha
      - run: node --test scripts/tests/authenticity-beta-release.test.mjs
      - run: python3 apps/lythaus-authenticity-runtime/container/test_artifacts.py
      - run: python3 scripts/tests/test_beta_cpu_smoke.py
      - run: npm run test:authenticity-cpu-orchestration
      - run: python3 apps/lythaus-authenticity-runtime/container/test_supervisor.py
      - name: Record code-only Linux capacity
        run: python3 scripts/ci/authenticity-linux-capacity.py
      - name: Validate non-root process supervision without model artifacts
        run: |
          docker build --target code-validation -f apps/lythaus-authenticity-runtime/container/Dockerfile -t lythaus-beta-code-validation .
          test "$(docker inspect lythaus-beta-code-validation --format '{{.Config.User}}')" = '65532:65532'
          docker run --rm --network none --memory 256m --cpus 1 --pids-limit 32 lythaus-beta-code-validation
      - name: Validate release manifest contract
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: npm run validate:release-manifest
      - run: npm run validate:native-workers
      - run: npm run validate:native-scope
      - run: npm run validate:no-retired-provider-dependencies
      - run: npm run validate:planetscale-migrations
      - run: node scripts/ci/verify-planetscale-production-schema.mjs --manifest-only
      - run: npm run test:planetscale-production-migrations
      - run: npm run validate:planetscale-extensions
      - run: node --test scripts/tests/provider-audit-contract.test.mjs
      - run: node --test scripts/tests/production-worker-probe.test.mjs
      - run: node --test scripts/tests/production-gates.test.mjs
      - run: npm run validate:production-gates
      - run: node --test scripts/tests/public-waitlist-cutover.test.mjs

  activity_pilot:
    name: Disabled activity pilot integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lythaus_auth_test_activity_pilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lythaus_auth_test_activity_pilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lythaus_auth_test_activity_pilot
      ACTIVITY_PILOT_FIXTURE_OUTPUT: /tmp/lythaus-activity-snapshot.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run validate:planetscale-postgres17
      - name: Verify purpose contracts and privacy hooks
        run: >-
          node --experimental-strip-types --experimental-test-coverage
          --test packages/contracts/tests/activity-measurement.test.mjs
          apps/lythaus-public-api/tests/activity-measurement-handler.test.mjs
          apps/lythaus-admin-api/tests/activity-measurement-handler.test.mjs
          apps/lythaus-jobs/tests/activity-measurement.test.mjs
      - name: Verify restricted PG17 races and actual native routes and Workflows
        run: >-
          node --experimental-strip-types --test --test-concurrency=1 --test-timeout=120000
          packages/db/tests/activity-measurement.postgres.mjs
          packages/db/tests/activity-integration.postgres.mjs
      - run: npm ci --ignore-scripts --no-audit --prefix apps/control-panel
      - name: Build disabled-purpose synthetic visual fixture
        env:
          VITE_ACTIVITY_MEASUREMENT_PILOT: 'true'
        run: npm --prefix apps/control-panel run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify labelled synthetic responsive and keyboard rendering
        env:
          ACTIVITY_PILOT_BROWSER_OUTPUT: build/activity-pilot-browser
        run: |
          set -euo pipefail
          npm --prefix apps/control-panel run preview -- --host 127.0.0.1 --port 5183 --strictPort > /tmp/activity-preview.log 2>&1 &
          activity_preview_pid=$!
          trap 'kill "$activity_preview_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5183/ > /dev/null; then break; fi
            sleep 1
          done
          ACTIVITY_PILOT_BROWSER_ENGINE=chromium node scripts/tests/activity-pilot.browser.mjs
          ACTIVITY_PILOT_BROWSER_ENGINE=webkit node scripts/tests/activity-pilot.browser.mjs
      - name: Upload purpose-local synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: activity-pilot-browser-evidence
          path: build/activity-pilot-browser
          if-no-files-found: warn
          retention-days: 7

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: npm ci --ignore-scripts --no-audit
      - name: Prepare canonical Dart client serializers
        run: node scripts/validate-openapi-dart-client.mjs --prepare-for-flutter
      - run: flutter pub get
      - run: npm run openapi:lint
      - name: Spectral lint
        run: |
          node --test scripts/tests/spectral-glob.test.mjs
          npx spectral lint api/openapi/openapi.yaml
      - run: npm run openapi:bundle
      - run: npm run openapi:check:bundle
      - run: npm run openapi:validate:examples
      - name: Install pinned oasdiff
        env:
          OASDIFF_VERSION: 1.23.0
          OASDIFF_SHA256: 972b10535c3db4366b9dc3ebc11ca021279af3095267c3cffdca854a3a3c4f89
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/Tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${OASDIFF_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" oasdiff
          chmod +x "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare base OpenAPI contract
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:api/openapi/dist/openapi.json \
            > "$RUNNER_TEMP/openapi-base.json"
      - name: Report OpenAPI diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          oasdiff changelog \
            "$RUNNER_TEMP/openapi-base.json" \
            api/openapi/dist/openapi.json \
            --format githubactions
      - name: Enforce semver when breaking
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SPEC="$RUNNER_TEMP/openapi-base.json"
          if oasdiff breaking "$BASE_SPEC" api/openapi/dist/openapi.json --fail-on ERR --format githubactions; then
            exit 0
          fi
          CURR=$(node -pe 'JSON.parse(require("node:fs").readFileSync("api/openapi/dist/openapi.json","utf8")).info?.version ?? ""')
          PREV=$(node -pe 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).info?.version ?? ""' "$BASE_SPEC")
          echo "Breaking changes detected. Prev=$PREV Curr=$CURR"
          node - "$PREV" "$CURR" <<'NODE'
          const parse = value => {
            const match = String(value).trim().match(/^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?$/i);
            return match ? [Number(match[1]), Number(match[2] || 0), Number(match[3] || 0)] : null;
          };
          const [previous, current] = process.argv.slice(2).map(parse);
          if (!previous || !current) {
            console.error('Unable to compare OpenAPI versions');
            process.exit(1);
          }
          const firstDifference = current.findIndex((part, index) => part !== previous[index]);
          process.exit(firstDifference >= 0 && current[firstDifference] > previous[firstDifference] ? 0 : 1);
          NODE
      - name: Pin OpenAPI generator version
        env:
          OPENAPI_GENERATOR_CLI_SEARCH_URL: DEFAULT
        run: npx openapi-generator-cli version-manager set 7.7.0
      - run: npm run openapi:gen:dart
      - run: npm run openapi:check:dart
      - run: npm run openapi:test:dart
      - name: Generate OpenAPI docs pre-release bundle
        run: npm run openapi:docs
      - run: npm run openapi:test:contract
      - name: Upload OpenAPI contract artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openapi-contract-artifacts
          path: |
            api/openapi/dist/openapi.json
      - name: Upload bundled OpenAPI spec
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openapi.json
          path: api/openapi/dist/openapi.json
      - name: Upload OpenAPI docs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openapi-docs
          path: api/openapi/dist/index.html

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Dart formatter file discovery tool
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Prepare canonical Dart client serializers
        run: node scripts/validate-openapi-dart-client.mjs --prepare-for-flutter
      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          set -euo pipefail
          command -v rg >/dev/null
          rg --files -g '*.dart' \
            -g '!lib/generated/api_client.dart' \
            -g '!lib/generated/api_client/**' \
            -g '!.dart_tool/**' \
            | xargs -r dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: node --test scripts/tests/version-web-entrypoints.test.mjs
      - run: bash scripts/test-with-coverage.sh
      - run: bash scripts/check_coverage_gates.sh
      - name: Build immutable web release artifact
        run: |
          set -euo pipefail
          source cloudflare/pages-release.sh
          bash scripts/cf-pages-build.sh
          test -f build/web/_headers
          test -f build/web/_redirects
          test -f build/web/index.html
          bash scripts/check-web-security-headers.sh build/web/_headers
          bash scripts/check-web-release-hosts.sh
          if rg -n 'package:dio/io.dart|IOHttpClientAdapter|dart:io' \
            lib/core/network/dio_client.dart \
            lib/core/security/cert_pinning.dart; then
            echo "Web-incompatible import found in shared web runtime files"
            exit 1
          fi
      - name: Publish immutable web release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: flutter-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Enforce per-module authentication coverage
        run: node scripts/check-auth-flutter-coverage.mjs
      - name: Install authentication test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify rendered private monthly rewards
        env:
          QA_COMMIT: ${{ github.sha }}
        run: |
          MONTHLY_REWARDS_ENGINE=chromium node --experimental-strip-types --test --test-timeout=600000 scripts/tests/monthly-rewards.browser.mjs
          MONTHLY_REWARDS_ENGINE=webkit node --experimental-strip-types --test --test-timeout=600000 scripts/tests/monthly-rewards.browser.mjs
      - name: Upload monthly rewards visual evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: monthly-rewards-browser-evidence
          path: build/monthly-rewards-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Verify rendered Flutter authentication journey
        run: node --experimental-strip-types --test --test-timeout=600000 scripts/tests/flutter-auth.browser.mjs scripts/tests/optional-profile.browser.mjs scripts/tests/guest-account-entry.browser.mjs scripts/tests/native-notifications.browser.mjs scripts/tests/privacy-requests.browser.mjs
      - name: Upload guest tag search browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: guest-tag-search-browser-evidence
          path: build/guest-search-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Verify rendered member profile states
        env:
          AUTH_WEB_ARTIFACT_DIR: build/web
          PROFILE_VISUAL_QA_DIR: build/profile-visual-evidence
          QA_COMMIT: ${{ github.sha }}
        run: node --experimental-strip-types --test --test-timeout=600000 scripts/tests/profile-visual-qa.browser.mjs
      - name: Upload member profile visual evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: member-profile-visual-evidence
          path: build/profile-visual-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Build content journey regression fixture
        run: flutter build web --debug --no-pub --no-wasm-dry-run --target test/browser/content_journey_entry.dart --output build/content-journey-web
      - name: Verify rendered content journey and durable recovery
        env:
          QA_COMMIT: ${{ github.sha }}
        run: node scripts/tests/content-journey.browser.mjs
      - name: Upload content journey browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: content-journey-browser-evidence
          path: build/content-journey-evidence
          if-no-files-found: warn
          retention-days: 7

  frontends:
    name: Web frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --ignore-scripts --no-audit --prefix apps/control-panel
      - run: npm ci --ignore-scripts --no-audit --prefix apps/marketing-site
      - run: npm --prefix apps/control-panel test
      - run: node --test apps/marketing-site/tests/*.test.mjs
      - run: npm --prefix apps/control-panel run build
      - run: npm --prefix apps/marketing-site run build
      - name: Verify critical marketing output files
        working-directory: apps/marketing-site
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/features/index.html
          test -f dist/pricing/index.html
          test -f dist/about/index.html
          test -f dist/ai-moderation/index.html
          test -f dist/contact/index.html
          echo "All critical marketing site files present"
      - run: node scripts/cloudflare/validate-marketing-output.mjs apps/marketing-site/dist
      - name: Install homepage test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify existing browsers receive new app entrypoints
        run: node scripts/tests/web-release-cache.browser.mjs
      - name: Verify homepage optical and accessibility contracts
        run: npm run marketing:test:browser
      - name: Verify rendered email authentication controls
        run: |
          node --test --test-name-pattern='^chromium ' --test-timeout=60000 apps/marketing-site/tests/auth-journey.browser.mjs
          node --test --test-name-pattern='^webkit ' --test-timeout=60000 apps/marketing-site/tests/auth-journey.browser.mjs
      - name: Verify protected email confirmation controls
        run: node --experimental-strip-types --test --test-timeout=60000 apps/lythaus-auth-acceptance-coordinator/tests/email-landing.browser.mjs

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: always()
    needs: [repository_hygiene, workflow_lint, native_runtime, openapi, flutter, frontends]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --ignore-scripts --no-audit --prefix apps/control-panel
      - run: npm ci --ignore-scripts --no-audit --prefix apps/marketing-site
      - name: Audit root dependencies
        run: node scripts/check-npm-audit.js
      - name: Audit control panel dependencies
        run: node scripts/check-npm-audit.js apps/control-panel
      - name: Audit marketing site dependencies
        run: node scripts/check-npm-audit.js apps/marketing-site
      - name: Install standalone materialiser dependencies
        run: npm ci --ignore-scripts --no-audit --prefix ml/datasets/tools/materialise
      - name: Verify materialiser image decoding
        run: npm --prefix ml/datasets/tools/materialise test
      - name: Audit standalone materialiser dependencies
        run: node scripts/check-npm-audit.js ml/datasets/tools/materialise
      - name: Write launch blockers summary
        if: always()
        shell: bash
        env:
          REPOSITORY_HYGIENE: ${{ needs.repository_hygiene.result }}
          WORKFLOW_LINT: ${{ needs.workflow_lint.result }}
          NATIVE_RUNTIME: ${{ needs.native_runtime.result }}
          OPENAPI: ${{ needs.openapi.result }}
          FLUTTER: ${{ needs.flutter.result }}
          FRONTENDS: ${{ needs.frontends.result }}
          DEPENDENCY_AUDIT: ${{ job.status }}
        run: |
          set -euo pipefail
          blockers=0
          {
            echo '## Launch blockers CI summary'
            echo
            echo '| Gate | Status |'
            echo '| --- | --- |'
            for pair in \
              "Repository hygiene:$REPOSITORY_HYGIENE" \
              "Workflow lint:$WORKFLOW_LINT" \
              "Native runtime:$NATIVE_RUNTIME" \
              "OpenAPI:$OPENAPI" \
              "Flutter:$FLUTTER" \
              "Web frontends:$FRONTENDS" \
              "Dependency audit:$DEPENDENCY_AUDIT"; do
              gate="${pair%%:*}"
              result="${pair#*:}"
              echo "| $gate | $result |"
              [[ "$result" == success ]] || blockers=$((blockers + 1))
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $blockers -eq 0 ]]
