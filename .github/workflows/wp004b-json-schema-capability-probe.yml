name: WP004B JSON Schema Capability Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json_schema_capability_probe:
    name: Bounded GPT-OSS JSON Schema capability isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run bounded JSON Schema capability probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/authenticity/wp004b-json-schema-capability-probe.mjs --allow-network --output .artifacts/wp004b-json-schema-capability.json --journal .artifacts/wp004b-json-schema-capability-call-accounting.json
      - name: Finalize sanitized capability accounting
        if: always()
        run: node --experimental-strip-types scripts/authenticity/wp004b-budget-finalizer.mjs --journal .artifacts/wp004b-json-schema-capability-call-accounting.json --output .artifacts/wp004b-json-schema-capability-budget-finalizer.json --case-order G1,G2 --max-calls 2
      - name: Stage sanitized capability artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target="wp004b-json-schema-capability-sanitized-artifacts"
          mkdir -p "$target"
          test -s .artifacts/wp004b-json-schema-capability.json
          test -s .artifacts/wp004b-json-schema-capability-call-accounting.json
          test -s .artifacts/wp004b-json-schema-capability-budget-finalizer.json
          cp -- .artifacts/wp004b-json-schema-capability.json "$target/final-result.json"
          cp -- .artifacts/wp004b-json-schema-capability-call-accounting.json "$target/call-accounting.json"
          cp -- .artifacts/wp004b-json-schema-capability-budget-finalizer.json "$target/budget-finalizer.json"
          test "$(find "$target" -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Upload sanitized capability artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp004b-json-schema-capability-result
          path: wp004b-json-schema-capability-sanitized-artifacts
          if-no-files-found: error
          retention-days: 7
