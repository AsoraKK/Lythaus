      - name: Probe admin candidate without production traffic (CANDIDATE gate)
        if: contains(steps.release_plan.outputs.changed_components_json, '"admin"')
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0016_transactional_email_envelope_boundary.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-admin-api-development
          PRODUCTION_ADMIN_API_BASE_URL: ${{ vars.PRODUCTION_ADMIN_API_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/admin-candidate-probe.json
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=CANDIDATE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=admin_candidate_runtime_probe_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=Admin candidate readiness or runtime probe failed' >> "$GITHUB_ENV"
          export PRODUCTION_WORKER_VERSION_ID="$ADMIN_WORKER_VERSION_ID"
          export EXPECTED_WORKER_SOURCE_SHA="$ADMIN_WORKER_SOURCE_SHA"
          node scripts/ci/probe-production-workers.mjs
      - name: Probe jobs candidate without production traffic (CANDIDATE gate)
        if: contains(steps.release_plan.outputs.changed_components_json, '"jobs"')
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0016_transactional_email_envelope_boundary.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-jobs-development
          PRODUCTION_JOBS_API_BASE_URL: ${{ vars.PRODUCTION_JOBS_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/jobs-candidate-probe.json
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=CANDIDATE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=jobs_candidate_compatibility_probe_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=Jobs candidate readiness or runtime compatibility probe failed' >> "$GITHUB_ENV"
          export PRODUCTION_WORKER_VERSION_ID="$JOBS_WORKER_VERSION_ID"
          export EXPECTED_WORKER_SOURCE_SHA="$JOBS_WORKER_SOURCE_SHA"
          node scripts/ci/probe-production-workers.mjs
      - name: Mark candidates ready after candidate probes (CANDIDATE gate)
        run: |
          # shellcheck disable=SC2129
          echo "CANDIDATE_STATE=CANDIDATE_READY" >> "$GITHUB_ENV"
          node scripts/ci/transition-release-state.mjs CANDIDATE_READY
      - name: PRODUCT_ACCEPTANCE - Mark human acceptance required
        if: steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE'
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=acceptance_state_transition_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=auth acceptance state transition failed' >> "$GITHUB_ENV"
          node scripts/ci/transition-release-state.mjs PRODUCT_ACCEPTANCE_REQUIRED
      - name: PRODUCT_ACCEPTANCE - Mark standard acceptance not required
        if: steps.release_plan.outputs.release_class == 'STANDARD_RELEASE'
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=standard_acceptance_state_transition_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=standard release acceptance state transition failed' >> "$GITHUB_ENV"
          node scripts/ci/transition-release-state.mjs PRODUCT_ACCEPTANCE_NOT_REQUIRED
      - name: Validate or create the exact-candidate Keeper acceptance run (PRODUCT_ACCEPTANCE gate)
        if: steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXISTING_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE'
            echo 'RELEASE_FAILURE_CODE=keeper_certification_unavailable'
            echo 'RELEASE_FAILURE_MESSAGE=protected Keeper acceptance certification could not be established'
          } >> "$GITHUB_ENV"
          base='https://admin.lythaus.co/api/admin/production-auth-acceptance'
          coordinator_response_file="$RUNNER_TEMP/production-cutover/coordinator-request.json"
          test -n "$DATABASE_READINESS_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          curl_headers=(
            -H 'accept: application/json'
            -H "x-lythaus-readiness-token: ${DATABASE_READINESS_TOKEN}"
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )
          for required_dependency in \
            PUBLIC_WORKER_VERSION_ID PUBLIC_WORKER_SOURCE_SHA PUBLIC_WORKER_STATUS PUBLIC_WORKER_PROVENANCE \
            ADMIN_WORKER_VERSION_ID ADMIN_WORKER_SOURCE_SHA ADMIN_WORKER_STATUS ADMIN_WORKER_PROVENANCE \
            JOBS_WORKER_VERSION_ID JOBS_WORKER_SOURCE_SHA JOBS_WORKER_STATUS JOBS_WORKER_PROVENANCE \
            COORDINATOR_WORKER_VERSION_ID COORDINATOR_WORKER_SOURCE_SHA COORDINATOR_WORKER_STATUS COORDINATOR_WORKER_PROVENANCE; do
            test -n "${!required_dependency:-}" || { echo "Missing acceptance dependency field: $required_dependency" >&2; exit 1; }
          done
          candidate_dependencies="$(jq -c -n \
            --arg public_version "$PUBLIC_WORKER_VERSION_ID" --arg public_source "$PUBLIC_WORKER_SOURCE_SHA" --arg public_status "$PUBLIC_WORKER_STATUS" --arg public_provenance "$PUBLIC_WORKER_PROVENANCE" \
            --arg admin_version "$ADMIN_WORKER_VERSION_ID" --arg admin_source "$ADMIN_WORKER_SOURCE_SHA" --arg admin_status "$ADMIN_WORKER_STATUS" --arg admin_provenance "$ADMIN_WORKER_PROVENANCE" \
            --arg jobs_version "$JOBS_WORKER_VERSION_ID" --arg jobs_source "$JOBS_WORKER_SOURCE_SHA" --arg jobs_status "$JOBS_WORKER_STATUS" --arg jobs_provenance "$JOBS_WORKER_PROVENANCE" \
            --arg coordinator_version "$COORDINATOR_WORKER_VERSION_ID" --arg coordinator_source "$COORDINATOR_WORKER_SOURCE_SHA" --arg coordinator_status "$COORDINATOR_WORKER_STATUS" --arg coordinator_provenance "$COORDINATOR_WORKER_PROVENANCE" \
            '{public:{workerName:"lythaus-public-api-development",versionId:$public_version,sourceSha:$public_source,status:$public_status,provenance:$public_provenance},admin:{workerName:"lythaus-admin-api-development",versionId:$admin_version,sourceSha:$admin_source,status:$admin_status,provenance:$admin_provenance},jobs:{workerName:"lythaus-jobs-development",versionId:$jobs_version,sourceSha:$jobs_source,status:$jobs_status,provenance:$jobs_provenance},coordinator:{workerName:"lythaus-auth-acceptance-coordinator-development",versionId:$coordinator_version,sourceSha:$coordinator_source,status:$coordinator_status,provenance:$coordinator_provenance}}')"
          candidate_source_sha="$PUBLIC_WORKER_SOURCE_SHA"
          uploaded_at=''
          staged_at=''
          coordinator_request() {
            local method="$1"
            local url="$2"
            local payload="${3:-}"
            local attempt status
            for attempt in 1 2 3; do
              if [[ "$method" = GET ]]; then
                status="$(curl --silent --show-error --max-time 30 \
                  -o "$coordinator_response_file" -w '%{http_code}' \
                  "${curl_headers[@]}" "$url" || true)"
              else
                status="$(curl --silent --show-error --max-time 30 \
                  -o "$coordinator_response_file" -w '%{http_code}' \
                  -X "$method" "${curl_headers[@]}" -H 'content-type: application/json' \
                  --data "$payload" "$url" || true)"
              fi
              case "$status" in
                2??)
                  cat "$coordinator_response_file"
                  return 0
                  ;;
                401)
                  if [[ "$attempt" -lt 3 ]]; then
                    sleep "$attempt"
                    continue
                  fi
                  ;;
              esac
              echo "Protected coordinator request failed with HTTP ${status:-000}." >&2
              return 1
            done
          }
          run_id=''
          if [[ -n "$EXISTING_ACCEPTANCE_RUN_ID" ]]; then
            [[ "$EXISTING_ACCEPTANCE_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            run_json="$(coordinator_request GET "$base/runs/$EXISTING_ACCEPTANCE_RUN_ID")"
            jq -e --arg sha "$RELEASE_SHA" --arg version "$PUBLIC_WORKER_VERSION_ID" '
              .acceptanceRunId != null and .releaseSha == $sha and .candidate.workerName == "lythaus-public-api-development"
              and .candidate.workerVersionId == $version and (.status == "pending" or .status == "in_progress" or .status == "completed" or .status == "expired")
            ' <<<"$run_json" >/dev/null
            expires_at="$(jq -r '.expiresAt' <<<"$run_json")"
            uploaded_at="$(jq -r '.candidate.uploadedAt' <<<"$run_json")"
            staged_at="$(jq -r '.candidate.stagedAt' <<<"$run_json")"
            candidate_source_sha="$(jq -r '.candidate.sourceReleaseSha // empty' <<<"$run_json")"
            [[ "$candidate_source_sha" =~ ^[0-9a-f]{40}$ ]] || candidate_source_sha="$PUBLIC_WORKER_SOURCE_SHA"
            run_dependencies="$(jq -c '.candidateDependencies // empty' <<<"$run_json")"
            run_rollback_snapshot="$(jq -c '.rollbackSnapshot // empty' <<<"$run_json")"
            test -n "$run_rollback_snapshot" || {
              echo 'Existing acceptance run lacks exact rollback snapshot provenance; refusing to resume it.' >&2
              exit 1
            }
            test "$(jq -S -c '.' <<<"$run_rollback_snapshot")" = "$(jq -S -c '.' "$ACCEPTANCE_ROLLBACK_SNAPSHOT_PATH")" || {
              echo 'Acceptance rollback snapshot changed since the original run; refusing to resume.' >&2
              exit 1
            }
            if [[ -z "$run_dependencies" ]]; then
              echo 'Existing acceptance run lacks exact candidate dependency provenance; creating a fresh run.' >&2
            else
              test "$(jq -S -c '.' <<<"$run_dependencies")" = "$(jq -S -c '.' <<<"$candidate_dependencies")" || {
                echo 'Acceptance dependency versions or provenance changed since the original run; refusing to resume.' >&2
                exit 1
              }
            fi
            if [[ "$(jq -r '.status' <<<"$run_json")" != 'expired' && -n "$run_dependencies" ]]; then
              run_id="$EXISTING_ACCEPTANCE_RUN_ID"
              keeper_url="https://admin.lythaus.co/production-auth-acceptance?run=$run_id"
            elif [[ "$(jq -r '.status' <<<"$run_json")" = 'expired' ]]; then
              echo 'The human acceptance window expired; creating a fresh run against the same still-valid candidate version.' >&2
            fi
          fi
          if [[ -z "$run_id" ]]; then
            if [[ -z "$uploaded_at" || -z "$staged_at" ]]; then
              test -n "$PUBLIC_WORKER_CREATED_AT" && test -n "$ADR003_CANDIDATE_STAGED_AT"
              uploaded_at="$PUBLIC_WORKER_CREATED_AT"
              staged_at="$ADR003_CANDIDATE_STAGED_AT"
            fi
            test -n "$uploaded_at" && test -n "$staged_at"
            test -n "$candidate_source_sha"
            rollback_snapshot="$(cat "$ACCEPTANCE_ROLLBACK_SNAPSHOT_PATH")"
            payload="$(jq -n --arg releaseSha "$RELEASE_SHA" --arg candidateSourceSha "$candidate_source_sha" --arg candidateWorker lythaus-public-api-development --arg candidateVersion "$PUBLIC_WORKER_VERSION_ID" --arg candidateUploadedAt "$uploaded_at" --arg candidateStagedAt "$staged_at" --argjson candidateDependencies "$candidate_dependencies" --argjson rollbackSnapshot "$rollback_snapshot" '{releaseSha:$releaseSha,candidateSourceSha:$candidateSourceSha,candidateWorker:$candidateWorker,candidateVersion:$candidateVersion,candidateUploadedAt:$candidateUploadedAt,candidateStagedAt:$candidateStagedAt,candidateDependencies:$candidateDependencies,rollbackSnapshot:$rollbackSnapshot}')"
            run_json="$(coordinator_request POST "$base/runs" "$payload")"
            jq -e '.acceptanceRunId and .keeperUrl and .expiresAt' <<<"$run_json" >/dev/null
            run_id="$(jq -r '.acceptanceRunId' <<<"$run_json")"
            keeper_url="$(jq -r '.keeperUrl' <<<"$run_json")"
            expires_at="$(jq -r '.expiresAt' <<<"$run_json")"
            echo "Acceptance run created for candidate source $candidate_source_sha."
          fi
          {
            echo "AUTH_ACCEPTANCE_RUN_ID=$run_id"
            echo "AUTH_ACCEPTANCE_EXPIRES_AT=$expires_at"
            echo "ADR003_CANDIDATE_SOURCE_SHA=$candidate_source_sha"
            echo "ADR003_CANDIDATE_UPLOADED_AT=$uploaded_at"
            echo "ADR003_CANDIDATE_STAGED_AT=$staged_at"
            echo "AUTH_ACCEPTANCE_KEEPER_URL=$keeper_url"
            echo "AUTH_ACCEPTANCE_DEPENDENCIES_JSON=$candidate_dependencies"
          } >> "$GITHUB_ENV"
          {
            echo '## Production authentication acceptance'
            echo
            echo "Exact candidate: \`$PUBLIC_WORKER_VERSION_ID\` from source \`$candidate_source_sha\`, certified for release \`$RELEASE_SHA\`."
            echo "Keeper URL (Cloudflare Access required): $keeper_url"
            echo "Complete real Turnstile and mailbox actions there, then re-dispatch this same exact SHA with \`acceptance_run_id\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: PRODUCT_ACCEPTANCE - Collect generated candidate auth acceptance evidence
        id: auth_acceptance_observation
        if: steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_SOURCE: protected_probe
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_URL: https://admin.lythaus.co/api/admin/production-auth-acceptance/observer
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/auth-acceptance-observation.json
          ADR003_WORKER_NAME: lythaus-public-api-development
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=auth_acceptance_observer_certification_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=protected auth acceptance observer evidence was unavailable' >> "$GITHUB_ENV"
          export ADR003_WORKER_VERSION_ID="$PUBLIC_WORKER_VERSION_ID"
          export ADR003_ACCEPTANCE_RUN_ID="$AUTH_ACCEPTANCE_RUN_ID"
          export ADR003_CANDIDATE_SOURCE_SHA="$ADR003_CANDIDATE_SOURCE_SHA"
          export ADR003_CANDIDATE_UPLOADED_AT="$ADR003_CANDIDATE_UPLOADED_AT"
          export ADR003_CANDIDATE_STAGED_AT="$ADR003_CANDIDATE_STAGED_AT"
          export ADR003_CANDIDATE_DEPENDENCIES_JSON="$AUTH_ACCEPTANCE_DEPENDENCIES_JSON"
          node scripts/ci/collect-auth-acceptance-evidence.mjs
      - name: PRODUCT_ACCEPTANCE - Run authenticated acceptance against public candidate
        if: steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE' && steps.auth_acceptance_observation.outcome == 'success'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_DATABASE_READINESS_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/public-candidate-probe.json
          ADR003_WEB_HEALTH_URL: ${{ vars.ADR003_WEB_HEALTH_URL }}
          ADR003_WEB_ORIGIN: ${{ vars.ADR003_WEB_ORIGIN }}
          ADR003_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/adr003-candidate-acceptance.json
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/auth-acceptance-observation.json
          ADR003_WORKER_VERSIONS_JSON: ${{ vars.ADR003_WORKER_VERSIONS_JSON }}
          ADR003_HYPERDRIVE_IDS_JSON: ${{ vars.ADR003_HYPERDRIVE_IDS_JSON }}
          ADR003_GUEST_ACCEPTED: ${{ vars.ADR003_GUEST_ACCEPTED }}
          ADR003_MOBILE_EMAIL_ACCEPTED: ${{ vars.ADR003_MOBILE_EMAIL_ACCEPTED }}
          ADR003_RUN_DESTRUCTIVE_ACCOUNT_DELETION: 'false'
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0016_transactional_email_envelope_boundary.sql
          EXPECTED_DATABASE_BUDGET_LEDGER_APPLIED: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          ADR003_TEST_EMAIL: ${{ secrets.CODEX_TEST_EMAIL }}
          ADR003_TEST_PASSWORD: ${{ secrets.CODEX_TEST_PASSWORD }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE'
            echo 'RELEASE_FAILURE_CODE=auth_product_acceptance_failed'
            echo 'RELEASE_FAILURE_MESSAGE=real authentication product acceptance failed'
          } >> "$GITHUB_ENV"
          api_base="${ADR003_API_BASE_URL%/}"
          test -n "$api_base"
          if [[ "$api_base" != */api ]]; then
            api_base="$api_base/api"
          fi
          export ADR003_API_BASE_URL="$api_base"
          export ADR003_WORKER_VERSION_ID="$PUBLIC_WORKER_VERSION_ID"
          export ADR003_ACCEPTANCE_RUN_ID="$AUTH_ACCEPTANCE_RUN_ID"
          export ADR003_CANDIDATE_SOURCE_SHA="$ADR003_CANDIDATE_SOURCE_SHA"
          export ADR003_CANDIDATE_UPLOADED_AT="$ADR003_CANDIDATE_UPLOADED_AT"
          export ADR003_CANDIDATE_STAGED_AT="$ADR003_CANDIDATE_STAGED_AT"
          export ADR003_CANDIDATE_DEPENDENCIES_JSON="$AUTH_ACCEPTANCE_DEPENDENCIES_JSON"
          npm run acceptance:adr003
      - name: PRODUCT_ACCEPTANCE - Preserve prior release gate failure
        id: preserve_prior_gate_failure
        if: ${{ failure() && steps.auth_acceptance_observation.outcome != 'failure' }}
        run: echo 'PRIOR_GATE_FAILURE=true' >> "$GITHUB_ENV"
      - name: PRODUCT_ACCEPTANCE - Require generated candidate auth acceptance
        if: always() && steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE'
        env:
          OBSERVER_OUTCOME: ${{ steps.auth_acceptance_observation.outcome }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          if [[ "${PRIOR_GATE_FAILURE:-false}" == "true" && "$OBSERVER_OUTCOME" != "failure" ]]; then
            exit 0
          fi
          {
            echo 'RELEASE_FAILURE_GATE=PRODUCT_ACCEPTANCE'
            echo 'RELEASE_FAILURE_CODE=certification_evidence_required'
            echo 'RELEASE_FAILURE_MESSAGE=auth-critical acceptance certification evidence is required'
          } >> "$GITHUB_ENV"
          test "$OBSERVER_OUTCOME" = success || {
            status="$(jq -r '.status // "BLOCKED"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" 2>/dev/null || echo BLOCKED)"
            if [[ "$status" = HUMAN_ACCEPTANCE_REQUIRED ]]; then
              {
                echo 'RELEASE_FAILURE_CODE=human_acceptance_required'
                echo 'RELEASE_FAILURE_MESSAGE=human acceptance window is incomplete'
                echo 'AUTH_ACCEPTANCE_PENDING=true'
              } >> "$GITHUB_ENV"
              echo "HUMAN_ACCEPTANCE_REQUIRED: complete the real Turnstile and mailbox interaction at ${AUTH_ACCEPTANCE_KEEPER_URL}, then re-dispatch this exact SHA with acceptance_run_id=${AUTH_ACCEPTANCE_RUN_ID}." >&2
            elif [[ "$status" = BLOCKED ]] && jq -e '.reason == "provider_configuration_missing"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null 2>&1; then
              {
                echo 'RELEASE_FAILURE_CODE=delivery_observer_unavailable'
                echo 'RELEASE_FAILURE_MESSAGE=delivery observer availability prevented independent acceptance evidence'
              } >> "$GITHUB_ENV"
              echo 'Provider configuration failure: the enabled mail.lythaus.co Cloudflare Email Sending queue subscription was not independently observed for the required lifecycle events.' >&2
            else
              {
                echo 'RELEASE_FAILURE_CODE=auth_acceptance_certification_failed'
                echo 'RELEASE_FAILURE_MESSAGE=auth-critical acceptance certification evidence was not proven'
              } >> "$GITHUB_ENV"
              echo "Candidate auth acceptance is not independently proven: $status" >&2
            fi
            exit 1
          }
          jq -e '.status == "PASSED"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null
          jq -e '
            .status == "PASSED" and
            .lifecycleSubscription.source == "cloudflare_email_sending_queue_subscription_observation" and
            .lifecycleSubscription.domain == "mail.lythaus.co" and
            .lifecycleSubscription.status == "enabled" and
            ((.lifecycleSubscription.events | sort) == ["bounced", "complained", "deferred", "delivered", "failed", "rejected"])
          ' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null
          jq -e '.status == "PASSED"' "$RUNNER_TEMP/production-cutover/adr003-candidate-acceptance.json" >/dev/null
          {
            echo "DATABASE_IDENTITY_VERIFIED=true"
            echo "BUDGET_ENFORCEMENT_VERIFIED=true"
            echo "AUTHENTICATED_ACCEPTANCE_PROVEN=true"
            echo "PLANETSCALE_GRANTS_VERIFIED=true"
          } >> "$GITHUB_ENV"
          node scripts/ci/transition-release-state.mjs PRODUCT_ACCEPTANCE_PASSED
      - name: INFRASTRUCTURE - Reverify production schema before activation
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=production_schema_verification_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=production database schema verification failed' >> "$GITHUB_ENV"
          node scripts/ci/verify-planetscale-production-schema.mjs
      - name: INFRASTRUCTURE - Record exact structural readiness evidence
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'DATABASE_IDENTITY_VERIFIED=true'
            echo 'BUDGET_ENFORCEMENT_VERIFIED=true'
            echo 'PLANETSCALE_GRANTS_VERIFIED=true'
          } >> "$GITHUB_ENV"
      - name: ACTIVATION - Validate final production gates before activation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CLASS: ${{ steps.release_plan.outputs.release_class }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=ACTIVATION' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=activation_safety_gate_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=final production safety gates failed before activation' >> "$GITHUB_ENV"
          npm run validate:production-gates:final
      - name: Activate exact candidate Worker versions (ACTIVATION gate; changed components only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=ACTIVATION' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=candidate_activation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=changed candidate activation failed' >> "$GITHUB_ENV"
          component_changed() {
            jq -e --arg component "$1" --argjson components "$CHANGED_COMPONENTS_JSON" '$components | index($component) != null' <<< '{}' >/dev/null
          }
          if component_changed public; then
            npx --yes wrangler@4.123.0 versions deploy "${PUBLIC_WORKER_VERSION_ID}@100" --name lythaus-public-api-development --yes --message "Activate reviewed Lythaus public release ${{ inputs.release_sha }}"
            echo "PUBLIC_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
            echo "PUBLIC_WORKER_STATUS=ACTIVATED" >> "$GITHUB_ENV"
          fi
          if component_changed admin; then
            npx --yes wrangler@4.123.0 versions deploy "${ADMIN_WORKER_VERSION_ID}@100" --name lythaus-admin-api-development --yes --message "Activate reviewed Lythaus admin release ${{ inputs.release_sha }}"
            echo "ADMIN_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
            echo "ADMIN_WORKER_STATUS=ACTIVATED" >> "$GITHUB_ENV"
          fi
          if component_changed jobs && [[ "${JOBS_WORKER_DEPLOYED:-false}" != "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy "${JOBS_WORKER_VERSION_ID}@100" --name lythaus-jobs-development --yes --message "Activate reviewed Lythaus jobs release ${{ inputs.release_sha }}"
            echo "JOBS_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          fi
          if component_changed jobs; then echo "JOBS_WORKER_STATUS=ACTIVATED" >> "$GITHUB_ENV"; fi
          if component_changed coordinator; then echo "COORDINATOR_WORKER_STATUS=ACTIVATED" >> "$GITHUB_ENV"; fi
          echo "ACTIVATION_STATE=ACTIVATED" >> "$GITHUB_ENV"
          node scripts/ci/transition-release-state.mjs ACTIVATED
      - name: Publish and verify same-origin admin API route (ACTIVATION gate; changed components only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=ACTIVATION' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=route_activation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=changed same-origin route activation or verification failed' >> "$GITHUB_ENV"
          component_changed() {
            jq -e --arg component "$1" --argjson components "$CHANGED_COMPONENTS_JSON" '$components | index($component) != null' <<< '{}' >/dev/null
          }
          if component_changed admin; then
            echo "ADMIN_ROUTE_TRIGGER_ATTEMPTED=true" >> "$GITHUB_ENV"
            npx --yes wrangler@4.123.0 triggers deploy --config apps/lythaus-admin-api/wrangler.jsonc --name lythaus-admin-api-development
            echo "ADMIN_ROUTE_TRIGGER_DEPLOYED=true" >> "$GITHUB_ENV"
            node scripts/ci/manage-cloudflare-worker-route.mjs verify \
              "$RUNNER_TEMP/production-cutover/admin-api-route-after.json" \
              'admin.lythaus.co/api/admin/*' \
              lythaus-admin-api-development
          else
            echo "ADMIN_ROUTE_TRIGGER_ATTEMPTED=false" >> "$GITHUB_ENV"
          fi
      - name: ACTIVATION - Export candidate, reuse, and activation metadata
        id: validate_release_metadata
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=ACTIVATION'
            echo 'RELEASE_FAILURE_CODE=release_metadata_failed'
            echo 'RELEASE_FAILURE_MESSAGE=release candidate and reuse metadata validation failed'
          } >> "$GITHUB_ENV"
          component_changed() {
            jq -e --arg component "$1" --argjson components "$CHANGED_COMPONENTS_JSON" '$components | index($component) != null' <<< '{}' >/dev/null
          }
          test -n "${PUBLIC_WORKER_VERSION_ID:-}"
          test -n "${ADMIN_WORKER_VERSION_ID:-}"
          test -n "${JOBS_WORKER_VERSION_ID:-}"
          test -n "${COORDINATOR_WORKER_VERSION_ID:-}"
          check_worker_provenance() {
            local component="$1"; local prefix="$2"
            local source_var="${prefix}_WORKER_SOURCE_SHA"; local provenance_var="${prefix}_WORKER_PROVENANCE"; local status_var="${prefix}_WORKER_STATUS"
            local source="${!source_var:-}"; local provenance="${!provenance_var:-}"; local status="${!status_var:-}"
            test -n "$source"
            if component_changed "$component"; then
              test "$source" = "$RELEASE_SHA"
              test "$provenance" = BUILT_FROM_RELEASE_SHA
              test "$status" = ACTIVATED
            else
              [[ "$source" =~ ^[0-9a-f]{40}$ ]]
              test "$provenance" = REUSED_KNOWN_GOOD_PRODUCTION_VERSION
              test "$status" = REUSED_PRODUCTION
            fi
          }
          check_worker_provenance public PUBLIC
          check_worker_provenance admin ADMIN
          check_worker_provenance jobs JOBS
          check_worker_provenance coordinator COORDINATOR
          test -s "$RUNNER_TEMP/production-cutover/public-before.json"
          test -s "$RUNNER_TEMP/production-cutover/admin-before.json"
          test -s "$RUNNER_TEMP/production-cutover/jobs-before.json"
          test -s "$RUNNER_TEMP/production-cutover/coordinator-before.json"
          test -s "$RUNNER_TEMP/production-cutover/coordinator-parent-before.json"
          test -s "$RUNNER_TEMP/production-cutover/coordinator-parent-state-before.json"
          test -s "$RUNNER_TEMP/production-cutover/admin-api-route-before.json"
          test -s "$RUNNER_TEMP/production-cutover/coordinator-route-before.json"
          if component_changed coordinator && [[ -z "${{ inputs.acceptance_run_id }}" ]]; then
            test -s "$RUNNER_TEMP/production-cutover/coordinator-parent-after.json"
          fi
          lifecycle_evidence="$RUNNER_TEMP/production-cutover/email-lifecycle-infrastructure.json"
          scoped_key_evidence="$RUNNER_TEMP/production-cutover/scoped-key-lifecycle.json"
          scoped_binding_evidence="$RUNNER_TEMP/production-cutover/scoped-worker-secret-bindings.json"
          if component_changed public || component_changed jobs || component_changed coordinator; then
            test -s "$scoped_key_evidence"
            jq -e --argjson changed "$CHANGED_COMPONENTS_JSON" '
              .status == "VERIFIED"
              and .transactionalEmail.compatibilityProbeRequired == true
              and (.transactionalEmail.action == "bootstrap" or .transactionalEmail.action == "preserve")
              and ((.acceptanceState.action == "bootstrap" or .acceptanceState.action == "preserve") or ((($changed | index("coordinator")) == null) and .acceptanceState.action == "reuse_not_touched"))
              and .secretValuesIncluded == false
            ' "$scoped_key_evidence" >/dev/null
          fi
          if component_changed public || component_changed admin || component_changed jobs || component_changed coordinator; then
            test -s "$scoped_binding_evidence"
            jq -e --argjson changed "$CHANGED_COMPONENTS_JSON" '
              .status == "VERIFIED"
              and .source == "cloudflare_secret_binding_names"
              and (.publicApi.requiredBindingsPresent | index("TRANSACTIONAL_EMAIL_ENCRYPTION_KEY_V1"))
              and .jobs.requiredBindingsPresent == ["TRANSACTIONAL_EMAIL_ENCRYPTION_KEY_V1"]
              and (.jobs.forbiddenProductBindingsAbsent | sort) == ["PII_ENCRYPTION_KEY_V1", "PII_HMAC_KEY_V1"]
              and ((($changed | index("coordinator")) != null and .acceptanceCoordinator.requiredBindingsPresent == ["AUTH_ACCEPTANCE_STATE_ENCRYPTION_KEY_V1"]) or (($changed | index("coordinator")) == null and .acceptanceCoordinator.requiredBindingsPresent == []))
              and (.acceptanceCoordinator.forbiddenProductBindingsAbsent | sort) == ["ACCESS_SUBJECT_HMAC_KEY", "PII_ENCRYPTION_KEY_V1", "PII_HMAC_KEY_V1"]
              and .secretValuesIncluded == false
            ' "$scoped_binding_evidence" >/dev/null
          fi
          jq -e --arg jobs_version "$JOBS_WORKER_VERSION_ID" '
            if (
              .status == "VERIFIED"
              and .subscription.enabled == true
              and .subscription.source == "email.sending"
              and .subscription.domain == "mail.lythaus.co"
              and ((.subscription.events | sort) == ["message.bounced", "message.complained", "message.deferred", "message.delivered", "message.failed", "message.rejected"])
              and .consumer == {
                queue: "lythaus-email-lifecycle-dev",
                max_batch_size: 25,
                max_batch_timeout: 5,
                max_retries: 10,
                dead_letter_queue: "lythaus-email-lifecycle-dlq-dev"
              }
            ) then .consumer.jobsWorkerVersionId = $jobs_version else error("email_lifecycle_evidence_invalid") end
          ' "$lifecycle_evidence" > "$lifecycle_evidence.tmp"
          mv "$lifecycle_evidence.tmp" "$lifecycle_evidence"
          {
            echo "public_worker_version=$PUBLIC_WORKER_VERSION_ID"
            echo "admin_worker_version=$ADMIN_WORKER_VERSION_ID"
            echo "jobs_worker_version=$JOBS_WORKER_VERSION_ID"
            echo "coordinator_worker_version=$COORDINATOR_WORKER_VERSION_ID"
            echo "hyperdrive_verified_main=${HYPERDRIVE_VERIFIED_MAIN:-false}"
            echo "database_identity_verified=${DATABASE_IDENTITY_VERIFIED:-false}"
            echo "budget_enforcement_verified=${BUDGET_ENFORCEMENT_VERIFIED:-false}"
            echo "authenticated_acceptance_proven=${AUTHENTICATED_ACCEPTANCE_PROVEN:-false}"
            if [[ "$RELEASE_CLASS" = "AUTH_CRITICAL_RELEASE" ]]; then
              echo "authenticated_acceptance_status=$(jq -r '.status' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json")"
              echo "acceptance_run_id=${AUTH_ACCEPTANCE_RUN_ID:-}"
              echo "acceptance_expires_at=${AUTH_ACCEPTANCE_EXPIRES_AT:-}"
              echo "acceptance_keeper_url=${AUTH_ACCEPTANCE_KEEPER_URL:-}"
              echo "acceptance_dependencies_json=${AUTH_ACCEPTANCE_DEPENDENCIES_JSON:-}"
              echo "acceptance_evidence_path=$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json"
            else
              echo 'authenticated_acceptance_status=NOT_REQUIRED'
              echo 'acceptance_run_id='
              echo 'acceptance_expires_at='
              echo 'acceptance_keeper_url='
              echo 'acceptance_dependencies_json='
              echo 'acceptance_evidence_path='
            fi
            echo "release_class=$RELEASE_CLASS"
            echo "changed_components_json=$CHANGED_COMPONENTS_JSON"
            echo "reused_components_json=$REUSED_COMPONENTS_JSON"
            echo "activation_state=${ACTIVATION_STATE:-ACTIVATED}"
            echo "release_state=${RELEASE_STATE:-ACTIVATED}"
            echo "release_state_history_json=${RELEASE_STATE_HISTORY_JSON:-[]}"
            echo "failure_domain_evidence_json=${FAILURE_DOMAIN_EVIDENCE_JSON:-[]}"
            echo "public_worker_source_sha=${PUBLIC_WORKER_SOURCE_SHA:-}"
            echo "admin_worker_source_sha=${ADMIN_WORKER_SOURCE_SHA:-}"
            echo "jobs_worker_source_sha=${JOBS_WORKER_SOURCE_SHA:-}"
            echo "coordinator_worker_source_sha=${COORDINATOR_WORKER_SOURCE_SHA:-}"
            echo "public_worker_provenance=${PUBLIC_WORKER_PROVENANCE:-}"
            echo "admin_worker_provenance=${ADMIN_WORKER_PROVENANCE:-}"
            echo "jobs_worker_provenance=${JOBS_WORKER_PROVENANCE:-}"
            echo "coordinator_worker_provenance=${COORDINATOR_WORKER_PROVENANCE:-}"
            echo "public_worker_status=${PUBLIC_WORKER_STATUS:-}"
            echo "admin_worker_status=${ADMIN_WORKER_STATUS:-}"
            echo "jobs_worker_status=${JOBS_WORKER_STATUS:-}"
            echo "coordinator_worker_status=${COORDINATOR_WORKER_STATUS:-}"
            echo "planetscale_grants_verified=${PLANETSCALE_GRANTS_VERIFIED:-false}"
            echo "worker_source_sha=$RELEASE_SHA"
            echo "rollback_artifacts_proven=true"
          } >> "$GITHUB_OUTPUT"
      - name: Classify release failure domain
        id: failure_domain
        if: ${{ always() && (failure() || cancelled()) }}
        run: node scripts/ci/write-failure-domain-evidence.mjs
      - name: Roll back partial Worker deployment on failure
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          set +e
          rollback_failed=0
          echo 'ROLLBACK_STATE=IN_PROGRESS' >> "$GITHUB_ENV"
          if [[ "${ROLLBACK_ARTIFACTS_PROVEN:-false}" != "true" ]]; then
            echo 'ROLLBACK_STATE=BLOCKED' >> "$GITHUB_ENV"
            echo 'ACTIVATION_STATE=BLOCKED' >> "$GITHUB_ENV"
            echo 'No complete rollback snapshot was proven; production was left untouched.' >&2
            exit 0
          fi
          if [[ "${AUTH_ACCEPTANCE_PENDING:-false}" == "true" ]]; then
            echo 'HUMAN_ACCEPTANCE_REQUIRED: preserving exact candidate Jobs/coordinator state for resume.'
            echo 'ROLLBACK_STATE=PRESERVED_FOR_ACCEPTANCE' >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "${ADMIN_ROUTE_TRIGGER_ATTEMPTED:-false}" == "true" ]]; then
            node scripts/ci/manage-cloudflare-worker-route.mjs restore \
              "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
              'admin.lythaus.co/api/admin/*' || rollback_failed=1
          fi
          if [[ "${COORDINATOR_ROUTE_TRIGGER_ATTEMPTED:-false}" == "true" ]]; then
            node scripts/ci/manage-cloudflare-worker-route.mjs restore \
              "$RUNNER_TEMP/production-cutover/coordinator-route-before.json" \
              'admin.lythaus.co/api/admin/production-auth-acceptance/*' || rollback_failed=1
          fi
          if [[ "${COORDINATOR_WORKER_DEPLOYED:-false}" == "true" || "${COORDINATOR_WORKER_STAGED:-false}" == "true" ]]; then
            if [[ -n "${COORDINATOR_ROLLBACK_SPECS:-}" ]]; then
              npx --yes wrangler@4.123.0 versions deploy $COORDINATOR_ROLLBACK_SPECS --name lythaus-auth-acceptance-coordinator-development --yes --message "Restore exact predeployment Lythaus coordinator versions" || rollback_failed=1
            else
              echo 'No prior coordinator deployment existed; retaining the harmless parent/version and restoring only the route.'
            fi
          fi
          if [[ "${JOBS_WORKER_DEPLOYED:-false}" == "true" || "${JOBS_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $JOBS_ROLLBACK_SPECS --name lythaus-jobs-development --yes --message "Restore exact predeployment Lythaus jobs versions" || rollback_failed=1
          fi
          if [[ "${ADMIN_WORKER_DEPLOYED:-false}" == "true" || "${ADMIN_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $ADMIN_ROLLBACK_SPECS --name lythaus-admin-api-development --yes --message "Restore exact predeployment Lythaus admin versions" || rollback_failed=1
          fi
          if [[ "${PUBLIC_WORKER_DEPLOYED:-false}" == "true" || "${PUBLIC_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $PUBLIC_ROLLBACK_SPECS --name lythaus-public-api-development --yes --message "Restore exact predeployment Lythaus public versions" || rollback_failed=1
          fi
          if [[ "$rollback_failed" -eq 0 && "${AUTH_ACCEPTANCE_PENDING:-false}" != "true" ]]; then
            node scripts/ci/transition-release-state.mjs ROLLED_BACK || rollback_failed=1
          fi
          if [[ "$rollback_failed" -eq 0 ]]; then
            echo 'ROLLBACK_STATE=ROLLED_BACK' >> "$GITHUB_ENV"
            echo 'ACTIVATION_STATE=ROLLED_BACK' >> "$GITHUB_ENV"
          else
            echo 'ROLLBACK_STATE=BLOCKED' >> "$GITHUB_ENV"
          fi
          exit "$rollback_failed"
      - name: Export candidate, reuse, and final activation metadata
        id: release_metadata
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -u
          release_class="${RELEASE_CLASS:-AUTH_CRITICAL_RELEASE}"
          acceptance_status="NOT_REQUIRED"
          if [[ "$release_class" == 'AUTH_CRITICAL_RELEASE' ]]; then
            acceptance_status='BLOCKED'
            observation="$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json"
            if [[ -s "$observation" ]]; then
              acceptance_status="$(jq -r '.status // "BLOCKED"' "$observation" 2>/dev/null || printf 'BLOCKED')"
            fi
          fi
          {
            echo "public_worker_version=${PUBLIC_WORKER_VERSION_ID:-}"
            echo "admin_worker_version=${ADMIN_WORKER_VERSION_ID:-}"
            echo "jobs_worker_version=${JOBS_WORKER_VERSION_ID:-}"
            echo "coordinator_worker_version=${COORDINATOR_WORKER_VERSION_ID:-}"
            echo "hyperdrive_verified_main=${HYPERDRIVE_VERIFIED_MAIN:-false}"
            echo "database_identity_verified=${DATABASE_IDENTITY_VERIFIED:-false}"
            echo "budget_enforcement_verified=${BUDGET_ENFORCEMENT_VERIFIED:-false}"
            echo "authenticated_acceptance_proven=${AUTHENTICATED_ACCEPTANCE_PROVEN:-false}"
            echo "authenticated_acceptance_status=$acceptance_status"
            echo "acceptance_run_id=${AUTH_ACCEPTANCE_RUN_ID:-}"
            echo "acceptance_expires_at=${AUTH_ACCEPTANCE_EXPIRES_AT:-}"
            echo "acceptance_keeper_url=${AUTH_ACCEPTANCE_KEEPER_URL:-}"
            echo "acceptance_dependencies_json=${AUTH_ACCEPTANCE_DEPENDENCIES_JSON:-}"
            if [[ "$release_class" == 'AUTH_CRITICAL_RELEASE' ]]; then
              echo "acceptance_evidence_path=$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json"
            else
              echo 'acceptance_evidence_path='
            fi
            echo "release_class=$release_class"
            echo "changed_components_json=${CHANGED_COMPONENTS_JSON:-[]}"
            echo "reused_components_json=${REUSED_COMPONENTS_JSON:-[]}"
            echo "activation_state=${ACTIVATION_STATE:-${RELEASE_STATE:-BLOCKED}}"
            echo "release_state=${RELEASE_STATE:-BLOCKED}"
            echo "release_state_history_json=${RELEASE_STATE_HISTORY_JSON:-[]}"
            echo "failure_domain_evidence_json=${FAILURE_DOMAIN_EVIDENCE_JSON:-[]}"
            echo "public_worker_source_sha=${PUBLIC_WORKER_SOURCE_SHA:-}"
            echo "admin_worker_source_sha=${ADMIN_WORKER_SOURCE_SHA:-}"
            echo "jobs_worker_source_sha=${JOBS_WORKER_SOURCE_SHA:-}"
            echo "coordinator_worker_source_sha=${COORDINATOR_WORKER_SOURCE_SHA:-}"
            echo "public_worker_provenance=${PUBLIC_WORKER_PROVENANCE:-}"
            echo "admin_worker_provenance=${ADMIN_WORKER_PROVENANCE:-}"
            echo "jobs_worker_provenance=${JOBS_WORKER_PROVENANCE:-}"
            echo "coordinator_worker_provenance=${COORDINATOR_WORKER_PROVENANCE:-}"
            echo "public_worker_status=${PUBLIC_WORKER_STATUS:-}"
            echo "admin_worker_status=${ADMIN_WORKER_STATUS:-}"
            echo "jobs_worker_status=${JOBS_WORKER_STATUS:-}"
            echo "coordinator_worker_status=${COORDINATOR_WORKER_STATUS:-}"
            echo "planetscale_grants_verified=${PLANETSCALE_GRANTS_VERIFIED:-false}"
            echo "worker_source_sha=$RELEASE_SHA"
            echo "rollback_artifacts_proven=${ROLLBACK_ARTIFACTS_PROVEN:-false}"
            echo "rollback_state=${ROLLBACK_STATE:-READY}"
          } >> "$GITHUB_OUTPUT"
      - name: Remove ephemeral production secret files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/production-cutover/base-secrets.json" "$RUNNER_TEMP/production-cutover/public-secrets.json" "$RUNNER_TEMP/production-cutover/jobs-secrets.json" "$RUNNER_TEMP/production-cutover/coordinator-secrets.json" "$RUNNER_TEMP/production-cutover/worker-secrets.json" "$RUNNER_TEMP/production-cutover/turnstile-secret.json"
      - name: Upload sanitized production cutover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-cutover-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/production-cutover
          if-no-files-found: ignore
