            SKIP_ACCEPTANCE_COORDINATOR="$(if component_changed coordinator; then echo false; else echo true; fi)" \
            SCOPED_WORKER_SECRET_BINDING_EVIDENCE_PATH="$scoped_binding_evidence" \
