              if [[ -n "$expected_candidate_id" ]]; then
                test "$(jq -r --arg component "$component" '.candidateDependencies[$component].status // empty' "$ACCEPTANCE_RUN_SUMMARY_PATH")" = NEW_CANDIDATE
              fi
            fi
            if [[ -n "$expected_candidate_id" ]]; then
