name: native-workers-deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
    outputs:
      public_worker_version:
        description: Activated public API Worker version ID
        value: ${{ jobs.deploy.outputs.public_worker_version }}
      admin_worker_version:
        description: Activated admin API Worker version ID
        value: ${{ jobs.deploy.outputs.admin_worker_version }}
      jobs_worker_version:
        description: Activated jobs Worker version ID
        value: ${{ jobs.deploy.outputs.jobs_worker_version }}
      hyperdrive_verified_main:
        description: Exact-run proof that production Hyperdrive targets PlanetScale main
        value: ${{ jobs.deploy.outputs.hyperdrive_verified_main }}
      database_identity_verified:
        description: Exact-run proof that the production database identity passed verification
        value: ${{ jobs.deploy.outputs.database_identity_verified }}
      budget_enforcement_verified:
        description: Exact-run proof that budget enforcement passed acceptance
        value: ${{ jobs.deploy.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven:
        description: Exact-run proof that authenticated acceptance passed
        value: ${{ jobs.deploy.outputs.authenticated_acceptance_proven }}
      planetscale_grants_verified:
        description: Exact-run proof that PlanetScale grants passed the production contract
        value: ${{ jobs.deploy.outputs.planetscale_grants_verified }}
      worker_source_sha:
        description: Reviewed source SHA used for every activated Worker version
        value: ${{ jobs.deploy.outputs.worker_source_sha }}

permissions:
  contents: read

concurrency:
  group: lythaus-production-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      public_worker_version: ${{ steps.release_metadata.outputs.public_worker_version }}
      admin_worker_version: ${{ steps.release_metadata.outputs.admin_worker_version }}
      jobs_worker_version: ${{ steps.release_metadata.outputs.jobs_worker_version }}
      hyperdrive_verified_main: ${{ steps.release_metadata.outputs.hyperdrive_verified_main }}
      database_identity_verified: ${{ steps.release_metadata.outputs.database_identity_verified }}
      budget_enforcement_verified: ${{ steps.release_metadata.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven: ${{ steps.release_metadata.outputs.authenticated_acceptance_proven }}
      planetscale_grants_verified: ${{ steps.release_metadata.outputs.planetscale_grants_verified }}
      worker_source_sha: ${{ steps.release_metadata.outputs.worker_source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact merged main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          checked_out_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$checked_out_sha" ]]; then
            echo "Refusing deployment: release_sha is not the checked-out main SHA." >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$remote_main_sha" ]]; then
            echo "Refusing deployment: checked-out main is not current origin/main." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate committed production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-workers
      - name: Validate production account and zone scope
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-scope:production
      - name: Validate production predeployment gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run validate:production-gates:predeploy
      - name: Validate migrations and generated Worker types
        run: |
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
          npm run validate:no-retired-provider-dependencies
          npm run validate:ai-gateway-paths
          npx --yes wrangler@4.123.0 types --check apps/lythaus-public-api/src/worker-configuration.d.ts --config apps/lythaus-public-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-admin-api/src/worker-configuration.d.ts --config apps/lythaus-admin-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-jobs/src/worker-configuration.d.ts --config apps/lythaus-jobs/wrangler.jsonc
      - name: Materialize approved post-0013 deployment identity
        env:
          PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN: ${{ vars.PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN }}
          PRODUCT_INTEGRITY_ACCESS_AUDIENCES: ${{ vars.PRODUCT_INTEGRITY_ACCESS_AUDIENCES }}
          PRODUCT_INTEGRITY_ACCESS_JWKS_URL: ${{ vars.PRODUCT_INTEGRITY_ACCESS_JWKS_URL }}
          PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL: ${{ vars.PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL }}
          MATERIALIZE_PRODUCT_INTEGRITY_DEPLOY_CONFIGS: 'true'
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: |
          node scripts/ci/validate-product-integrity-deploy-identity.mjs
          npm run validate:native-workers:provisioned
      - name: Prove production Hyperdrive origins target PlanetScale main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: lythaus
          PLANETSCALE_DATABASE: lythaus-core
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL }}
          PSCALE_BRANCH_NAME: main
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/production-cutover"
          node scripts/ci/verify-cloudflare-hyperdrive-targets.mjs | tee "$RUNNER_TEMP/production-cutover/hyperdrive-targets.json"
      - name: Capture predeployment Worker state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-cutover"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-before.json"
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/public-before.json" unused PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/admin-before.json" unused ADMIN
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/jobs-before.json" unused JOBS
      - name: Capture predeployment same-origin admin API route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          node scripts/ci/manage-cloudflare-worker-route.mjs snapshot \
            "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
            'admin.lythaus.co/api/admin/*'
      - name: Record verified main routing assertion
        run: echo "HYPERDRIVE_VERIFIED_MAIN=true" >> "$GITHUB_ENV"
      - name: Verify production schema read-only
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: node scripts/ci/verify-planetscale-production-schema.mjs
      - name: Upload immutable candidate Worker versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          npx --yes wrangler@4.123.0 versions upload --config apps/lythaus-public-api/wrangler.jsonc --tag "$RELEASE_SHA" --message "Lythaus candidate $RELEASE_SHA"
          npx --yes wrangler@4.123.0 versions upload --config apps/lythaus-admin-api/wrangler.jsonc --tag "$RELEASE_SHA" --message "Lythaus candidate $RELEASE_SHA"
          npx --yes wrangler@4.123.0 versions upload --config apps/lythaus-jobs/wrangler.jsonc --tag "$RELEASE_SHA" --message "Lythaus candidate $RELEASE_SHA"
          npx --yes wrangler@4.123.0 versions list --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-versions.json"
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/public-versions.json" "$RELEASE_SHA" PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/admin-versions.json" "$RELEASE_SHA" ADMIN
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/jobs-versions.json" "$RELEASE_SHA" JOBS
      - name: Probe public candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0013_marketing_waitlist.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'true'
          PRODUCTION_WORKER_SCOPE: lythaus-public-api-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          PRODUCTION_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/public-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Probe admin candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0013_marketing_waitlist.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'true'
          PRODUCTION_WORKER_SCOPE: lythaus-admin-api-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.ADMIN_WORKER_VERSION_ID }}
          PRODUCTION_ADMIN_API_BASE_URL: ${{ vars.PRODUCTION_ADMIN_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/admin-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Probe jobs candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0013_marketing_waitlist.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'true'
          PRODUCTION_WORKER_SCOPE: lythaus-jobs-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.JOBS_WORKER_VERSION_ID }}
          PRODUCTION_JOBS_API_BASE_URL: ${{ vars.PRODUCTION_JOBS_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/jobs-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Run authenticated acceptance against public candidate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          ADR003_WEB_HEALTH_URL: ${{ vars.ADR003_WEB_HEALTH_URL }}
          ADR003_WEB_ORIGIN: ${{ vars.ADR003_WEB_ORIGIN }}
          ADR003_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/adr003-candidate-acceptance.json
          ADR003_WORKER_VERSIONS_JSON: ${{ vars.ADR003_WORKER_VERSIONS_JSON }}
          ADR003_HYPERDRIVE_IDS_JSON: ${{ vars.ADR003_HYPERDRIVE_IDS_JSON }}
          ADR003_GUEST_ACCEPTED: ${{ vars.ADR003_GUEST_ACCEPTED }}
          ADR003_NEW_USER_ACCEPTED: ${{ vars.ADR003_NEW_USER_ACCEPTED }}
          ADR003_EMAIL_DELIVERY_ACCEPTED: ${{ vars.ADR003_EMAIL_DELIVERY_ACCEPTED }}
          ADR003_EMAIL_LINK_REPLAY_VERIFIED: ${{ vars.ADR003_EMAIL_LINK_REPLAY_VERIFIED }}
          ADR003_WEB_EMAIL_ACCEPTED: ${{ vars.ADR003_WEB_EMAIL_ACCEPTED }}
          ADR003_MOBILE_EMAIL_ACCEPTED: ${{ vars.ADR003_MOBILE_EMAIL_ACCEPTED }}
          ADR003_RUN_DESTRUCTIVE_ACCOUNT_DELETION: ${{ vars.ADR003_RUN_DESTRUCTIVE_ACCOUNT_DELETION }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0013_marketing_waitlist.sql
          EXPECTED_DATABASE_BUDGET_LEDGER_APPLIED: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          ADR003_TEST_EMAIL: ${{ secrets.ADR003_TEST_EMAIL }}
          ADR003_TEST_PASSWORD: ${{ secrets.ADR003_TEST_PASSWORD }}
        run: npm run acceptance:adr003
      - name: Record candidate evidence assertions
        run: |
          {
            echo "DATABASE_IDENTITY_VERIFIED=true"
            echo "BUDGET_ENFORCEMENT_VERIFIED=true"
            echo "AUTHENTICATED_ACCEPTANCE_PROVEN=true"
            echo "PLANETSCALE_GRANTS_VERIFIED=true"
          } >> "$GITHUB_ENV"
      - name: Reverify production schema before activation
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: node scripts/ci/verify-planetscale-production-schema.mjs
      - name: Validate final production gates before activation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run validate:production-gates:final
      - name: Activate exact candidate Worker versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.123.0 versions deploy "${PUBLIC_WORKER_VERSION_ID}@100" --name lythaus-public-api-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "PUBLIC_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${ADMIN_WORKER_VERSION_ID}@100" --name lythaus-admin-api-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "ADMIN_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${JOBS_WORKER_VERSION_ID}@100" --name lythaus-jobs-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "JOBS_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Publish and verify same-origin admin API route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          echo "ADMIN_ROUTE_TRIGGER_ATTEMPTED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 triggers deploy --config apps/lythaus-admin-api/wrangler.jsonc --name lythaus-admin-api-development
          echo "ADMIN_ROUTE_TRIGGER_DEPLOYED=true" >> "$GITHUB_ENV"
          node scripts/ci/manage-cloudflare-worker-route.mjs verify \
            "$RUNNER_TEMP/production-cutover/admin-api-route-after.json" \
            'admin.lythaus.co/api/admin/*' \
            lythaus-admin-api-development
      - name: Export activated Worker version metadata
        id: release_metadata
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_WORKER_VERSION_ID:-}"
          test -n "${ADMIN_WORKER_VERSION_ID:-}"
          test -n "${JOBS_WORKER_VERSION_ID:-}"
          {
            echo "public_worker_version=$PUBLIC_WORKER_VERSION_ID"
            echo "admin_worker_version=$ADMIN_WORKER_VERSION_ID"
            echo "jobs_worker_version=$JOBS_WORKER_VERSION_ID"
            echo "hyperdrive_verified_main=${HYPERDRIVE_VERIFIED_MAIN:-false}"
            echo "database_identity_verified=${DATABASE_IDENTITY_VERIFIED:-false}"
            echo "budget_enforcement_verified=${BUDGET_ENFORCEMENT_VERIFIED:-false}"
            echo "authenticated_acceptance_proven=${AUTHENTICATED_ACCEPTANCE_PROVEN:-false}"
            echo "planetscale_grants_verified=${PLANETSCALE_GRANTS_VERIFIED:-false}"
            echo "worker_source_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Roll back partial Worker deployment on failure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          set +e
          rollback_failed=0
          if [[ "${ADMIN_ROUTE_TRIGGER_ATTEMPTED:-false}" == "true" ]]; then
            node scripts/ci/manage-cloudflare-worker-route.mjs restore \
              "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
              'admin.lythaus.co/api/admin/*' || rollback_failed=1
          fi
          if [[ "${JOBS_WORKER_DEPLOYED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $JOBS_ROLLBACK_SPECS --name lythaus-jobs-development --yes --message "Restore exact predeployment Lythaus jobs versions" || rollback_failed=1
          fi
          if [[ "${ADMIN_WORKER_DEPLOYED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $ADMIN_ROLLBACK_SPECS --name lythaus-admin-api-development --yes --message "Restore exact predeployment Lythaus admin versions" || rollback_failed=1
          fi
          if [[ "${PUBLIC_WORKER_DEPLOYED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $PUBLIC_ROLLBACK_SPECS --name lythaus-public-api-development --yes --message "Restore exact predeployment Lythaus public versions" || rollback_failed=1
          fi
          exit "$rollback_failed"
      - name: Upload sanitized production cutover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-cutover-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/production-cutover
          if-no-files-found: ignore
