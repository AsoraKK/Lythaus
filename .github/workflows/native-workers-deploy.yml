name: native-workers-deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
      acceptance_run_id:
        description: Existing exact-candidate acceptance run to resume after Keeper completion
        required: false
        default: ''
        type: string
      previous_production_sha:
        description: Previous canonical production SHA used to compute changed components
        required: false
        default: NONE
        type: string
      force_auth_critical:
        description: Upgrade the deterministic release class to AUTH_CRITICAL_RELEASE
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: Successful CI run ID for the exact release SHA
        required: true
        type: string
      codeql_run_id:
        description: Successful CodeQL run ID for the exact release SHA
        required: true
        type: string
      dependency_review_run_id:
        description: Successful dependency review run ID for the exact release SHA
        required: true
        type: string
      secret_scan_run_id:
        description: Successful native secret scan run ID for the exact release SHA
        required: true
        type: string
      historical_reconciliation_run_id:
        description: Successful historical reconciliation run ID for the exact release SHA
        required: true
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
      acceptance_run_id:
        description: Existing exact-candidate acceptance run to resume after Keeper completion
        required: false
        default: ''
        type: string
      previous_production_sha:
        description: Previous canonical production SHA used to compute changed components
        required: false
        default: NONE
        type: string
      source_evidence_verified:
        description: The canonical parent already verified exact CI/security evidence
        required: false
        default: false
        type: boolean
      force_auth_critical:
        description: Upgrade the deterministic release class to AUTH_CRITICAL_RELEASE
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: Successful CI run ID for the exact release SHA
        required: true
        type: string
      codeql_run_id:
        description: Successful CodeQL run ID for the exact release SHA
        required: true
        type: string
      dependency_review_run_id:
        description: Successful dependency review run ID for the exact release SHA
        required: true
        type: string
      secret_scan_run_id:
        description: Successful native secret scan run ID for the exact release SHA
        required: true
        type: string
      historical_reconciliation_run_id:
        description: Successful historical reconciliation run ID for the exact release SHA
        required: true
        type: string
    outputs:
      public_worker_version:
        description: Activated public API Worker version ID
        value: ${{ jobs.deploy.outputs.public_worker_version }}
      admin_worker_version:
        description: Activated admin API Worker version ID
        value: ${{ jobs.deploy.outputs.admin_worker_version }}
      jobs_worker_version:
        description: Activated jobs Worker version ID
        value: ${{ jobs.deploy.outputs.jobs_worker_version }}
      coordinator_worker_version:
        description: Activated protected acceptance coordinator Worker version ID
        value: ${{ jobs.deploy.outputs.coordinator_worker_version }}
      hyperdrive_verified_main:
        description: Exact-run proof that production Hyperdrive targets PlanetScale main
        value: ${{ jobs.deploy.outputs.hyperdrive_verified_main }}
      database_identity_verified:
        description: Exact-run proof that the production database identity passed verification
        value: ${{ jobs.deploy.outputs.database_identity_verified }}
      budget_enforcement_verified:
        description: Exact-run proof that budget enforcement passed acceptance
        value: ${{ jobs.deploy.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven:
        description: Exact-run proof that authenticated acceptance passed
        value: ${{ jobs.deploy.outputs.authenticated_acceptance_proven }}
      authenticated_acceptance_status:
        description: Generated candidate auth acceptance status
        value: ${{ jobs.deploy.outputs.authenticated_acceptance_status }}
      acceptance_expires_at:
        description: Exact candidate-bound acceptance expiry
        value: ${{ jobs.deploy.outputs.acceptance_expires_at }}
      acceptance_run_id:
        description: Exact candidate-bound acceptance run ID
        value: ${{ jobs.deploy.outputs.acceptance_run_id }}
      acceptance_dependencies_json:
        description: Exact candidate and reused Worker dependencies bound to the acceptance run
        value: ${{ jobs.deploy.outputs.acceptance_dependencies_json }}
      acceptance_keeper_url:
        description: Protected Cloudflare Access URL for the Keeper acceptance flow
        value: ${{ jobs.deploy.outputs.acceptance_keeper_url }}
      planetscale_grants_verified:
        description: Exact-run proof that PlanetScale grants passed the production contract
        value: ${{ jobs.deploy.outputs.planetscale_grants_verified }}
      worker_source_sha:
        description: Reviewed source SHA used for every activated Worker version
        value: ${{ jobs.deploy.outputs.worker_source_sha }}
      public_worker_source_sha:
        description: Public Worker source SHA or reused production source SHA
        value: ${{ jobs.deploy.outputs.public_worker_source_sha }}
      admin_worker_source_sha:
        description: Admin Worker source SHA or reused production source SHA
        value: ${{ jobs.deploy.outputs.admin_worker_source_sha }}
      jobs_worker_source_sha:
        description: Jobs Worker source SHA or reused production source SHA
        value: ${{ jobs.deploy.outputs.jobs_worker_source_sha }}
      coordinator_worker_source_sha:
        description: Coordinator Worker source SHA or reused production source SHA
        value: ${{ jobs.deploy.outputs.coordinator_worker_source_sha }}
      public_worker_provenance:
        description: Public Worker provenance
        value: ${{ jobs.deploy.outputs.public_worker_provenance }}
      admin_worker_provenance:
        description: Admin Worker provenance
        value: ${{ jobs.deploy.outputs.admin_worker_provenance }}
      jobs_worker_provenance:
        description: Jobs Worker provenance
        value: ${{ jobs.deploy.outputs.jobs_worker_provenance }}
      coordinator_worker_provenance:
        description: Coordinator Worker provenance
        value: ${{ jobs.deploy.outputs.coordinator_worker_provenance }}
      public_worker_status:
        description: Public Worker candidate or reuse status
        value: ${{ jobs.deploy.outputs.public_worker_status }}
      admin_worker_status:
        description: Admin Worker candidate or reuse status
        value: ${{ jobs.deploy.outputs.admin_worker_status }}
      jobs_worker_status:
        description: Jobs Worker candidate or reuse status
        value: ${{ jobs.deploy.outputs.jobs_worker_status }}
      coordinator_worker_status:
        description: Coordinator Worker candidate or reuse status
        value: ${{ jobs.deploy.outputs.coordinator_worker_status }}
      rollback_artifacts_proven:
        description: Exact predeployment Worker and route snapshots were captured for rollback
        value: ${{ jobs.deploy.outputs.rollback_artifacts_proven }}
      rollback_state:
        description: Rollback outcome for changed components
        value: ${{ jobs.deploy.outputs.rollback_state }}
      release_class:
        description: Deterministically computed release class
        value: ${{ jobs.deploy.outputs.release_class }}
      changed_components_json:
        description: Components that receive new candidates
        value: ${{ jobs.deploy.outputs.changed_components_json }}
      reused_components_json:
        description: Components that reuse known-good production versions
        value: ${{ jobs.deploy.outputs.reused_components_json }}
      acceptance_evidence_path:
        description: Sanitized auth acceptance evidence reference
        value: ${{ jobs.deploy.outputs.acceptance_evidence_path }}
      activation_state:
        description: Explicit activation state
        value: ${{ jobs.deploy.outputs.activation_state }}
      release_state:
        description: Explicit five-gate release state
        value: ${{ jobs.deploy.outputs.release_state }}
      release_state_history_json:
        description: Sanitized five-gate state history
        value: ${{ jobs.deploy.outputs.release_state_history_json }}
      failure_domain_evidence_json:
        description: Sanitized failure-domain evidence
        value: ${{ jobs.deploy.outputs.failure_domain_evidence_json }}

permissions:
  contents: read

concurrency:
  group: lythaus-production-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      public_worker_version: ${{ steps.release_metadata.outputs.public_worker_version }}
      admin_worker_version: ${{ steps.release_metadata.outputs.admin_worker_version }}
      jobs_worker_version: ${{ steps.release_metadata.outputs.jobs_worker_version }}
      coordinator_worker_version: ${{ steps.release_metadata.outputs.coordinator_worker_version }}
      hyperdrive_verified_main: ${{ steps.release_metadata.outputs.hyperdrive_verified_main }}
      database_identity_verified: ${{ steps.release_metadata.outputs.database_identity_verified }}
      budget_enforcement_verified: ${{ steps.release_metadata.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven: ${{ steps.release_metadata.outputs.authenticated_acceptance_proven }}
      authenticated_acceptance_status: ${{ steps.release_metadata.outputs.authenticated_acceptance_status }}
      acceptance_expires_at: ${{ steps.release_metadata.outputs.acceptance_expires_at }}
      acceptance_run_id: ${{ steps.release_metadata.outputs.acceptance_run_id }}
      acceptance_dependencies_json: ${{ steps.release_metadata.outputs.acceptance_dependencies_json }}
      acceptance_keeper_url: ${{ steps.release_metadata.outputs.acceptance_keeper_url }}
      planetscale_grants_verified: ${{ steps.release_metadata.outputs.planetscale_grants_verified }}
      worker_source_sha: ${{ steps.release_metadata.outputs.worker_source_sha }}
      rollback_artifacts_proven: ${{ steps.release_metadata.outputs.rollback_artifacts_proven }}
      rollback_state: ${{ steps.release_metadata.outputs.rollback_state }}
      release_class: ${{ steps.release_metadata.outputs.release_class }}
      changed_components_json: ${{ steps.release_metadata.outputs.changed_components_json }}
      reused_components_json: ${{ steps.release_metadata.outputs.reused_components_json }}
      acceptance_evidence_path: ${{ steps.release_metadata.outputs.acceptance_evidence_path }}
      activation_state: ${{ steps.release_metadata.outputs.activation_state }}
      release_state: ${{ steps.release_metadata.outputs.release_state }}
      release_state_history_json: ${{ steps.release_metadata.outputs.release_state_history_json }}
      failure_domain_evidence_json: ${{ steps.release_metadata.outputs.failure_domain_evidence_json }}
      public_worker_source_sha: ${{ steps.release_metadata.outputs.public_worker_source_sha }}
      admin_worker_source_sha: ${{ steps.release_metadata.outputs.admin_worker_source_sha }}
      jobs_worker_source_sha: ${{ steps.release_metadata.outputs.jobs_worker_source_sha }}
      coordinator_worker_source_sha: ${{ steps.release_metadata.outputs.coordinator_worker_source_sha }}
      public_worker_provenance: ${{ steps.release_metadata.outputs.public_worker_provenance }}
      admin_worker_provenance: ${{ steps.release_metadata.outputs.admin_worker_provenance }}
      jobs_worker_provenance: ${{ steps.release_metadata.outputs.jobs_worker_provenance }}
      coordinator_worker_provenance: ${{ steps.release_metadata.outputs.coordinator_worker_provenance }}
      public_worker_status: ${{ steps.release_metadata.outputs.public_worker_status }}
      admin_worker_status: ${{ steps.release_metadata.outputs.admin_worker_status }}
      jobs_worker_status: ${{ steps.release_metadata.outputs.jobs_worker_status }}
      coordinator_worker_status: ${{ steps.release_metadata.outputs.coordinator_worker_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact merged main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          checked_out_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$checked_out_sha" ]]; then
            echo "Refusing deployment: release_sha is not the checked-out main SHA." >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$remote_main_sha" ]]; then
            echo "Refusing deployment: checked-out main is not current origin/main." >&2
            exit 1
          fi
      - name: SOURCE - Require exact successful CI and security evidence
        if: inputs.source_evidence_verified != true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          DEPENDENCY_REVIEW_RUN_ID: ${{ inputs.dependency_review_run_id }}
          SECRET_SCAN_RUN_ID: ${{ inputs.secret_scan_run_id }}
          HISTORICAL_RECONCILIATION_RUN_ID: ${{ inputs.historical_reconciliation_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-exact-release-evidence.mjs
      - name: SOURCE - Resolve deterministic release class and component plan
        id: release_plan
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ inputs.previous_production_sha }}
          FORCE_AUTH_CRITICAL: ${{ inputs.force_auth_critical }}
        shell: bash
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=SOURCE'
            echo 'RELEASE_FAILURE_CODE=release_plan_failed'
            echo 'RELEASE_FAILURE_MESSAGE=deterministic release classification or component planning failed'
          } >> "$GITHUB_ENV"
          node scripts/ci/resolve-release-plan.mjs \
            --release-sha "$RELEASE_SHA" \
            --base-sha "$PREVIOUS_PRODUCTION_SHA" \
            --output "$RUNNER_TEMP/production-cutover/release-plan.json"
          jq -e --arg sha "$RELEASE_SHA" '.releaseSha == $sha and (.releaseClass == "STANDARD_RELEASE" or .releaseClass == "AUTH_CRITICAL_RELEASE")' "$RUNNER_TEMP/production-cutover/release-plan.json" >/dev/null
      - name: Require no manual release-class downgrade
        env:
          RELEASE_CLASS: ${{ steps.release_plan.outputs.release_class }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=SOURCE'
            echo 'RELEASE_FAILURE_CODE=manual_release_class_downgrade'
            echo 'RELEASE_FAILURE_MESSAGE=manual release-class downgrade is not permitted'
          } >> "$GITHUB_ENV"
          test -z "${RELEASE_CLASS_OVERRIDE:-}"
          if [[ "${{ inputs.force_auth_critical }}" == true ]]; then
            test "$RELEASE_CLASS" = AUTH_CRITICAL_RELEASE
          fi
          if [[ -n "${{ inputs.acceptance_run_id }}" ]]; then
            test "$RELEASE_CLASS" = AUTH_CRITICAL_RELEASE
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact release dependencies
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=release_dependency_install_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=exact release dependency installation failed' >> "$GITHUB_ENV"
          npm ci --ignore-scripts
      - name: Validate committed production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=worker_configuration_validation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=committed Worker configuration validation failed' >> "$GITHUB_ENV"
          npm run validate:native-workers
      - name: Validate production account and zone scope
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
          CLOUDFLARE_ENVIRONMENT: production
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=provider_scope_validation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=Cloudflare production account or zone scope validation failed' >> "$GITHUB_ENV"
          npm run validate:native-scope:production
      - name: Validate production predeployment gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CLASS: ${{ steps.release_plan.outputs.release_class }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=production_predeploy_gate_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=production predeployment safety gates failed' >> "$GITHUB_ENV"
          npm run validate:production-gates:predeploy
      - name: Validate migrations and generated Worker types
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=static_infrastructure_validation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=migration, provider, or generated Worker infrastructure validation failed' >> "$GITHUB_ENV"
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
          npm run validate:no-retired-provider-dependencies
          npm run validate:ai-gateway-paths
          npx --yes wrangler@4.123.0 types --check apps/lythaus-public-api/src/worker-configuration.d.ts --config apps/lythaus-public-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-admin-api/src/worker-configuration.d.ts --config apps/lythaus-admin-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-jobs/src/worker-configuration.d.ts --config apps/lythaus-jobs/wrangler.jsonc
      - name: Provision or verify the real production Turnstile widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_FILE: ${{ runner.temp }}/production-cutover/turnstile-secret.json
          TURNSTILE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/turnstile.json
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=provider_configuration_validation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=production Turnstile provider configuration validation failed' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/production-cutover"
          node scripts/cloudflare/waitlist-turnstile.mjs ensure
      - name: Materialize approved post-0016 deployment identity
        env:
          PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN: ${{ vars.PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN }}
          PRODUCT_INTEGRITY_ACCESS_AUDIENCES: ${{ vars.PRODUCT_INTEGRITY_ACCESS_AUDIENCES }}
          PRODUCT_INTEGRITY_ACCESS_JWKS_URL: ${{ vars.PRODUCT_INTEGRITY_ACCESS_JWKS_URL }}
          PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL: ${{ vars.PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL }}
          MATERIALIZE_PRODUCT_INTEGRITY_DEPLOY_CONFIGS: 'true'
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=deployment_identity_materialization_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=approved post-0016 deployment identity materialization failed' >> "$GITHUB_ENV"
          node scripts/ci/validate-product-integrity-deploy-identity.mjs
          npm run validate:native-workers:provisioned
      - name: Prove production Hyperdrive origins target PlanetScale main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: lythaus
          PLANETSCALE_DATABASE: lythaus-core
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=provider_origin_validation_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=production Hyperdrive or database origin validation failed' >> "$GITHUB_ENV"
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/production-cutover"
          node scripts/ci/verify-cloudflare-hyperdrive-targets.mjs | tee "$RUNNER_TEMP/production-cutover/hyperdrive-targets.json"
      - name: Capture predeployment Worker state (INFRASTRUCTURE gate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2129
          echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_CODE=rollback_snapshot_failed' >> "$GITHUB_ENV"
          echo 'RELEASE_FAILURE_MESSAGE=exact positive serving traffic rollback snapshot failed' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/production-cutover"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-before.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-before-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-before-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-before-versions.json"
          enrich_worker_versions() {
            local component="$1"
            local worker_name="$2"
            local deployment_path="$RUNNER_TEMP/production-cutover/${component}-before.json"
            local listed_path="$RUNNER_TEMP/production-cutover/${component}-before-versions.json"
            local enriched_path="${listed_path}.enriched"
            local exact_dir="$RUNNER_TEMP/production-cutover/exact-version-metadata"
            local exact_paths=()
            mkdir -p "$exact_dir"
            while IFS= read -r version_id; do
              [[ -n "$version_id" ]] || continue
              local exact_path="$exact_dir/${component}-${version_id}.json"
              npx --yes wrangler@4.123.0 versions view "$version_id" --name "$worker_name" --json > "$exact_path"
              exact_paths+=("$exact_path")
            done < <(jq -r '.versions[] | select((.percentage | tonumber) > 0) | .version_id' "$deployment_path")
            node scripts/ci/merge-worker-version-metadata.mjs "$listed_path" "${exact_paths[@]}" > "$enriched_path"
            mv "$enriched_path" "$listed_path"
          }
          enrich_worker_versions public lythaus-public-api-development
          enrich_worker_versions admin lythaus-admin-api-development
          enrich_worker_versions jobs lythaus-jobs-development
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/public-before.json" unused PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/admin-before.json" unused ADMIN
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/jobs-before.json" unused JOBS
          node scripts/ci/resolve-production-version-state.mjs "$RUNNER_TEMP/production-cutover/public-before.json" PUBLIC "$RUNNER_TEMP/production-cutover/public-before-versions.json"
          node scripts/ci/resolve-production-version-state.mjs "$RUNNER_TEMP/production-cutover/admin-before.json" ADMIN "$RUNNER_TEMP/production-cutover/admin-before-versions.json"
          node scripts/ci/resolve-production-version-state.mjs "$RUNNER_TEMP/production-cutover/jobs-before.json" JOBS "$RUNNER_TEMP/production-cutover/jobs-before-versions.json"
          CLOUDFLARE_WORKER_PARENT_EVIDENCE_PATH="$RUNNER_TEMP/production-cutover/coordinator-parent-before.json" \
          CLOUDFLARE_WORKER_PARENT_STATE_PATH="$RUNNER_TEMP/production-cutover/coordinator-parent-state-before.json" \
          node scripts/ci/ensure-cloudflare-worker-parent.mjs --check-only
          if jq -e '.status == "VERIFIED" and .deployment.exists == true' "$RUNNER_TEMP/production-cutover/coordinator-parent-state-before.json" >/dev/null; then
