name: native-workers-deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
      acceptance_run_id:
        description: Existing exact-candidate acceptance run to resume after Keeper completion
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string
      acceptance_run_id:
        description: Existing exact-candidate acceptance run to resume after Keeper completion
        required: false
        default: ''
        type: string
    outputs:
      public_worker_version:
        description: Activated public API Worker version ID
        value: ${{ jobs.deploy.outputs.public_worker_version }}
      admin_worker_version:
        description: Activated admin API Worker version ID
        value: ${{ jobs.deploy.outputs.admin_worker_version }}
      jobs_worker_version:
        description: Activated jobs Worker version ID
        value: ${{ jobs.deploy.outputs.jobs_worker_version }}
      hyperdrive_verified_main:
        description: Exact-run proof that production Hyperdrive targets PlanetScale main
        value: ${{ jobs.deploy.outputs.hyperdrive_verified_main }}
      database_identity_verified:
        description: Exact-run proof that the production database identity passed verification
        value: ${{ jobs.deploy.outputs.database_identity_verified }}
      budget_enforcement_verified:
        description: Exact-run proof that budget enforcement passed acceptance
        value: ${{ jobs.deploy.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven:
        description: Exact-run proof that authenticated acceptance passed
        value: ${{ jobs.deploy.outputs.authenticated_acceptance_proven }}
      authenticated_acceptance_status:
        description: Generated candidate auth acceptance status
        value: ${{ jobs.deploy.outputs.authenticated_acceptance_status }}
      acceptance_run_id:
        description: Exact candidate-bound acceptance run ID
        value: ${{ jobs.deploy.outputs.acceptance_run_id }}
      acceptance_keeper_url:
        description: Protected Cloudflare Access URL for the Keeper acceptance flow
        value: ${{ jobs.deploy.outputs.acceptance_keeper_url }}
      planetscale_grants_verified:
        description: Exact-run proof that PlanetScale grants passed the production contract
        value: ${{ jobs.deploy.outputs.planetscale_grants_verified }}
      worker_source_sha:
        description: Reviewed source SHA used for every activated Worker version
        value: ${{ jobs.deploy.outputs.worker_source_sha }}
      rollback_artifacts_proven:
        description: Exact predeployment Worker and route snapshots were captured for rollback
        value: ${{ jobs.deploy.outputs.rollback_artifacts_proven }}

permissions:
  contents: read

concurrency:
  group: lythaus-production-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      public_worker_version: ${{ steps.release_metadata.outputs.public_worker_version }}
      admin_worker_version: ${{ steps.release_metadata.outputs.admin_worker_version }}
      jobs_worker_version: ${{ steps.release_metadata.outputs.jobs_worker_version }}
      hyperdrive_verified_main: ${{ steps.release_metadata.outputs.hyperdrive_verified_main }}
      database_identity_verified: ${{ steps.release_metadata.outputs.database_identity_verified }}
      budget_enforcement_verified: ${{ steps.release_metadata.outputs.budget_enforcement_verified }}
      authenticated_acceptance_proven: ${{ steps.release_metadata.outputs.authenticated_acceptance_proven }}
      authenticated_acceptance_status: ${{ steps.release_metadata.outputs.authenticated_acceptance_status }}
      acceptance_run_id: ${{ steps.release_metadata.outputs.acceptance_run_id }}
      acceptance_keeper_url: ${{ steps.release_metadata.outputs.acceptance_keeper_url }}
      planetscale_grants_verified: ${{ steps.release_metadata.outputs.planetscale_grants_verified }}
      worker_source_sha: ${{ steps.release_metadata.outputs.worker_source_sha }}
      rollback_artifacts_proven: ${{ steps.release_metadata.outputs.rollback_artifacts_proven }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact merged main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          checked_out_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$checked_out_sha" ]]; then
            echo "Refusing deployment: release_sha is not the checked-out main SHA." >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$remote_main_sha" ]]; then
            echo "Refusing deployment: checked-out main is not current origin/main." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate committed production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-workers
      - name: Validate production account and zone scope
        env:
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-scope:production
      - name: Validate production predeployment gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run validate:production-gates:predeploy
      - name: Validate migrations and generated Worker types
        run: |
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
          npm run validate:no-retired-provider-dependencies
          npm run validate:ai-gateway-paths
          npx --yes wrangler@4.123.0 types --check apps/lythaus-public-api/src/worker-configuration.d.ts --config apps/lythaus-public-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-admin-api/src/worker-configuration.d.ts --config apps/lythaus-admin-api/wrangler.jsonc
          npx --yes wrangler@4.123.0 types --check apps/lythaus-jobs/src/worker-configuration.d.ts --config apps/lythaus-jobs/wrangler.jsonc
      - name: Provision or verify the real production Turnstile widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_FILE: ${{ runner.temp }}/production-cutover/turnstile-secret.json
          TURNSTILE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/turnstile.json
        run: |
          mkdir -p "$RUNNER_TEMP/production-cutover"
          node scripts/cloudflare/waitlist-turnstile.mjs ensure
      - name: Materialize approved post-0015 deployment identity
        env:
          PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN: ${{ vars.PRODUCT_INTEGRITY_ACCESS_TEAM_DOMAIN }}
          PRODUCT_INTEGRITY_ACCESS_AUDIENCES: ${{ vars.PRODUCT_INTEGRITY_ACCESS_AUDIENCES }}
          PRODUCT_INTEGRITY_ACCESS_JWKS_URL: ${{ vars.PRODUCT_INTEGRITY_ACCESS_JWKS_URL }}
          PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL: ${{ vars.PRODUCT_INTEGRITY_EXTERNAL_BACKUP_HEALTHCHECK_URL }}
          MATERIALIZE_PRODUCT_INTEGRITY_DEPLOY_CONFIGS: 'true'
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          CLOUDFLARE_ENVIRONMENT: production
        run: |
          node scripts/ci/validate-product-integrity-deploy-identity.mjs
          npm run validate:native-workers:provisioned
      - name: Prove production Hyperdrive origins target PlanetScale main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: lythaus
          PLANETSCALE_DATABASE: lythaus-core
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/production-cutover"
          node scripts/ci/verify-cloudflare-hyperdrive-targets.mjs | tee "$RUNNER_TEMP/production-cutover/hyperdrive-targets.json"
      - name: Capture predeployment Worker state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-cutover"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-before.json"
          npx --yes wrangler@4.123.0 deployments status --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-before.json"
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/public-before.json" unused PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/admin-before.json" unused ADMIN
          node scripts/ci/resolve-worker-version-state.mjs rollback "$RUNNER_TEMP/production-cutover/jobs-before.json" unused JOBS
      - name: Capture predeployment same-origin admin API route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          node scripts/ci/manage-cloudflare-worker-route.mjs snapshot \
            "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
            'admin.lythaus.co/api/admin/*'
      - name: Record verified main routing assertion
        run: echo "HYPERDRIVE_VERIFIED_MAIN=true" >> "$GITHUB_ENV"
      - name: Verify production schema read-only
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: node scripts/ci/verify-planetscale-production-schema.mjs
      - name: Provision and verify Cloudflare Email Sending lifecycle infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
          CLOUDFLARE_EMAIL_LIFECYCLE_OUTPUT: ${{ runner.temp }}/production-cutover/email-lifecycle-infrastructure.json
        run: node scripts/ci/provision-cloudflare-email-lifecycle.mjs
      - name: Upload immutable candidate Worker versions
        if: inputs.acceptance_run_id == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          PII_ENCRYPTION_KEY_V1: ${{ secrets.PII_ENCRYPTION_KEY_V1 }}
          PII_HMAC_KEY_V1: ${{ secrets.PII_HMAC_KEY_V1 }}
          ACCESS_SUBJECT_HMAC_KEY: ${{ secrets.ACCESS_SUBJECT_HMAC_KEY }}
          AUTH_ACCEPTANCE_EMAIL_BASE: ${{ secrets.CODEX_TEST_EMAIL }}
          CLOUDFLARE_EMAIL_LIFECYCLE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_READINESS_TOKEN"
          test -n "$PII_ENCRYPTION_KEY_V1"
          test -n "$PII_HMAC_KEY_V1"
          test -n "$ACCESS_SUBJECT_HMAC_KEY"
          test -n "$AUTH_ACCEPTANCE_EMAIL_BASE"
          test -n "$CLOUDFLARE_EMAIL_LIFECYCLE_READ_TOKEN"
          umask 077
          secrets_file="$RUNNER_TEMP/production-cutover/worker-secrets.json"
          turnstile_secret_file="$RUNNER_TEMP/production-cutover/turnstile-secret.json"
          test -s "$turnstile_secret_file"
          trap 'rm -f "$secrets_file" "$turnstile_secret_file"' EXIT
          jq -n \
            --arg readiness_token "$DATABASE_READINESS_TOKEN" \
            --arg cloudflare_account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg encryption_key "$PII_ENCRYPTION_KEY_V1" \
            --arg hmac_key "$PII_HMAC_KEY_V1" \
            --arg access_subject_hmac_key "$ACCESS_SUBJECT_HMAC_KEY" \
            --arg acceptance_email_base "$AUTH_ACCEPTANCE_EMAIL_BASE" \
            --arg lifecycle_read_token "$CLOUDFLARE_EMAIL_LIFECYCLE_READ_TOKEN" \
            '{DATABASE_READINESS_TOKEN: $readiness_token,
              CLOUDFLARE_ACCOUNT_ID: $cloudflare_account_id,
              PII_ENCRYPTION_KEY_V1: $encryption_key,
              PII_HMAC_KEY_V1: $hmac_key,
              ACCESS_SUBJECT_HMAC_KEY: $access_subject_hmac_key,
              AUTH_ACCEPTANCE_EMAIL_BASE: $acceptance_email_base,
              CLOUDFLARE_EMAIL_LIFECYCLE_READ_TOKEN: $lifecycle_read_token}' > "$secrets_file"
          jq -s 'add' "$secrets_file" "$turnstile_secret_file" > "$secrets_file.merged"
          mv "$secrets_file.merged" "$secrets_file"
          upload_candidate() {
            local config="$1"
            local prefix="$2"
            local output="$3"
            npx --yes wrangler@4.123.0 versions upload --config "$config" --tag "$RELEASE_SHA" --message "Lythaus candidate $RELEASE_SHA" --secrets-file "$secrets_file" 2>&1 | tee "$output"
            node scripts/ci/resolve-worker-version-state.mjs upload "$output" "$RELEASE_SHA" "$prefix"
          }
          upload_candidate apps/lythaus-public-api/wrangler.jsonc PUBLIC "$RUNNER_TEMP/production-cutover/public-upload.log"
          upload_candidate apps/lythaus-admin-api/wrangler.jsonc ADMIN "$RUNNER_TEMP/production-cutover/admin-upload.log"
          upload_candidate apps/lythaus-jobs/wrangler.jsonc JOBS "$RUNNER_TEMP/production-cutover/jobs-upload.log"
          upload_candidate apps/lythaus-auth-acceptance-coordinator/wrangler.jsonc COORDINATOR "$RUNNER_TEMP/production-cutover/coordinator-upload.log"
          npx --yes wrangler@4.123.0 versions list --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-auth-acceptance-coordinator-development --json > "$RUNNER_TEMP/production-cutover/coordinator-versions.json"
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/public-versions.json" "$RELEASE_SHA" PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/admin-versions.json" "$RELEASE_SHA" ADMIN
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/jobs-versions.json" "$RELEASE_SHA" JOBS
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/coordinator-versions.json" "$RELEASE_SHA" COORDINATOR
      - name: Resolve the existing exact-candidate Worker versions for resume
        if: inputs.acceptance_run_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 versions list --name lythaus-public-api-development --json > "$RUNNER_TEMP/production-cutover/public-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-admin-api-development --json > "$RUNNER_TEMP/production-cutover/admin-versions.json"
          npx --yes wrangler@4.123.0 versions list --name lythaus-jobs-development --json > "$RUNNER_TEMP/production-cutover/jobs-versions.json"
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/public-versions.json" "$RELEASE_SHA" PUBLIC
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/admin-versions.json" "$RELEASE_SHA" ADMIN
          node scripts/ci/resolve-worker-version-state.mjs candidate "$RUNNER_TEMP/production-cutover/jobs-versions.json" "$RELEASE_SHA" JOBS
      - name: Stage candidate Worker versions at zero traffic
        if: inputs.acceptance_run_id == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
        run: |
          set -euo pipefail
          echo "PUBLIC_WORKER_STAGED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy $PUBLIC_ROLLBACK_SPECS "${PUBLIC_WORKER_VERSION_ID}@0" \
            --name lythaus-public-api-development --yes --message "Stage reviewed Lythaus public candidate at zero traffic"
          echo "ADMIN_WORKER_STAGED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy $ADMIN_ROLLBACK_SPECS "${ADMIN_WORKER_VERSION_ID}@0" \
            --name lythaus-admin-api-development --yes --message "Stage reviewed Lythaus admin candidate at zero traffic"
          # Queue consumers do not accept a per-request Worker-version override.
          # The exact Jobs candidate must therefore be active before any real
          # email can produce lifecycle evidence; it has no public HTTP route.
          echo "JOBS_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${JOBS_WORKER_VERSION_ID}@100" \
            --name lythaus-jobs-development --yes --message "Activate exact Jobs lifecycle consumer for candidate acceptance"
          echo "COORDINATOR_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${COORDINATOR_WORKER_VERSION_ID}@100" \
            --name lythaus-auth-acceptance-coordinator-development --yes --message "Activate protected exact-SHA acceptance coordinator"
          npx --yes wrangler@4.123.0 triggers deploy --config apps/lythaus-auth-acceptance-coordinator/wrangler.jsonc \
            --name lythaus-auth-acceptance-coordinator-development
          candidate_staged_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          echo "ADR003_CANDIDATE_STAGED_AT=$candidate_staged_at" >> "$GITHUB_ENV"
      - name: Validate or create the exact-candidate Keeper acceptance run
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXISTING_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PUBLIC_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          PUBLIC_WORKER_CREATED_AT: ${{ env.PUBLIC_WORKER_CREATED_AT }}
          CANDIDATE_STAGED_AT: ${{ env.ADR003_CANDIDATE_STAGED_AT }}
        run: |
          set -euo pipefail
          base='https://admin.lythaus.co/api/admin/production-auth-acceptance'
          test -n "$DATABASE_READINESS_TOKEN" && test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          curl_headers=(
            -H 'accept: application/json'
            -H "authorization: Bearer ${DATABASE_READINESS_TOKEN}"
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )
          if [[ -n "$EXISTING_ACCEPTANCE_RUN_ID" ]]; then
            [[ "$EXISTING_ACCEPTANCE_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            run_json="$(curl --fail --silent --show-error --max-time 30 "${curl_headers[@]}" "$base/runs/$EXISTING_ACCEPTANCE_RUN_ID")"
            jq -e --arg sha "$RELEASE_SHA" --arg version "$PUBLIC_WORKER_VERSION_ID" '
              .acceptanceRunId != null and .releaseSha == $sha and .candidate.workerName == "lythaus-public-api-development"
              and .candidate.workerVersionId == $version and (.status == "pending" or .status == "in_progress" or .status == "completed")
            ' <<<"$run_json" >/dev/null
            run_id="$EXISTING_ACCEPTANCE_RUN_ID"
            keeper_url="https://admin.lythaus.co/production-auth-acceptance?run=$run_id"
            uploaded_at="$(jq -r '.candidate.uploadedAt' <<<"$run_json")"
            staged_at="$(jq -r '.candidate.stagedAt' <<<"$run_json")"
          else
            test -n "$PUBLIC_WORKER_CREATED_AT" && test -n "$CANDIDATE_STAGED_AT"
            payload="$(jq -n --arg releaseSha "$RELEASE_SHA" --arg candidateWorker lythaus-public-api-development --arg candidateVersion "$PUBLIC_WORKER_VERSION_ID" --arg candidateUploadedAt "$PUBLIC_WORKER_CREATED_AT" --arg candidateStagedAt "$CANDIDATE_STAGED_AT" '{releaseSha:$releaseSha,candidateWorker:$candidateWorker,candidateVersion:$candidateVersion,candidateUploadedAt:$candidateUploadedAt,candidateStagedAt:$candidateStagedAt}')"
            run_json="$(curl --fail --silent --show-error --max-time 30 -X POST "${curl_headers[@]}" -H 'content-type: application/json' --data "$payload" "$base/runs")"
            jq -e '.acceptanceRunId and .keeperUrl and .expiresAt' <<<"$run_json" >/dev/null
            run_id="$(jq -r '.acceptanceRunId' <<<"$run_json")"
            keeper_url="$(jq -r '.keeperUrl' <<<"$run_json")"
            uploaded_at="$PUBLIC_WORKER_CREATED_AT"
            staged_at="$CANDIDATE_STAGED_AT"
          fi
          {
            echo "AUTH_ACCEPTANCE_RUN_ID=$run_id"
            echo "ADR003_CANDIDATE_UPLOADED_AT=$uploaded_at"
            echo "ADR003_CANDIDATE_STAGED_AT=$staged_at"
            echo "AUTH_ACCEPTANCE_KEEPER_URL=$keeper_url"
          } >> "$GITHUB_ENV"
          {
            echo '## Production authentication acceptance'
            echo
            echo "Exact candidate: \`$PUBLIC_WORKER_VERSION_ID\` for \`$RELEASE_SHA\`."
            echo "Keeper URL (Cloudflare Access required): $keeper_url"
            echo "Complete real Turnstile and mailbox actions there, then re-dispatch this same exact SHA with \`acceptance_run_id\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Probe public candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0015_production_auth_acceptance_coordinator.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-public-api-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          PRODUCTION_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/public-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Probe admin candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0015_production_auth_acceptance_coordinator.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-admin-api-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.ADMIN_WORKER_VERSION_ID }}
          PRODUCTION_ADMIN_API_BASE_URL: ${{ vars.PRODUCTION_ADMIN_API_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/admin-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Probe jobs candidate without production traffic
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0015_production_auth_acceptance_coordinator.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-jobs-development
          PRODUCTION_WORKER_VERSION_ID: ${{ env.JOBS_WORKER_VERSION_ID }}
          PRODUCTION_JOBS_API_BASE_URL: ${{ vars.PRODUCTION_JOBS_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/jobs-candidate-probe.json
        run: node scripts/ci/probe-production-workers.mjs
      - name: Collect generated candidate auth acceptance evidence
        id: auth_acceptance_observation
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_SOURCE: protected_probe
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_URL: https://admin.lythaus.co/api/admin/production-auth-acceptance/observer
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/auth-acceptance-observation.json
          ADR003_ACCEPTANCE_RUN_ID: ${{ env.AUTH_ACCEPTANCE_RUN_ID }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          ADR003_CANDIDATE_UPLOADED_AT: ${{ env.PUBLIC_WORKER_CREATED_AT }}
          ADR003_CANDIDATE_STAGED_AT: ${{ env.ADR003_CANDIDATE_STAGED_AT }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/ci/collect-auth-acceptance-evidence.mjs
      - name: Run authenticated acceptance against public candidate
        if: steps.auth_acceptance_observation.outcome == 'success'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_WORKER_VERSION_ID: ${{ env.PUBLIC_WORKER_VERSION_ID }}
          ADR003_DATABASE_READINESS_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/public-candidate-probe.json
          ADR003_WEB_HEALTH_URL: ${{ vars.ADR003_WEB_HEALTH_URL }}
          ADR003_WEB_ORIGIN: ${{ vars.ADR003_WEB_ORIGIN }}
          ADR003_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/adr003-candidate-acceptance.json
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/auth-acceptance-observation.json
          ADR003_ACCEPTANCE_RUN_ID: ${{ env.AUTH_ACCEPTANCE_RUN_ID }}
          ADR003_WORKER_VERSIONS_JSON: ${{ vars.ADR003_WORKER_VERSIONS_JSON }}
          ADR003_CANDIDATE_UPLOADED_AT: ${{ env.PUBLIC_WORKER_CREATED_AT }}
          ADR003_CANDIDATE_STAGED_AT: ${{ env.ADR003_CANDIDATE_STAGED_AT }}
          ADR003_HYPERDRIVE_IDS_JSON: ${{ vars.ADR003_HYPERDRIVE_IDS_JSON }}
          ADR003_GUEST_ACCEPTED: ${{ vars.ADR003_GUEST_ACCEPTED }}
          ADR003_MOBILE_EMAIL_ACCEPTED: ${{ vars.ADR003_MOBILE_EMAIL_ACCEPTED }}
          ADR003_RUN_DESTRUCTIVE_ACCOUNT_DELETION: 'false'
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0015_production_auth_acceptance_coordinator.sql
          EXPECTED_DATABASE_BUDGET_LEDGER_APPLIED: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          ADR003_TEST_EMAIL: ${{ secrets.CODEX_TEST_EMAIL }}
          ADR003_TEST_PASSWORD: ${{ secrets.CODEX_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          api_base="${ADR003_API_BASE_URL%/}"
          test -n "$api_base"
          if [[ "$api_base" != */api ]]; then
            api_base="$api_base/api"
          fi
          export ADR003_API_BASE_URL="$api_base"
          npm run acceptance:adr003
      - name: Require generated candidate auth acceptance
        if: always()
        env:
          OBSERVER_OUTCOME: ${{ steps.auth_acceptance_observation.outcome }}
        run: |
          set -euo pipefail
          test "$OBSERVER_OUTCOME" = success || {
            status="$(jq -r '.status // "BLOCKED"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" 2>/dev/null || echo BLOCKED)"
            if [[ "$status" = HUMAN_ACCEPTANCE_REQUIRED ]]; then
              echo 'AUTH_ACCEPTANCE_PENDING=true' >> "$GITHUB_ENV"
              echo "HUMAN_ACCEPTANCE_REQUIRED: complete the real Turnstile and mailbox interaction at ${AUTH_ACCEPTANCE_KEEPER_URL}, then re-dispatch this exact SHA with acceptance_run_id=${AUTH_ACCEPTANCE_RUN_ID}." >&2
            elif [[ "$status" = BLOCKED ]] && jq -e '.reason == "provider_configuration_missing"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null 2>&1; then
              echo 'Provider configuration failure: the enabled mail.lythaus.co Cloudflare Email Sending queue subscription was not independently observed for the required lifecycle events.' >&2
            else
              echo "Candidate auth acceptance is not independently proven: $status" >&2
            fi
            exit 1
          }
          jq -e '.status == "PASSED"' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null
          jq -e '
            .status == "PASSED" and
            .lifecycleSubscription.source == "cloudflare_email_sending_queue_subscription_observation" and
            .lifecycleSubscription.domain == "mail.lythaus.co" and
            .lifecycleSubscription.status == "enabled" and
            ((.lifecycleSubscription.events | sort) == ["bounced", "complained", "deferred", "delivered", "failed", "rejected"])
          ' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json" >/dev/null
          jq -e '.status == "PASSED"' "$RUNNER_TEMP/production-cutover/adr003-candidate-acceptance.json" >/dev/null
          {
            echo "DATABASE_IDENTITY_VERIFIED=true"
            echo "BUDGET_ENFORCEMENT_VERIFIED=true"
            echo "AUTHENTICATED_ACCEPTANCE_PROVEN=true"
            echo "PLANETSCALE_GRANTS_VERIFIED=true"
          } >> "$GITHUB_ENV"
      - name: Reverify production schema before activation
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: node scripts/ci/verify-planetscale-production-schema.mjs
      - name: Validate final production gates before activation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run validate:production-gates:final
      - name: Activate exact candidate Worker versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.123.0 versions deploy "${PUBLIC_WORKER_VERSION_ID}@100" --name lythaus-public-api-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "PUBLIC_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${ADMIN_WORKER_VERSION_ID}@100" --name lythaus-admin-api-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "ADMIN_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 versions deploy "${JOBS_WORKER_VERSION_ID}@100" --name lythaus-jobs-development --yes --message "Activate reviewed Lythaus release ${{ inputs.release_sha }}"
          echo "JOBS_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Publish and verify same-origin admin API route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          echo "ADMIN_ROUTE_TRIGGER_ATTEMPTED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4.123.0 triggers deploy --config apps/lythaus-admin-api/wrangler.jsonc --name lythaus-admin-api-development
          echo "ADMIN_ROUTE_TRIGGER_DEPLOYED=true" >> "$GITHUB_ENV"
          node scripts/ci/manage-cloudflare-worker-route.mjs verify \
            "$RUNNER_TEMP/production-cutover/admin-api-route-after.json" \
            'admin.lythaus.co/api/admin/*' \
            lythaus-admin-api-development
      - name: Export activated Worker version metadata
        id: release_metadata
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_WORKER_VERSION_ID:-}"
          test -n "${ADMIN_WORKER_VERSION_ID:-}"
          test -n "${JOBS_WORKER_VERSION_ID:-}"
          test -s "$RUNNER_TEMP/production-cutover/public-before.json"
          test -s "$RUNNER_TEMP/production-cutover/admin-before.json"
          test -s "$RUNNER_TEMP/production-cutover/jobs-before.json"
          test -s "$RUNNER_TEMP/production-cutover/admin-api-route-before.json"
          lifecycle_evidence="$RUNNER_TEMP/production-cutover/email-lifecycle-infrastructure.json"
          jq -e --arg jobs_version "$JOBS_WORKER_VERSION_ID" '
            if (
              .status == "VERIFIED"
              and .subscription.enabled == true
              and .subscription.source == "email.sending"
              and .subscription.domain == "mail.lythaus.co"
              and ((.subscription.events | sort) == ["message.bounced", "message.complained", "message.deferred", "message.delivered", "message.failed", "message.rejected"])
              and .consumer == {
                queue: "lythaus-email-lifecycle-dev",
                max_batch_size: 25,
                max_batch_timeout: 5,
                max_retries: 10,
                dead_letter_queue: "lythaus-email-lifecycle-dlq-dev"
              }
            ) then .consumer.jobsWorkerVersionId = $jobs_version else error("email_lifecycle_evidence_invalid") end
          ' "$lifecycle_evidence" > "$lifecycle_evidence.tmp"
          mv "$lifecycle_evidence.tmp" "$lifecycle_evidence"
          {
            echo "public_worker_version=$PUBLIC_WORKER_VERSION_ID"
            echo "admin_worker_version=$ADMIN_WORKER_VERSION_ID"
            echo "jobs_worker_version=$JOBS_WORKER_VERSION_ID"
            echo "hyperdrive_verified_main=${HYPERDRIVE_VERIFIED_MAIN:-false}"
            echo "database_identity_verified=${DATABASE_IDENTITY_VERIFIED:-false}"
            echo "budget_enforcement_verified=${BUDGET_ENFORCEMENT_VERIFIED:-false}"
            echo "authenticated_acceptance_proven=${AUTHENTICATED_ACCEPTANCE_PROVEN:-false}"
            echo "authenticated_acceptance_status=$(jq -r '.status' "$RUNNER_TEMP/production-cutover/auth-acceptance-observation.json")"
            echo "acceptance_run_id=$AUTH_ACCEPTANCE_RUN_ID"
            echo "acceptance_keeper_url=$AUTH_ACCEPTANCE_KEEPER_URL"
            echo "planetscale_grants_verified=${PLANETSCALE_GRANTS_VERIFIED:-false}"
            echo "worker_source_sha=$RELEASE_SHA"
            echo "rollback_artifacts_proven=true"
          } >> "$GITHUB_OUTPUT"
      - name: Roll back partial Worker deployment on failure
        if: failure() && env.AUTH_ACCEPTANCE_PENDING != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
        run: |
          set +e
          rollback_failed=0
          if [[ "${ADMIN_ROUTE_TRIGGER_ATTEMPTED:-false}" == "true" ]]; then
            node scripts/ci/manage-cloudflare-worker-route.mjs restore \
              "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
              'admin.lythaus.co/api/admin/*' || rollback_failed=1
          fi
          if [[ "${JOBS_WORKER_DEPLOYED:-false}" == "true" || "${JOBS_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $JOBS_ROLLBACK_SPECS --name lythaus-jobs-development --yes --message "Restore exact predeployment Lythaus jobs versions" || rollback_failed=1
          fi
          if [[ "${ADMIN_WORKER_DEPLOYED:-false}" == "true" || "${ADMIN_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $ADMIN_ROLLBACK_SPECS --name lythaus-admin-api-development --yes --message "Restore exact predeployment Lythaus admin versions" || rollback_failed=1
          fi
          if [[ "${PUBLIC_WORKER_DEPLOYED:-false}" == "true" || "${PUBLIC_WORKER_STAGED:-false}" == "true" ]]; then
            npx --yes wrangler@4.123.0 versions deploy $PUBLIC_ROLLBACK_SPECS --name lythaus-public-api-development --yes --message "Restore exact predeployment Lythaus public versions" || rollback_failed=1
          fi
          exit "$rollback_failed"
      - name: Remove ephemeral production secret files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/production-cutover/worker-secrets.json" "$RUNNER_TEMP/production-cutover/turnstile-secret.json"
      - name: Upload sanitized production cutover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-cutover-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/production-cutover
          if-no-files-found: ignore
