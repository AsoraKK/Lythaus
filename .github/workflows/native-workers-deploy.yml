          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=INFRASTRUCTURE'
            echo 'RELEASE_FAILURE_CODE=acceptance_rollback_snapshot_failed'
            echo 'RELEASE_FAILURE_MESSAGE=exact positive serving traffic and route rollback snapshot could not be preserved'
          } >> "$GITHUB_ENV"
          snapshot="$RUNNER_TEMP/production-cutover/acceptance-rollback-snapshot.json"
          if [[ -n "$EXISTING_ACCEPTANCE_RUN_ID" ]]; then
            [[ "$EXISTING_ACCEPTANCE_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
              echo 'acceptance_run_id must be a UUID.' >&2
              exit 1
            }
            test -n "$DATABASE_READINESS_TOKEN"
            run_summary="$RUNNER_TEMP/production-cutover/acceptance-run-summary.json"
            curl_headers=(
              -H 'accept: application/json'
              -H "x-lythaus-readiness-token: ${DATABASE_READINESS_TOKEN}"
            )
            if [[ -n "$CF_ACCESS_CLIENT_ID" || -n "$CF_ACCESS_CLIENT_SECRET" ]]; then
              test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
              curl_headers+=(
                -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
                -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
              )
            fi
            status="$(curl --silent --show-error --max-time 30 --retry 3 --retry-delay 2 \
              -o "$run_summary" -w '%{http_code}' \
              "${curl_headers[@]}" \
              "https://admin.lythaus.co/api/admin/production-auth-acceptance/runs/${EXISTING_ACCEPTANCE_RUN_ID}" || true)"
            test "$status" = 200 || {
              echo "Could not read the exact acceptance rollback snapshot (HTTP ${status})." >&2
              exit 1
            }
            jq -e --arg sha "$RELEASE_SHA" '
              .releaseSha == $sha
              and .candidate.workerName == "lythaus-public-api-development"
              and .rollbackSnapshot != null
            ' "$run_summary" >/dev/null
            node scripts/ci/prepare-acceptance-rollback-snapshot.mjs from-run \
              --run "$run_summary" --output "$snapshot"
          else
            node scripts/ci/prepare-acceptance-rollback-snapshot.mjs capture \
              --public "$RUNNER_TEMP/production-cutover/public-before.json" \
              --admin "$RUNNER_TEMP/production-cutover/admin-before.json" \
              --jobs "$RUNNER_TEMP/production-cutover/jobs-before.json" \
              --coordinator "$RUNNER_TEMP/production-cutover/coordinator-before.json" \
              --admin-route "$RUNNER_TEMP/production-cutover/admin-api-route-before.json" \
              --coordinator-route "$RUNNER_TEMP/production-cutover/coordinator-route-before.json" \
              --output "$snapshot"
          fi
          for component in public admin jobs coordinator; do
            rollback_file="$RUNNER_TEMP/production-cutover/${component}-acceptance-rollback.json"
            jq -c --arg component "$component" '{versions: .workers[$component].versions | map({version_id: .versionId, percentage: .percentage})}' "$snapshot" > "$rollback_file"
            if [[ "$component" = coordinator && "$(jq '.versions | length' "$rollback_file")" = 0 ]]; then
              echo 'COORDINATOR_ROLLBACK_SPECS=' >> "$GITHUB_ENV"
            else
              node scripts/ci/resolve-worker-version-state.mjs rollback "$rollback_file" unused "${component^^}"
            fi
            jq -c --arg component "$component" '{versions: .workers[$component].versions | map({version_id: .versionId, percentage: .percentage})}' "$snapshot" > "$RUNNER_TEMP/production-cutover/${component}-before.json"
          done
          jq -c '{route: .routes.adminApi}' "$snapshot" > "$RUNNER_TEMP/production-cutover/admin-api-route-before.json"
          jq -c '{route: .routes.coordinator}' "$snapshot" > "$RUNNER_TEMP/production-cutover/coordinator-route-before.json"
          echo 'ROLLBACK_ARTIFACTS_PROVEN=true' >> "$GITHUB_ENV"
          component_changed() {
            jq -e --arg component "$1" --argjson components "$CHANGED_COMPONENTS_JSON" '$components | index($component) != null' <<< '{}' >/dev/null
          }
          if [[ -n "$EXISTING_ACCEPTANCE_RUN_ID" ]]; then
            if component_changed jobs; then
              echo 'JOBS_WORKER_DEPLOYED=true' >> "$GITHUB_ENV"
            fi
            if component_changed coordinator; then
              echo 'COORDINATOR_WORKER_DEPLOYED=true' >> "$GITHUB_ENV"
              echo 'COORDINATOR_ROUTE_TRIGGER_ATTEMPTED=true' >> "$GITHUB_ENV"
            fi
          fi
          echo "ACCEPTANCE_ROLLBACK_SNAPSHOT_PATH=$snapshot" >> "$GITHUB_ENV"
          if [[ -n "$EXISTING_ACCEPTANCE_RUN_ID" ]]; then
            echo "ACCEPTANCE_RUN_SUMMARY_PATH=$run_summary" >> "$GITHUB_ENV"
          fi
