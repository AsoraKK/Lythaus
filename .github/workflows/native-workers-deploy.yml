              echo "${prefix}_WORKER_SOURCE_SHA=$RELEASE_SHA"
            } >> "$GITHUB_ENV"
          }
          reuse_production() {
            local prefix="$1"
            local version_var="${prefix}_REUSED_PRODUCTION_VERSION_ID"
            local version_id="${!version_var:-}"
            test -n "$version_id" || { echo "Missing captured production version for unchanged ${prefix}." >&2; exit 1; }
            {
              echo "${prefix}_WORKER_VERSION_ID=$version_id"
              echo "${prefix}_WORKER_PROVENANCE=REUSED_KNOWN_GOOD_PRODUCTION_VERSION"
              echo "${prefix}_WORKER_STATUS=REUSED_PRODUCTION"
            } >> "$GITHUB_ENV"
            version_ids_var="${prefix}_REUSED_PRODUCTION_VERSION_IDS_JSON"
            source_shas_var="${prefix}_REUSED_PRODUCTION_SOURCE_SHAS_JSON"
            created_ats_var="${prefix}_REUSED_PRODUCTION_CREATED_ATS_JSON"
            version_ids_json="${!version_ids_var:-[]}"
            source_shas_json="${!source_shas_var:-[]}"
            created_ats_json="${!created_ats_var:-[]}"
            jq -e --argjson ids "$version_ids_json" --argjson shas "$source_shas_json" --argjson created "$created_ats_json" '
              ($ids | type == "array" and length > 0)
              and ($shas | type == "array" and length == ($ids | length) and all(.[]; type == "string" and test("^[0-9a-f]{40}$"; "i")))
              and ($created | type == "array" and length == ($ids | length) and all(.[]; type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{3})?Z$")))
            ' <<< '{}' >/dev/null || {
              echo "Missing exact source or creation provenance for positive serving ${prefix} versions; refusing unverifiable reuse." >&2
              exit 1
            }
            {
              echo "${prefix}_WORKER_SOURCE_SHA=$(jq -r '.[0]' <<<"$source_shas_json")"
              echo "${prefix}_WORKER_CREATED_AT=$(jq -r '.[0]' <<<"$created_ats_json")"
            } >> "$GITHUB_ENV"
          }
          if component_changed public; then resolve_candidate public lythaus-public-api-development PUBLIC; else reuse_production PUBLIC; fi
          if component_changed admin; then resolve_candidate admin lythaus-admin-api-development ADMIN; else reuse_production ADMIN; fi
          if component_changed jobs; then resolve_candidate jobs lythaus-jobs-development JOBS; else reuse_production JOBS; fi
          if component_changed coordinator; then resolve_candidate coordinator lythaus-auth-acceptance-coordinator-development COORDINATOR; else reuse_production COORDINATOR; fi
      - name: Stage candidate Worker versions at zero traffic (CANDIDATE gate; changed components only)
        if: inputs.acceptance_run_id == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e5b7ae46e04698f507b7e4b3d4ef1af0
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=CANDIDATE'
            echo 'RELEASE_FAILURE_CODE=candidate_staging_failed'
            echo 'RELEASE_FAILURE_MESSAGE=changed Worker candidate staging failed'
          } >> "$GITHUB_ENV"
          component_changed() {
            jq -e --arg component "$1" --argjson components "$CHANGED_COMPONENTS_JSON" '$components | index($component) != null' <<< '{}' >/dev/null
          }
          if component_changed public; then
            echo "PUBLIC_WORKER_STAGED=true" >> "$GITHUB_ENV"
            npx --yes wrangler@4.123.0 versions deploy $PUBLIC_ROLLBACK_SPECS "${PUBLIC_WORKER_VERSION_ID}@0" \
              --name lythaus-public-api-development --yes --message "Stage reviewed Lythaus public candidate at zero traffic"
          fi
          if component_changed admin; then
            echo "ADMIN_WORKER_STAGED=true" >> "$GITHUB_ENV"
            npx --yes wrangler@4.123.0 versions deploy $ADMIN_ROLLBACK_SPECS "${ADMIN_WORKER_VERSION_ID}@0" \
              --name lythaus-admin-api-development --yes --message "Stage reviewed Lythaus admin candidate at zero traffic"
          fi
          # Queue consumers do not accept a per-request Worker-version override.
          # The exact Jobs candidate must therefore be active before any real
          # email can produce lifecycle evidence; it has no public HTTP route.
          if component_changed jobs; then
            npx --yes wrangler@4.123.0 versions deploy "${JOBS_WORKER_VERSION_ID}@100" \
              --name lythaus-jobs-development --yes --message "Activate exact Jobs lifecycle consumer for changed candidate"
            echo "JOBS_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
          fi
          if component_changed coordinator; then
            npx --yes wrangler@4.123.0 versions deploy "${COORDINATOR_WORKER_VERSION_ID}@100" \
              --name lythaus-auth-acceptance-coordinator-development --yes --message "Activate protected exact-SHA acceptance coordinator candidate"
            echo "COORDINATOR_WORKER_DEPLOYED=true" >> "$GITHUB_ENV"
            echo "COORDINATOR_ROUTE_TRIGGER_ATTEMPTED=true" >> "$GITHUB_ENV"
            npx --yes wrangler@4.123.0 triggers deploy --config apps/lythaus-auth-acceptance-coordinator/wrangler.jsonc \
              --name lythaus-auth-acceptance-coordinator-development
          fi
          if component_changed public || component_changed coordinator || [[ "$RELEASE_CLASS" = AUTH_CRITICAL_RELEASE ]]; then
            candidate_staged_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo "ADR003_CANDIDATE_STAGED_AT=$candidate_staged_at" >> "$GITHUB_ENV"
          fi
      - name: Prove staged Public and Jobs transactional-email key compatibility (CANDIDATE gate)
        if: contains(steps.release_plan.outputs.changed_components_json, '"public"') || contains(steps.release_plan.outputs.changed_components_json, '"jobs"')
        env:
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          {
            echo 'RELEASE_FAILURE_GATE=CANDIDATE'
            echo 'RELEASE_FAILURE_CODE=jobs_transactional_email_compatibility_failed'
            echo 'RELEASE_FAILURE_MESSAGE=Public and Jobs transactional email compatibility proof failed'
          } >> "$GITHUB_ENV"
          base="${PRODUCTION_PUBLIC_API_BASE_URL%/}"
          response="$RUNNER_TEMP/production-cutover/transactional-email-key-compatibility.json"
          compatible=false
          for attempt in 1 2 3 4 5; do
            rm -f "$response"
            set +e
            http_status="$(curl --silent --show-error --max-time 30 \
              -H "authorization: Bearer ${DATABASE_READINESS_TOKEN}" \
              -H "Cloudflare-Workers-Version-Overrides: lythaus-public-api-development=\"${PUBLIC_WORKER_VERSION_ID}\", lythaus-jobs-development=\"${JOBS_WORKER_VERSION_ID}\"" \
              -H 'accept: application/json' \
              -X POST "$base/internal/readiness/transactional-email-key-compatibility" \
              --output "$response" \
              --write-out '%{http_code}')"
            curl_exit=$?
            set -e

            if [[ "$curl_exit" -eq 0 && "$http_status" == "200" ]]; then
              if jq -e --arg public "$PUBLIC_WORKER_VERSION_ID" --arg jobs "$JOBS_WORKER_VERSION_ID" --arg public_sha "$PUBLIC_WORKER_SOURCE_SHA" --arg jobs_sha "$JOBS_WORKER_SOURCE_SHA" '
                .status == "compatible"
                and .publicWorkerVersionId == $public
                and .jobsWorkerVersionId == $jobs
                and .publicReleaseTag == $public_sha
                and .jobsReleaseTag == $jobs_sha
              ' "$response" >/dev/null; then
                compatible=true
                break
              fi
              echo 'Transactional email compatibility returned malformed or mismatched success evidence; failing closed.' >&2
              exit 1
            fi

            if [[ "$http_status" == "400" || "$http_status" == "401" || "$http_status" == "403" || "$http_status" == "409" ]]; then
              echo "Transactional email compatibility rejected with HTTP ${http_status}; failing closed." >&2
              exit 1
            fi

            if [[ "$attempt" -lt 5 ]]; then
              echo "Transactional email compatibility probe attempt ${attempt} did not complete (curl=${curl_exit}, http=${http_status}); retrying." >&2
              sleep "$((attempt * 2))"
            fi
          done

          if [[ "$compatible" != true ]]; then
            echo 'Transactional email compatibility remained unavailable after bounded retries; failing closed.' >&2
            exit 1
          fi
      - name: Probe public candidate without production traffic (CANDIDATE gate)
        if: contains(steps.release_plan.outputs.changed_components_json, '"public"') || steps.release_plan.outputs.release_class == 'AUTH_CRITICAL_RELEASE'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0016_transactional_email_envelope_boundary.sql
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_TARGET: main
          EXPECTED_DATABASE_ROLE_CLASS: login_non_superuser
          REQUIRE_BUDGET_MIGRATION: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          AUTHENTICATED_ACCEPTANCE_PROVEN: 'false'
          PRODUCTION_WORKER_SCOPE: lythaus-public-api-development
          PRODUCTION_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_API_BASE_URL }}
          PRODUCTION_WORKER_EVIDENCE_PATH: ${{ runner.temp }}/production-cutover/public-candidate-probe.json
        run: |
