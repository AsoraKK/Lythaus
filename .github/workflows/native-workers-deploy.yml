          coordinator_secrets_file="$RUNNER_TEMP/production-cutover/coordinator-secrets.json"
          turnstile_secret_file="$RUNNER_TEMP/production-cutover/turnstile-secret.json"
          public_secret_inventory="$RUNNER_TEMP/production-cutover/public-secret-bindings.json"
