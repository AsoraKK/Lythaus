name: Deploy Lythaus marketing

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to build and deploy
        required: true
        type: string
      deployment_class:
        description: Pages deployment class
        required: true
        default: preview
        type: choice
        options: [preview, production]
  workflow_call:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to build and deploy
        required: true
        type: string
      deployment_class:
        description: Pages deployment class
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-marketing-${{ inputs.deployment_class }}
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PAGES_PROJECT: lythaus-marketing
      PAGES_BRANCH: ${{ inputs.deployment_class == 'production' && 'main' || 'preview' }}
      PUBLIC_API_BASE_URL: https://api.lythaus.co
      PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require exact approved SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYMENT_CLASS: ${{ inputs.deployment_class }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full 40-character commit SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ "$DEPLOYMENT_CLASS" = "production" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA" || {
              echo "Refusing production deployment: release_sha is not current origin/main." >&2
              exit 1
            }
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/marketing-site/package-lock.json

      - name: Resolve production Turnstile sitekey from Cloudflare
        if: inputs.deployment_class == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare/waitlist-turnstile.mjs resolve

      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Build and validate marketing artifact
        working-directory: apps/marketing-site
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_class }}" = "production" ]]; then
            node -e "const url = new URL(process.env.PUBLIC_API_BASE_URL); if (url.protocol !== 'https:' || url.hostname !== 'api.lythaus.co' || url.pathname !== '/') throw new Error('PUBLIC_API_BASE_URL must be https://api.lythaus.co');"
            node -e "if (!/^[A-Za-z0-9_-]{20,}$/.test(process.env.PUBLIC_TURNSTILE_SITE_KEY)) throw new Error('PUBLIC_TURNSTILE_SITE_KEY is invalid');"
          fi
          npm ci
          npm run build
          node ../../scripts/cloudflare/validate-marketing-output.mjs dist
          if rg -n -i 'TURNSTILE_SECRET|PII_ENCRYPTION_KEY|PII_HMAC_KEY' dist; then
            echo 'Sensitive binding name leaked into the marketing artifact.' >&2
            exit 1
          fi
          if [[ "${{ inputs.deployment_class }}" = "production" ]]; then
            rg -F 'challenges.cloudflare.com/turnstile/v0/api.js' dist/index.html
            rg -F 'waitlist_signup' dist/index.html
          fi

      - name: Deploy exact marketing artifact
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.123.0 pages deploy apps/marketing-site/dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false | tee wrangler-output.txt
          preview_url="$(grep -Eo 'https://[a-z0-9-]+\.lythaus-marketing\.pages\.dev' wrangler-output.txt | head -n 1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Validate deployed public surface
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          mkdir -p preview-pages
          routes=(/ /about /ai-moderation /contact /features /guidelines /invite /pricing /privacy /terms)
          for route in "${routes[@]}"; do
            if [[ "$route" = "/" ]]; then
              name="_root"
            else
              name="${route//\//_}"
            fi
            response="$(curl --location --silent --show-error --max-time 20 --output "preview-pages/${name}.html" --write-out '%{http_code}|%{url_effective}' "${PREVIEW_URL}${route}")"
            status="${response%%|*}"
            effective_url="${response#*|}"
            test "$status" = 200 || { echo "Unexpected status $status for $route"; exit 1; }
            [[ "$effective_url" == "${PREVIEW_URL}"* && "$effective_url" != *'#'* ]] || { echo "Unexpected final route $effective_url for $route"; exit 1; }
          done
          curl --silent --show-error --max-time 20 --output sitemap.xml --write-out '%{http_code}' "${PREVIEW_URL}/sitemap.xml" | grep -qx 200
          curl --silent --show-error --max-time 20 --output robots.txt --write-out '%{http_code}' "${PREVIEW_URL}/robots.txt" | grep -qx 200
          retired_brand='as''ora'
          retired_cloud_host='az''ure''websites'
          if rg -in "(${retired_brand}\\.co\\.za|${retired_cloud_host}\\.net|lythaus-marketing\\.pages\\.dev)" preview-pages; then
            echo 'Forbidden public hostname found in marketing preview output.'
            exit 1
          fi
          rg -Fqx 'Sitemap: https://lythaus.co/sitemap.xml' robots.txt
          rg -F '<loc>https://lythaus.co/' sitemap.xml
          curl --silent --show-error --max-time 20 --dump-header headers.txt --output /dev/null "${PREVIEW_URL}/"
          for header in \
            'X-Content-Type-Options: nosniff' \
            'Referrer-Policy: strict-origin-when-cross-origin' \
            'X-Frame-Options: DENY' \
            'Strict-Transport-Security: max-age=300' \
            'Content-Security-Policy:'; do
            rg -F -i "$header" headers.txt
          done
          if [[ "${{ inputs.deployment_class }}" = "production" ]]; then
            rg -F 'challenges.cloudflare.com/turnstile/v0/api.js' preview-pages/_root.html
            rg -F 'waitlist_signup' preview-pages/_root.html
          fi

      - name: Validate production custom domains
        if: inputs.deployment_class == 'production'
        run: |
          set -euo pipefail
          for host in https://lythaus.co https://www.lythaus.co; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --location --silent --show-error --max-time 30 --retry 6 --retry-delay 3 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$host/")"
            test "$status" = 200
            rg -F 'The human internet is worth protecting.' "$body"
            rg -F -i 'X-Content-Type-Options: nosniff' "$headers"
            rg -F -i 'X-Frame-Options: DENY' "$headers"
            rm -f "$headers" "$body"
          done

      - name: Write sanitized deployment evidence
        if: success()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg project "$PAGES_PROJECT" \
            --arg branch "$PAGES_BRANCH" \
            --arg previewUrl "$PREVIEW_URL" \
            --arg deploymentClass "${{ inputs.deployment_class }}" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, commitSha: $commitSha, project: $project, branch: $branch, previewUrl: $previewUrl, deploymentClass: $deploymentClass, routeCount: 10, createdAt: $createdAt}' \
            > marketing-deployment-evidence.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: marketing-deployment-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: marketing-deployment-evidence.json
