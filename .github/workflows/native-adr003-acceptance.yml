name: Native ADR-003 authenticated acceptance

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production public API base URL
        required: true
        default: https://api.lythaus.co/api
        type: string
      release_sha:
        description: Exact candidate commit SHA already staged at zero traffic
        required: true
        type: string
      worker_version_id:
        description: Exact public candidate Worker version ID already staged at zero traffic
        required: true
        type: string
      acceptance_run_id:
        description: UUID assigned to the candidate acceptance attempt
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Hyperdrive origins and PlanetScale main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: lythaus
          PLANETSCALE_DATABASE: lythaus-core
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_DEVELOPMENT_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
        run: npm run validate:cloudflare-hyperdrive-targets
      - name: Verify post-0016 schema read-only
        env:
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
          REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
        run: node scripts/ci/verify-planetscale-production-schema.mjs
      - name: Mark external routing proof for the harness
        run: echo "HYPERDRIVE_VERIFIED_MAIN=true" >> "$GITHUB_ENV"
      - name: Collect generated candidate auth acceptance evidence
        id: auth_acceptance_observation
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_API_BASE_URL: ${{ inputs.api_base_url }}
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_SOURCE: protected_probe
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_URL: https://admin.lythaus.co/api/admin/production-auth-acceptance/observer
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/adr003-auth-acceptance-observation.json
          ADR003_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/ci/collect-auth-acceptance-evidence.mjs
      - name: Run sanitized ADR-003 acceptance
        env:
          ADR003_API_BASE_URL: ${{ inputs.api_base_url }}
          ADR003_WEB_HEALTH_URL: ${{ vars.ADR003_WEB_HEALTH_URL }}
          ADR003_WEB_ORIGIN: ${{ vars.ADR003_WEB_ORIGIN }}
          ADR003_EVIDENCE_PATH: ${{ runner.temp }}/adr003-acceptance.json
          ADR003_WORKER_VERSIONS_JSON: ${{ vars.ADR003_WORKER_VERSIONS_JSON }}
          ADR003_HYPERDRIVE_IDS_JSON: ${{ vars.ADR003_HYPERDRIVE_IDS_JSON }}
          ADR003_GUEST_ACCEPTED: ${{ vars.ADR003_GUEST_ACCEPTED }}
          ADR003_AUTH_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/adr003-auth-acceptance-observation.json
          ADR003_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ADR003_WORKER_NAME: lythaus-public-api-development
          ADR003_WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ADR003_MOBILE_EMAIL_ACCEPTED: ${{ vars.ADR003_MOBILE_EMAIL_ACCEPTED }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
          EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
          EXPECTED_DATABASE_SCHEMA_VERSION: 0016_transactional_email_envelope_boundary.sql
          EXPECTED_DATABASE_BUDGET_LEDGER_APPLIED: 'true'
          HYPERDRIVE_VERIFIED_MAIN: 'true'
          ADR003_TEST_EMAIL: ${{ secrets.CODEX_TEST_EMAIL }}
          ADR003_TEST_PASSWORD: ${{ secrets.CODEX_TEST_PASSWORD }}
        run: npm run acceptance:adr003
      - name: Require generated candidate auth acceptance
        if: always()
        env:
          OBSERVER_OUTCOME: ${{ steps.auth_acceptance_observation.outcome }}
        run: |
          set -euo pipefail
          test "$OBSERVER_OUTCOME" = success || {
            status="$(jq -r '.status // "BLOCKED"' "$RUNNER_TEMP/adr003-auth-acceptance-observation.json" 2>/dev/null || echo BLOCKED)"
            if [[ "$status" = HUMAN_ACCEPTANCE_REQUIRED ]]; then
              echo 'HUMAN_ACCEPTANCE_REQUIRED: complete the real Turnstile and mailbox interaction, then rerun the observer.' >&2
            elif [[ "$status" = BLOCKED ]] && jq -e '.reason == "provider_configuration_missing"' "$RUNNER_TEMP/adr003-auth-acceptance-observation.json" >/dev/null 2>&1; then
              echo 'Provider configuration failure: the enabled mail.lythaus.co Cloudflare Email Sending queue subscription was not independently observed for the required lifecycle events.' >&2
            else
              echo "Candidate auth acceptance is not independently proven: $status" >&2
            fi
            exit 1
          }
          jq -e '.status == "PASSED"' "$RUNNER_TEMP/adr003-auth-acceptance-observation.json" >/dev/null
          jq -e '
            .status == "PASSED" and
            .lifecycleSubscription.source == "cloudflare_email_sending_queue_subscription_observation" and
            .lifecycleSubscription.domain == "mail.lythaus.co" and
            .lifecycleSubscription.status == "enabled" and
            ((.lifecycleSubscription.events | sort) == ["bounced", "complained", "deferred", "delivered", "failed", "rejected"])
          ' "$RUNNER_TEMP/adr003-auth-acceptance-observation.json" >/dev/null
      - name: Upload sanitized ADR-003 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adr003-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/adr003-acceptance.json
          if-no-files-found: ignore
