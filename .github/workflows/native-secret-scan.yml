name: Native secret scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
      - name: Write exact-SHA security evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/security-run-evidence
          printf '{"workflow":"Native secret scan","headSha":"%s","conclusion":"success"}\n' "$GITHUB_SHA" > .artifacts/security-run-evidence/run.json
      - name: Upload exact-SHA security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-run-evidence-Native-secret-scan-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/security-run-evidence/run.json
