name: Native PlanetScale PostgreSQL 17 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/planetscale/**'
      - 'scripts/ci/validate-planetscale-postgres17.mjs'
      - 'scripts/ci/planetscale-migration-reconciliation.mjs'
      - 'scripts/ci/verify-planetscale-local-postconditions.mjs'
      - '.github/workflows/native-planetscale-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate repository contracts
        run: |
          npm ci --ignore-scripts
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
      - name: Apply and verify complete PostgreSQL 17 baseline
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run validate:planetscale-postgres17
      - name: Verify canonical migration postconditions on PostgreSQL 17
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node scripts/ci/verify-planetscale-local-postconditions.mjs
