name: Native PlanetScale PostgreSQL 17 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/planetscale/**'
      - 'apps/lythaus-public-api/src/auth*.ts'
      - 'apps/lythaus-public-api/src/index.ts'
      - 'apps/lythaus-public-api/src/passkey-runtime.ts'
      - 'apps/lythaus-public-api/tests/passkey-test-support.mjs'
      - 'lib/features/auth/application/auth_providers.dart'
      - 'lib/features/auth/application/auth_service.dart'
      - 'lib/features/auth/application/passkey_*.dart'
      - 'lib/features/auth/presentation/auth_choice_screen.dart'
      - 'lib/features/auth/presentation/passkeys_screen.dart'
      - 'lib/ui/screens/profile/account_security_screen.dart'
      - 'scripts/build-passkey-web-client.mjs'
      - 'scripts/cf-pages-build.sh'
      - 'scripts/tests/flutter-passkeys.browser.mjs'
      - 'scripts/tests/local-auth-browser-server.mjs'
      - 'test/features/auth/application/passkey_service_test.dart'
      - 'test/features/auth/presentation/auth_choice_screen_test.dart'
      - 'web/index.html'
      - 'packages/security/src/passkeys.ts'
      - 'packages/security/tests/passkey-fixtures.mjs'
      - 'packages/db/src/passkeys.ts'
      - 'packages/db/src/passkey-privacy.ts'
      - 'apps/lythaus-jobs/src/index.ts'
      - 'apps/lythaus-jobs/src/runtime-policy.ts'
      - 'apps/lythaus-public-api/src/account-support-entrypoint.ts'
      - 'apps/lythaus-public-api/src/email-envelope-entrypoint.ts'
      - 'apps/lythaus-public-api/src/worker.ts'
      - 'packages/contracts/src/account-support.ts'
      - 'apps/lythaus-admin-api/src/account-support-runtime.ts'
      - 'apps/lythaus-admin-api/src/overview-*.ts'
      - 'apps/lythaus-public-api/tests/*.postgres.mjs'
      - 'apps/lythaus-auth-acceptance-coordinator/src/**'
      - 'apps/lythaus-auth-acceptance-coordinator/tests/**'
      - 'apps/lythaus-admin-api/src/auth-email-dispatch-adapter.ts'
      - 'apps/lythaus-admin-api/src/keeper-runtime.ts'
      - 'apps/lythaus-admin-api/tests/*.postgres.mjs'
      - 'apps/lythaus-jobs/src/transactional-email-runtime.ts'
      - 'scripts/ci/validate-planetscale-postgres17.mjs'
      - 'scripts/ci/validate-first-admin-bootstrap-postgres17.mjs'
      - 'scripts/ci/validate-authenticity-beta-postgres17.mjs'
      - 'scripts/ci/validate-authenticity-alpha-postgres17.mjs'
      - 'apps/lythaus-*/src/authenticity-beta.ts'
      - 'apps/lythaus-*/src/authenticity-alpha.ts'
      - 'packages/authenticity/src/beta*.ts'
      - 'packages/db/src/authenticity-beta.ts'
      - 'packages/db/src/authenticity-alpha.ts'
      - 'packages/db/src/budget.ts'
      - 'packages/contracts/src/monthly-*.ts'
      - 'packages/contracts/policies/Lythaus_Monthly_Rewards_Action_Catalogue_v2.json'
      - 'packages/db/src/monthly-reputation.ts'
      - 'packages/db/src/monthly-reputation-report.ts'
      - 'packages/db/src/monthly-earning.ts'
      - 'packages/db/src/monthly-context*.ts'
      - 'packages/db/src/monthly-publication.ts'
      - 'packages/db/src/monthly-reward-*.ts'
      - 'packages/db/src/community-appeal-*.ts'
      - 'apps/lythaus-jobs/src/monthly-reputation.ts'
      - 'apps/lythaus-jobs/src/monthly-earning.ts'
      - 'apps/lythaus-jobs/src/monthly-reward-*.ts'
      - 'apps/lythaus-jobs/src/community-appeals.ts'
      - 'apps/lythaus-jobs/src/index.ts'
      - 'apps/lythaus-jobs/tests/monthly-reputation.postgres.mjs'
      - 'apps/lythaus-jobs/tests/monthly-earning.postgres.mjs'
      - 'apps/lythaus-jobs/tests/monthly-context.postgres.mjs'
      - 'apps/lythaus-jobs/tests/monthly-reward-*.postgres.mjs'
      - 'apps/lythaus-jobs/tests/monthly-reward-*.cases.mjs'
      - 'apps/lythaus-jobs/tests/monthly-reputation-report.cases.mjs'
      - 'apps/lythaus-public-api/src/monthly-reputation-report-export.ts'
      - 'scripts/ci/planetscale-migration-*.mjs'
      - 'scripts/ci/auth-incident-database-contract.mjs'
      - 'scripts/ci/audit-production-auth-incident.mjs'
      - 'scripts/ci/reconcile-planetscale-schema-verifier.mjs'
      - 'scripts/tests/auth-incident-grants.postgres.mjs'
      - 'scripts/ci/validate-authenticity-beta-postgres17.mjs'
      - '.github/workflows/native-planetscale-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Validate repository contracts
        run: |
          npm ci --ignore-scripts
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
      - name: Apply and verify complete PostgreSQL 17 baseline
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run validate:planetscale-postgres17
      - name: Prove first-admin bootstrap rollback, concurrency and closure
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node scripts/ci/validate-first-admin-bootstrap-postgres17.mjs
      - name: Validate proposed monthly reputation shadow schema and transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-reputation.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-reputation.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-reputation.postgres.mjs
      - name: Validate real monthly earning source transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-earning.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-earning.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-earning.postgres.mjs
      - name: Validate scoped contextual acceptance and dependent corrections
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-context*.ts'
          '--test-coverage-include=apps/lythaus-admin-api/src/monthly-context-review.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-context.postgres.mjs
      - name: Validate private community appeal transactions and routes
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/community-appeal-*.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/community-appeals.ts'
          '--test-coverage-include=packages/db/src/monthly-peer-participation.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-peer-participation.ts'
          '--test-coverage-include=packages/db/src/monthly-publication.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-public-api/tests/community-appeals.postgres.mjs
      - name: Validate canonical maintenance and monthly assembly transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-maintenance.ts'
          '--test-coverage-include=packages/db/src/monthly-email-renewal.ts'
          '--test-coverage-include=packages/db/src/monthly-assembly.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-assembly.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-assembly.postgres.mjs
      - name: Validate separately gated fixed monthly snapshots and corrections
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-reward-snapshots.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-reward-snapshots.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-reward-snapshots.postgres.mjs
      - name: Validate reward selections, partner links and claims
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-reward-selections.ts'
          '--test-coverage-include=packages/db/src/monthly-reward-partner-links.ts'
          '--test-coverage-include=packages/db/src/monthly-reward-claims.ts'
          '--test-coverage-include=packages/db/src/monthly-reputation-report.ts'
          '--test-coverage-include=apps/lythaus-public-api/src/monthly-reputation-report-export.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-reward-selections.postgres.mjs
      - name: Prove column-only incident audit grants on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --test scripts/tests/auth-incident-grants.postgres.mjs
      - name: Prepare isolated passkey proposal fixture
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lythaus_auth_test_passkeys_ci?sslmode=disable
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lythaus_auth_test_passkeys_ci'
          npm run validate:planetscale-postgres17
          psql "$PLANETSCALE_PG17_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f database/planetscale/proposals/optional-passkeys.sql
      - name: Prove authentication, passkey and email races on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PASSKEY_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lythaus_auth_test_passkeys_ci?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks --test --test-concurrency=1 apps/lythaus-public-api/tests/*.postgres.mjs apps/lythaus-admin-api/tests/*.postgres.mjs
      - name: Build release PWA for the synthetic passkey browser journey
        env:
          ENVIRONMENT: production
          API_BASE_URL: https://api.lythaus.co/api
          AUTH_URL: https://api.lythaus.co/api
        run: bash scripts/cf-pages-build.sh
      - name: Install Chromium for the virtual WebAuthn authenticator
        run: npx playwright install --with-deps chromium
      - name: Verify PWA passkey recovery with a virtual authenticator
        env:
          PASSKEY_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lythaus_auth_test_passkeys_ci?sslmode=disable
          AUTH_QA_DIR: ${{ runner.temp }}/lythaus-passkey-qa
        run: node --experimental-strip-types --test --test-concurrency=1 --test-timeout=600000 scripts/tests/flutter-passkeys.browser.mjs
      - name: Upload virtual-authenticator browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: flutter-passkeys-browser-evidence
          path: ${{ runner.temp }}/lythaus-passkey-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce executable coordinator coverage on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=**/lythaus-auth-acceptance-coordinator/src/index.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test --test-name-pattern='real coordinator' --test-timeout=180000
          apps/lythaus-public-api/tests/auth-journey.postgres.mjs
      - name: Exercise private beta handlers against PostgreSQL 17
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks scripts/ci/validate-authenticity-beta-postgres17.mjs
      - name: Exercise private alpha handlers against PostgreSQL 17
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks scripts/ci/validate-authenticity-alpha-postgres17.mjs
