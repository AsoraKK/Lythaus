name: Native PlanetScale PostgreSQL 17 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/planetscale/**'
      - 'apps/lythaus-public-api/src/auth*.ts'
      - 'apps/lythaus-public-api/src/index.ts'
      - 'apps/lythaus-public-api/src/account-support-entrypoint.ts'
      - 'apps/lythaus-public-api/src/email-envelope-entrypoint.ts'
      - 'apps/lythaus-public-api/src/worker.ts'
      - 'packages/contracts/src/account-support.ts'
      - 'apps/lythaus-admin-api/src/account-support-runtime.ts'
      - 'apps/lythaus-admin-api/src/overview-*.ts'
      - 'apps/lythaus-public-api/tests/*.postgres.mjs'
      - 'apps/lythaus-auth-acceptance-coordinator/src/**'
      - 'apps/lythaus-auth-acceptance-coordinator/tests/**'
      - 'apps/lythaus-admin-api/src/auth-email-dispatch-adapter.ts'
      - 'apps/lythaus-admin-api/src/keeper-runtime.ts'
      - 'apps/lythaus-admin-api/tests/*.postgres.mjs'
      - 'apps/lythaus-jobs/src/transactional-email-runtime.ts'
      - 'scripts/ci/validate-planetscale-postgres17.mjs'
      - 'scripts/ci/validate-first-admin-bootstrap-postgres17.mjs'
      - 'scripts/ci/validate-authenticity-beta-postgres17.mjs'
      - 'scripts/ci/validate-authenticity-alpha-postgres17.mjs'
      - 'apps/lythaus-*/src/authenticity-beta.ts'
      - 'apps/lythaus-*/src/authenticity-alpha.ts'
      - 'packages/authenticity/src/beta*.ts'
      - 'packages/db/src/authenticity-beta.ts'
      - 'packages/db/src/authenticity-alpha.ts'
      - 'packages/db/src/budget.ts'
      - 'packages/contracts/src/monthly-*.ts'
      - 'packages/contracts/policies/Lythaus_Monthly_Rewards_Action_Catalogue_v2.json'
      - 'packages/db/src/monthly-reputation.ts'
      - 'packages/db/src/monthly-earning.ts'
      - 'packages/db/src/community-appeal-*.ts'
      - 'apps/lythaus-jobs/src/monthly-reputation.ts'
      - 'apps/lythaus-jobs/src/monthly-earning.ts'
      - 'apps/lythaus-jobs/src/community-appeals.ts'
      - 'apps/lythaus-jobs/src/index.ts'
      - 'apps/lythaus-jobs/tests/monthly-reputation.postgres.mjs'
      - 'apps/lythaus-jobs/tests/monthly-earning.postgres.mjs'
      - 'scripts/ci/planetscale-migration-*.mjs'
      - 'scripts/ci/auth-incident-database-contract.mjs'
      - 'scripts/ci/audit-production-auth-incident.mjs'
      - 'scripts/ci/reconcile-planetscale-schema-verifier.mjs'
      - 'scripts/tests/auth-incident-grants.postgres.mjs'
      - 'scripts/ci/validate-authenticity-beta-postgres17.mjs'
      - '.github/workflows/native-planetscale-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Validate repository contracts
        run: |
          npm ci --ignore-scripts
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
      - name: Apply and verify complete PostgreSQL 17 baseline
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run validate:planetscale-postgres17
      - name: Prove first-admin bootstrap rollback, concurrency and closure
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node scripts/ci/validate-first-admin-bootstrap-postgres17.mjs
      - name: Validate proposed monthly reputation shadow schema and transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-reputation.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-reputation.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-reputation.postgres.mjs
      - name: Validate real monthly earning source transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-earning.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-earning.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-earning.postgres.mjs
      - name: Validate private community appeal transactions and routes
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/community-appeal-*.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/community-appeals.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-public-api/tests/community-appeals.postgres.mjs
      - name: Validate canonical maintenance and monthly assembly transactions
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=packages/db/src/monthly-maintenance.ts'
          '--test-coverage-include=packages/db/src/monthly-assembly.ts'
          '--test-coverage-include=apps/lythaus-jobs/src/monthly-assembly.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test apps/lythaus-jobs/tests/monthly-assembly.postgres.mjs
      - name: Prove column-only incident audit grants on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --test scripts/tests/auth-incident-grants.postgres.mjs
      - name: Prove authentication and email races on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks --test --test-concurrency=1 apps/lythaus-public-api/tests/*.postgres.mjs apps/lythaus-admin-api/tests/*.postgres.mjs
      - name: Enforce executable coordinator coverage on real PostgreSQL
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-test-coverage
          '--test-coverage-include=**/lythaus-auth-acceptance-coordinator/src/index.ts'
          --test-coverage-lines=80 --test-coverage-branches=80
          --test --test-name-pattern='real coordinator' --test-timeout=180000
          apps/lythaus-public-api/tests/auth-journey.postgres.mjs
      - name: Exercise private beta handlers against PostgreSQL 17
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks scripts/ci/validate-authenticity-beta-postgres17.mjs
      - name: Exercise private alpha handlers against PostgreSQL 17
        env:
          PLANETSCALE_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: node --experimental-strip-types --experimental-test-module-mocks scripts/ci/validate-authenticity-alpha-postgres17.mjs
