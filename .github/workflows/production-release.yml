name: Canonical production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed 40-character main SHA
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for the exact release SHA
        required: true
        type: string
      historical_reconciliation_run_id:
        description: Successful historical branch reconciliation run ID for the exact release SHA
        required: true
        type: string
      confirm_production:
        description: Confirm the four-surface production deployment
        required: true
        default: false
        type: boolean
      web_base_url:
        description: Authenticated Flutter web smoke origin
        required: true
        type: string
      api_base_url:
        description: Canonical API origin used by web smoke
        required: true
        type: string
      admin_api_url:
        description: Protected admin API origin used by web smoke
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-canonical-production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Canonical release preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      admin_pages_project: ${{ steps.canonical_config.outputs.admin_pages_project }}
      web_pages_branch: ${{ steps.canonical_config.outputs.web_pages_branch }}
      branch_protection_verified: ${{ steps.governance.outputs.branch_protection_verified }}
      historical_branches_reconciled: ${{ steps.governance.outputs.historical_branches_reconciled }}
      security_checks_verified: ${{ steps.governance.outputs.security_checks_verified }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      HISTORICAL_RECONCILIATION_RUN_ID: ${{ inputs.historical_reconciliation_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require explicit production confirmation
        run: test "${{ inputs.confirm_production }}" = true
      - name: Resolve canonical Pages configuration from protected production variables
        id: canonical_config
        env:
          ADMIN_PAGES_PROJECT: ${{ vars.LYTHAUS_ADMIN_PAGES_PROJECT }}
          WEB_PAGES_BRANCH: ${{ vars.LYTHAUS_WEB_PAGES_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ADMIN_PAGES_PROJECT" =~ ^lythaus-[A-Za-z0-9-]+$ ]] || {
            echo 'LYTHAUS_ADMIN_PAGES_PROJECT is missing or not an approved Lythaus Pages project.' >&2
            exit 1
          }
          [[ "$WEB_PAGES_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo 'LYTHAUS_WEB_PAGES_BRANCH is missing or invalid; provider confirmation is required.' >&2
            exit 1
          }
          echo "admin_pages_project=$ADMIN_PAGES_PROJECT" >> "$GITHUB_OUTPUT"
          echo "web_pages_branch=$WEB_PAGES_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Require current reviewed main and successful CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full 40-character commit SHA' >&2; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'ci_run_id must be numeric' >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          test "$(jq -r '.name' <<<"$run_json")" = 'CI'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$RELEASE_SHA"
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
      - name: Verify protected governance and historical reconciliation evidence
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HISTORICAL_RECONCILIATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'historical_reconciliation_run_id must be numeric' >&2; exit 1; }
          protection="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection")"
          jq -e '
            .required_status_checks != null
            and ((.required_status_checks.contexts | length) > 0)
            and .required_pull_request_reviews != null
            and (.required_pull_request_reviews.required_approving_review_count >= 1)
            and (.enforce_admins.enabled == true)
            and (.required_linear_history.enabled == true)
            and (.allow_force_pushes.enabled == false)
            and (.allow_deletions.enabled == false)
            and (.required_conversation_resolution.enabled == true)
          ' <<<"$protection" >/dev/null
          historical="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HISTORICAL_RECONCILIATION_RUN_ID}")"
          test "$(jq -r '.name' <<<"$historical")" = 'Historical branch reconciliation'
          test "$(jq -r '.head_sha' <<<"$historical")" = "$RELEASE_SHA"
          test "$(jq -r '.conclusion' <<<"$historical")" = 'success'
          historical_dir="$RUNNER_TEMP/historical-reconciliation"
          mkdir -p "$historical_dir"
          gh run download "$HISTORICAL_RECONCILIATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "historical-branch-reconciliation-${RELEASE_SHA}" \
            --dir "$historical_dir"
          jq -e '
            .mainSha == env.RELEASE_SHA
            and .summary.total == 85
            and .summary.uniqueWorkReview == 0
            and .summary.objectUnavailable == 0
          ' "$historical_dir/report.json" >/dev/null
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
          for check in 'CodeQL JavaScript TypeScript' 'dependency-review' 'scan'; do
            jq -e --arg name "$check" 'any(.check_runs[]; .name == $name and .conclusion == "success")' <<<"$checks" >/dev/null
          done
          {
            echo 'branch_protection_verified=true'
            echo 'historical_branches_reconciled=true'
            echo 'security_checks_verified=true'
          } >> "$GITHUB_OUTPUT"
      - name: Validate release manifest contract
        run: node scripts/ci/build-release-manifest.mjs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
      - name: Upload preflight manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: canonical-release-preflight-${{ inputs.release_sha }}
          if-no-files-found: error
          path: .artifacts/release/release-manifest.json

  provider_evidence:
    name: Capture exact-SHA provider evidence
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      cloudflare_status: ${{ steps.summary.outputs.cloudflare_status }}
      cloudflare_legacy_asora_active_resources: ${{ steps.summary.outputs.cloudflare_legacy_asora_active_resources }}
      cloudflare_pages_inventory_verified: ${{ steps.summary.outputs.cloudflare_pages_inventory_verified }}
      planetscale_status: ${{ steps.summary.outputs.planetscale_status }}
      planetscale_schema_fingerprint: ${{ steps.summary.outputs.planetscale_schema_fingerprint }}
      planetscale_relation_count: ${{ steps.summary.outputs.planetscale_relation_count }}
      planetscale_server_version: ${{ steps.summary.outputs.planetscale_server_version }}
      planetscale_migration_set_sha256: ${{ steps.summary.outputs.planetscale_migration_set_sha256 }}
      planetscale_grants_verified: ${{ steps.summary.outputs.planetscale_grants_verified }}
      evidence_run_url: ${{ steps.summary.outputs.evidence_run_url }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
      CLOUDFLARE_WORKERS_BUILDS_REQUIRED: 'false'
      CLOUDFLARE_AUDIT_OUTPUT: .artifacts/release-provider-evidence/cloudflare.json
      PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
      PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
      EXPECTED_DATABASE_SCHEMA_FINGERPRINT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_SCHEMA_FINGERPRINT }}
      EXPECTED_DATABASE_RELATION_COUNT: ${{ vars.PRODUCT_INTEGRITY_DATABASE_RELATION_COUNT }}
      PSCALE_BRANCH_NAME: main
      REQUIRE_PRODUCT_INTEGRITY_MIGRATION: 'true'
      PLANETSCALE_CONTRACT_AUDIT_OUTPUT: .artifacts/release-provider-evidence/planetscale-production-contract.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture Cloudflare inventory
        id: cloudflare_audit
        continue-on-error: true
        run: node scripts/cloudflare/audit-account.mjs
      - name: Capture PlanetScale production contract
        id: planetscale_audit
        continue-on-error: true
        run: node scripts/planetscale/audit-production-contract.mjs
      - name: Summarize exact-SHA provider evidence
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cf_status='UNKNOWN/BLOCKED'
          legacy_asora_count=''
          pages_inventory_verified='false'
          ps_status='UNKNOWN/BLOCKED'
          if [[ -f .artifacts/release-provider-evidence/cloudflare.json ]] \
            && jq -e '.complete == true and (.requiredLythausFailures | length) == 0 and .adminWorkerSettings.state.ok == true' .artifacts/release-provider-evidence/cloudflare.json >/dev/null; then
            cf_status='VERIFIED'
          fi
          if [[ -f .artifacts/release-provider-evidence/cloudflare.json ]]; then
            legacy_asora_count="$(jq -r '.legacyNamedResources | length' .artifacts/release-provider-evidence/cloudflare.json)"
            if jq -e '[.resources.pages[] | select(.classification != "EXTERNAL / OUT OF SCOPE")] | all(.[]; .name != null)' .artifacts/release-provider-evidence/cloudflare.json >/dev/null; then
              pages_inventory_verified='true'
            fi
          fi
          if [[ -f .artifacts/release-provider-evidence/planetscale-production-contract.json ]] \
            && jq -e '.transactionReadOnly == true and .verifierPassed == true and .post0013Required == true' .artifacts/release-provider-evidence/planetscale-production-contract.json >/dev/null; then
            ps_status='VERIFIED'
          fi
          contract='.artifacts/release-provider-evidence/planetscale-production-contract.json'
          schema_fingerprint=''
          relation_count=''
          server_version=''
          migration_set=''
          grants_verified='false'
          if [[ -f "$contract" ]]; then
            server_version="$(jq -r '.postgresVersion // empty' "$contract")"
            grants_verified="$(jq -r 'if .verifierPassed == true then "true" else "false" end' "$contract")"
            schema_fingerprint="$(jq -r '.verifierOutput[]? | select(startswith("Observed post-0013 schema fingerprint:")) | sub("^Observed post-0013 schema fingerprint: "; "")' "$contract" | head -n 1)"
            relation_count="$(jq -r '.verifierOutput[]? | select(startswith("Observed post-0013 relation count:")) | sub("^Observed post-0013 relation count: "; "")' "$contract" | head -n 1)"
            migration_set="$(jq -r '.verifierOutput[]? | select(startswith("Approved migration-set SHA-256:")) | sub("^Approved migration-set SHA-256: "; "")' "$contract" | head -n 1)"
          fi
          {
            echo "cloudflare_status=$cf_status"
            echo "cloudflare_legacy_asora_active_resources=${legacy_asora_count:-0}"
            echo "cloudflare_pages_inventory_verified=$pages_inventory_verified"
            echo "planetscale_status=$ps_status"
            echo "planetscale_schema_fingerprint=$schema_fingerprint"
            echo "planetscale_relation_count=$relation_count"
            echo "planetscale_server_version=$server_version"
            echo "planetscale_migration_set_sha256=$migration_set"
            echo "planetscale_grants_verified=$grants_verified"
            echo "evidence_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"
      - name: Require provider evidence before deployment
        env:
          CLOUDFLARE_STATUS: ${{ steps.summary.outputs.cloudflare_status }}
          PLANETSCALE_STATUS: ${{ steps.summary.outputs.planetscale_status }}
        run: |
          test "$CLOUDFLARE_STATUS" = VERIFIED
          test "$PLANETSCALE_STATUS" = VERIFIED
      - name: Upload exact-SHA provider evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: canonical-provider-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: .artifacts/release-provider-evidence

  marketing:
    name: Deploy marketing
    needs: [preflight, provider_evidence]
    if: needs.provider_evidence.outputs.cloudflare_status == 'VERIFIED' && needs.provider_evidence.outputs.planetscale_status == 'VERIFIED'
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      deployment_class: production
    secrets: inherit

  web:
    name: Deploy Flutter web
    needs: [preflight, provider_evidence]
    if: needs.provider_evidence.outputs.cloudflare_status == 'VERIFIED' && needs.provider_evidence.outputs.planetscale_status == 'VERIFIED'
    uses: ./.github/workflows/deploy-alpha-web.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      target_environment: mvp
      pages_project: lythaus-web
      pages_branch: ${{ needs.preflight.outputs.web_pages_branch }}
      web_base_url: ${{ inputs.web_base_url }}
      api_base_url: ${{ inputs.api_base_url }}
      admin_api_url: ${{ inputs.admin_api_url }}
    secrets: inherit

  admin:
    name: Deploy control panel
    needs: [preflight, provider_evidence]
    if: needs.provider_evidence.outputs.cloudflare_status == 'VERIFIED' && needs.provider_evidence.outputs.planetscale_status == 'VERIFIED'
    uses: ./.github/workflows/deploy-control-panel.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      pages_project: ${{ needs.preflight.outputs.admin_pages_project }}
    secrets: inherit

  workers:
    name: Deploy Workers and jobs
    needs: [preflight, provider_evidence]
    if: needs.provider_evidence.outputs.cloudflare_status == 'VERIFIED' && needs.provider_evidence.outputs.planetscale_status == 'VERIFIED'
    uses: ./.github/workflows/native-workers-deploy.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  production_smoke:
    name: Verify canonical production surfaces
    needs: [preflight, provider_evidence, marketing, web, admin, workers]
    if: always()
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    outputs:
      marketing: ${{ steps.smoke.outputs.marketing }}
      www: ${{ steps.smoke.outputs.www }}
      admin_ui: ${{ steps.smoke.outputs.admin_ui }}
      public_api: ${{ steps.smoke.outputs.public_api }}
      admin_api: ${{ steps.smoke.outputs.admin_api }}
      flutter_web: ${{ steps.smoke.outputs.flutter_web }}
      jobs: ${{ steps.smoke.outputs.jobs }}
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      WEB_BASE_URL: ${{ inputs.web_base_url }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      ADMIN_API_URL: ${{ inputs.admin_api_url }}
      DEPLOYMENTS_OK: ${{ needs.marketing.result == 'success' && needs.web.result == 'success' && needs.admin.result == 'success' && needs.workers.result == 'success' }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Verify exact-SHA production smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYMENTS_OK" = true
          test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          tmpdir="$RUNNER_TEMP/lythaus-production-smoke"
          mkdir -p "$tmpdir"
          check_public_site() {
            local host="$1"; local output="$tmpdir/${2}.html"; local headers="$tmpdir/${2}.headers"
            local status
            status="$(curl --location --silent --show-error --max-time 30 --retry 4 --retry-delay 2 --dump-header "$headers" --output "$output" --write-out '%{http_code}' "https://${host}/")"
            test "$status" = 200
            rg -F 'The human internet is worth protecting.' "$output"
            rg -F -i 'strict-transport-security:' "$headers"
            rg -F -i 'content-security-policy:' "$headers"
            rg -F -i 'x-content-type-options: nosniff' "$headers"
            if rg -i 'asora|asora-' "$output"; then
              echo "Retired Asora branding found in active ${host} output." >&2
              exit 1
            fi
          }
          check_public_site 'lythaus.co' marketing
          echo 'marketing=PASS' >> "$GITHUB_OUTPUT"
          check_public_site 'www.lythaus.co' www
          echo 'www=PASS' >> "$GITHUB_OUTPUT"
          web_status="$(curl --location --silent --show-error --max-time 30 --retry 4 --retry-delay 2 --output "$tmpdir/web.html" --write-out '%{http_code}' "$WEB_BASE_URL")"
          test "$web_status" = 200
          echo 'flutter_web=PASS' >> "$GITHUB_OUTPUT"
          api_status="$(curl --silent --show-error --max-time 30 --output "$tmpdir/api.json" --write-out '%{http_code}' "${API_BASE_URL%/}/health")"
          test "$api_status" = 200
          rg -F '"status":"ok"' "$tmpdir/api.json"
          echo 'public_api=PASS' >> "$GITHUB_OUTPUT"
          admin_api_status="$(curl --silent --show-error --max-time 30 --output "$tmpdir/admin-api.json" --write-out '%{http_code}' "${ADMIN_API_URL%/}/health")"
          test "$admin_api_status" = 200
          echo 'admin_api=PASS' >> "$GITHUB_OUTPUT"
          unauth_status="$(curl --silent --show-error --max-time 30 --output "$tmpdir/admin-unauth.html" --write-out '%{http_code}' 'https://admin.lythaus.co/')"
          [[ "$unauth_status" = 302 || "$unauth_status" = 401 || "$unauth_status" = 403 ]]
          auth_status="$(curl --silent --show-error --max-time 30 --dump-header "$tmpdir/admin-auth.headers" --output "$tmpdir/admin-auth.html" --write-out '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            'https://admin.lythaus.co/')"
          test "$auth_status" = 200
          rg -F -i 'content-security-policy:' "$tmpdir/admin-auth.headers"
          echo 'admin_ui=PASS' >> "$GITHUB_OUTPUT"
          echo 'jobs=PASS' >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish canonical release manifest
    needs: [preflight, provider_evidence, marketing, web, admin, workers, production_smoke]
    if: always()
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      HISTORICAL_RECONCILIATION_RUN_ID: ${{ inputs.historical_reconciliation_run_id }}
      BRANCH_PROTECTION_VERIFIED: ${{ needs.preflight.outputs.branch_protection_verified || 'false' }}
      HISTORICAL_BRANCHES_RECONCILED: ${{ needs.preflight.outputs.historical_branches_reconciled || 'false' }}
      SECURITY_CHECKS_VERIFIED: ${{ needs.preflight.outputs.security_checks_verified || 'false' }}
      MARKETING_DEPLOYMENT_SHA: ${{ needs.marketing.outputs.deployed_sha }}
      WEB_DEPLOYMENT_SHA: ${{ needs.web.outputs.deployed_sha }}
      ADMIN_DEPLOYMENT_SHA: ${{ needs.admin.outputs.deployed_sha }}
      MARKETING_DEPLOYMENT_ID: ${{ needs.marketing.outputs.pages_deployment_id }}
      MARKETING_DEPLOYMENT_URL: ${{ needs.marketing.outputs.pages_deployment_url }}
      MARKETING_PAGES_PROJECT: ${{ needs.marketing.outputs.pages_project }}
      MARKETING_PAGES_BRANCH: ${{ needs.marketing.outputs.pages_branch }}
      WEB_DEPLOYMENT_ID: ${{ needs.web.outputs.pages_deployment_id }}
      WEB_DEPLOYMENT_URL: ${{ needs.web.outputs.pages_deployment_url }}
      WEB_PAGES_PROJECT: ${{ needs.web.outputs.pages_project }}
      WEB_PAGES_BRANCH: ${{ needs.web.outputs.pages_branch }}
      ADMIN_DEPLOYMENT_ID: ${{ needs.admin.outputs.pages_deployment_id }}
      ADMIN_DEPLOYMENT_URL: ${{ needs.admin.outputs.pages_deployment_url }}
      LYTHAUS_ADMIN_PAGES_PROJECT: ${{ needs.admin.outputs.pages_project }}
      ADMIN_PAGES_BRANCH: ${{ needs.admin.outputs.pages_branch }}
      CLOUDFLARE_INVENTORY_STATUS: ${{ needs.provider_evidence.outputs.cloudflare_status || 'UNKNOWN/BLOCKED' }}
      CLOUDFLARE_LEGACY_ASORA_ACTIVE_RESOURCES: ${{ needs.provider_evidence.outputs.cloudflare_legacy_asora_active_resources || '0' }}
      CLOUDFLARE_PAGES_INVENTORY_VERIFIED: ${{ needs.provider_evidence.outputs.cloudflare_pages_inventory_verified || 'false' }}
      PLANETSCALE_INVENTORY_STATUS: ${{ needs.provider_evidence.outputs.planetscale_status || 'UNKNOWN/BLOCKED' }}
      HYPERDRIVE_VERIFIED_MAIN: ${{ needs.workers.outputs.hyperdrive_verified_main }}
      DATABASE_IDENTITY_VERIFIED: ${{ needs.workers.outputs.database_identity_verified }}
      BUDGET_ENFORCEMENT_VERIFIED: ${{ needs.workers.outputs.budget_enforcement_verified }}
      AUTHENTICATED_ACCEPTANCE_PROVEN: ${{ needs.workers.outputs.authenticated_acceptance_proven }}
      PLANETSCALE_SCHEMA_FINGERPRINT: ${{ needs.provider_evidence.outputs.planetscale_schema_fingerprint }}
      PLANETSCALE_RELATION_COUNT: ${{ needs.provider_evidence.outputs.planetscale_relation_count }}
      PLANETSCALE_SERVER_VERSION: ${{ needs.provider_evidence.outputs.planetscale_server_version }}
      PLANETSCALE_MIGRATION_SET_SHA256: ${{ needs.provider_evidence.outputs.planetscale_migration_set_sha256 }}
      PLANETSCALE_GRANTS_VERIFIED: ${{ needs.provider_evidence.outputs.planetscale_grants_verified }}
      PROVIDER_EVIDENCE_RUN_URL: ${{ needs.provider_evidence.outputs.evidence_run_url }}
      PUBLIC_API_WORKER_VERSION: ${{ needs.workers.outputs.public_worker_version }}
      ADMIN_API_WORKER_VERSION: ${{ needs.workers.outputs.admin_worker_version }}
      JOBS_WORKER_VERSION: ${{ needs.workers.outputs.jobs_worker_version }}
      WORKER_SOURCE_SHA: ${{ needs.workers.outputs.worker_source_sha }}
      ROLLBACK_ARTIFACTS_PROVEN: ${{ needs.workers.outputs.rollback_artifacts_proven || 'false' }}
      PRODUCTION_SMOKE_MARKETING: ${{ needs.production_smoke.outputs.marketing || 'BLOCKED' }}
      PRODUCTION_SMOKE_WWW: ${{ needs.production_smoke.outputs.www || 'BLOCKED' }}
      PRODUCTION_SMOKE_ADMIN_UI: ${{ needs.production_smoke.outputs.admin_ui || 'BLOCKED' }}
      PRODUCTION_SMOKE_PUBLIC_API: ${{ needs.production_smoke.outputs.public_api || 'BLOCKED' }}
      PRODUCTION_SMOKE_ADMIN_API: ${{ needs.production_smoke.outputs.admin_api || 'BLOCKED' }}
      PRODUCTION_SMOKE_FLUTTER_WEB: ${{ needs.production_smoke.outputs.flutter_web || 'BLOCKED' }}
      PRODUCTION_SMOKE_JOBS: ${{ needs.production_smoke.outputs.jobs || 'BLOCKED' }}
      CREDENTIAL_ROTATION_COMPLETED: ${{ vars.LYTHAUS_CREDENTIAL_ROTATION_COMPLETED || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require exact manifest SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Build canonical release manifest
        run: node scripts/ci/build-release-manifest.mjs
      - name: Upload canonical release manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lythaus-release-manifest-${{ inputs.release_sha }}
          if-no-files-found: error
          path: .artifacts/release/release-manifest.json
