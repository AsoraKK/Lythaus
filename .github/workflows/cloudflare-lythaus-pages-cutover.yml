name: Lythaus Pages cutover

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed current main SHA for the cutover
        required: true
        type: string
      confirm_cutover:
        description: Confirm the approved in-place Lythaus Pages cutover
        required: true
        default: false
        type: boolean
      retire_legacy:
        description: Retire the legacy Lythaus preview Access application after smoke verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lythaus-pages-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Rename, verify, and retire Lythaus Pages
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}
      RETIRE_LEGACY: ${{ inputs.retire_legacy }}
      CUTOVER_EVIDENCE_PATH: .artifacts/cloudflare/lythaus-pages-cutover.json
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 7bc572c8b7cd3c00be9c655176c29382
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require exact reviewed current main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full 40-character SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$CONFIRM_CUTOVER" = true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-panel/package-lock.json

      - name: Capture rollback state and rename legacy Pages project in place
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CUTOVER_EVIDENCE_PATH")"
          CUTOVER_MODE=prepare node scripts/cloudflare/execute-lythaus-pages-cutover.mjs

      - name: Build exact control-panel artifact
        working-directory: apps/control-panel
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Deploy exact control-panel SHA to renamed project
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.123.0 pages deploy apps/control-panel/dist \
            --project-name lythaus-control-panel \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify Access, DNS, exact deployment, and browser-facing admin smoke
        run: |
          set -euo pipefail
          CUTOVER_MODE=verify node scripts/cloudflare/execute-lythaus-pages-cutover.mjs

      - name: Retire legacy Lythaus preview Access application
        if: ${{ inputs.retire_legacy }}
        run: |
          set -euo pipefail
          CUTOVER_MODE=retire node scripts/cloudflare/execute-lythaus-pages-cutover.mjs

      - name: Upload sanitized cutover and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lythaus-pages-cutover-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: .artifacts/cloudflare

      - name: Restore prior Pages project name after failed cutover
        if: failure()
        continue-on-error: true
        run: |
          set +e
          CUTOVER_MODE=rollback node scripts/cloudflare/execute-lythaus-pages-cutover.mjs
