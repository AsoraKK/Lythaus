name: API Contract

on:
  pull_request:
    paths:
      - 'api/openapi/**'
      - 'lib/generated/api_client/**'
      - 'tests/contract/**'
      - 'tools/openapi/**'
      - 'scripts/check-git-diff-clean.js'
      - '.github/workflows/api-contract.yml'
  push:
    branches: [main]

jobs:
  api_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: npm ci
        run: npm ci

      - name: Lint OpenAPI spec
        run: npm run openapi:lint

      - name: Spectral lint
        run: npx spectral lint api/openapi/openapi.yaml

      - name: Bundle OpenAPI spec
        run: npm run openapi:bundle

      - name: Fail if bundled spec drifted
        run: npm run openapi:check:bundle

      - name: Validate OpenAPI examples
        run: npm run openapi:validate:examples

      - name: Pin OpenAPI generator version
        env:
          OPENAPI_GENERATOR_CLI_SEARCH_URL: DEFAULT
        run: npx openapi-generator-cli version-manager set 7.7.0

      - name: Generate Dart client
        run: npm run openapi:gen:dart

      - name: Fail if generated Dart client drifted
        run: npm run openapi:check:dart

      - name: Compile and test generated Dart client
        run: npm run openapi:test:dart

      - name: Contract tests
        run: npm run openapi:test:contract

      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi-contract-artifacts
          path: |
            api/openapi/dist/openapi.json
