name: Settled visible-host onboarding diagnosis
on:
  pull_request:
    branches: [ui/onboarding-visible-baseline]
    paths:
      - .github/workflows/onboarding-visible-diagnostic.yml
      - scripts/prepare-onboarding-visible.mjs
      - scripts/run-onboarding-visible-diagnostic.sh
      - scripts/tests/onboarding-visible*
      - test/browser/onboarding_visible*
permissions:
  contents: read
concurrency:
  group: onboarding-visible-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnosis:
    name: Settled login to actual onboarding component
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed test/browser/onboarding_visible*.dart
      - run: flutter analyze --no-pub test/browser/onboarding_visible_route.dart test/browser/onboarding_visible_probe.dart test/browser/onboarding_visible_route_test.dart
      - run: flutter test --no-pub test/browser/onboarding_visible_route_test.dart --reporter expanded
      - run: npm ci --ignore-scripts --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare original static and settled visible-host component
        env:
          ONBOARDING_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/run-onboarding-visible-diagnostic.sh
      - name: Preserve original images, navigation and source construction
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: onboarding-visible-diagnosis
          path: build/onboarding-visible
          if-no-files-found: error
          retention-days: 7
