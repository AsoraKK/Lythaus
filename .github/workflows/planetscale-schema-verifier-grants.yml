name: PlanetScale schema verifier grant reconciliation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA for this reviewed provider reconciliation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-planetscale-schema-verifier-grants
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile aggregate-safe verifier grants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
      PLANETSCALE_VERIFIER_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
      PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
      PSCALE_BRANCH_NAME: main
      RELEASE_SHA: ${{ inputs.release_sha }}
      EVIDENCE_DIR: .artifacts/planetscale-schema-verifier-grants
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$RELEASE_SHA" == "$(git rev-parse origin/main)" ]]

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Reconcile aggregate-safe grants without schema changes
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/ci/reconcile-planetscale-schema-verifier.mjs \
            > "$EVIDENCE_DIR/reconciliation.log"

      - name: Write sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '{'
            printf '  "releaseSha": "%s",\n' "$RELEASE_SHA"
            echo '  "status": "VERIFIED",'
            echo '  "scope": "metadata plus aggregate-safe auth evidence columns",'
            echo '  "schemaChanges": false,'
            echo '  "ddlExecuted": false'
            echo '}'
          } > "$EVIDENCE_DIR/summary.json"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: planetscale-schema-verifier-grants-${{ inputs.release_sha }}
          path: .artifacts/planetscale-schema-verifier-grants
          if-no-files-found: error
