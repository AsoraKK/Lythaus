name: Native PlanetScale migrations

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/planetscale/**'
      - 'scripts/validate-migration-baseline.mjs'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/ci/verify-cloudflare-hyperdrive-targets.mjs'
      - 'scripts/ci/verify-ai-gateway-paths.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'database/planetscale/extensions/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'database/planetscale/**'
      - 'scripts/validate-migration-baseline.mjs'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/ci/verify-cloudflare-hyperdrive-targets.mjs'
      - 'scripts/ci/verify-ai-gateway-paths.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'database/planetscale/extensions/**'

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:planetscale-migrations
      - run: node scripts/ci/verify-planetscale-production-schema.mjs --manifest-only
      - run: npm run validate:planetscale-extensions
      - run: npm run test:native-architecture
