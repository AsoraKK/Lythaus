name: Deploy reviewed marketing presentation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      codeql_run_id:
        required: true
        type: string
      dependency_review_run_id:
        required: true
        type: string
      secret_scan_run_id:
        required: true
        type: string
      historical_reconciliation_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lythaus-marketing-production
  cancel-in-progress: false

jobs:
  marketing:
    name: Deploy and verify marketing presentation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      PAGES_PROJECT: lythaus-marketing
      PAGES_BRANCH: main
      PUBLIC_API_BASE_URL: https://api.lythaus.co
      PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Set temporary marketing evidence directory
        run: echo "MARKETING_RELEASE_DIR=$RUNNER_TEMP/marketing-presentation-release" >> "$GITHUB_ENV"
      - name: Require exact protected current main
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Require exact production CI and security evidence
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          DEPENDENCY_REVIEW_RUN_ID: ${{ inputs.dependency_review_run_id }}
          SECRET_SCAN_RUN_ID: ${{ inputs.secret_scan_run_id }}
          HISTORICAL_RECONCILIATION_RUN_ID: ${{ inputs.historical_reconciliation_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/marketing-presentation-evidence.mjs
      - name: Capture active marketing deployment and prove complete scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/ci/marketing-presentation-deployment.mjs snapshot
          node scripts/ci/marketing-presentation-deployment.mjs scope
          node scripts/ci/marketing-presentation-deployment.mjs snapshot-surface
      - name: Preserve prior marketing deployment before activation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-presentation-before-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/marketing-presentation-release
          retention-days: 7
          overwrite: false
          if-no-files-found: error
      - name: Resolve production Turnstile sitekey from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare/waitlist-turnstile.mjs resolve
      - name: Install locked browser and marketing dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm ci --ignore-scripts --no-audit
          npm ci --prefix apps/marketing-site
          npx playwright install --with-deps chromium firefox webkit
      - name: Build and validate exact marketing artifact
        run: |
          set -euo pipefail
          node -e "const u=new URL(process.env.PUBLIC_API_BASE_URL);if(u.protocol!=='https:'||u.hostname!=='api.lythaus.co'||u.pathname!=='/')throw Error('invalid API base');if(!/^[A-Za-z0-9_-]{20,}$/.test(process.env.PUBLIC_TURNSTILE_SITE_KEY))throw Error('invalid Turnstile key')"
          npm --prefix apps/marketing-site run build
          git diff --ignore-space-at-eol --exit-code HEAD -- apps/marketing-site/.astro/content.d.ts
          git restore --source HEAD --worktree -- apps/marketing-site/.astro/content.d.ts
          node scripts/cloudflare/validate-marketing-output.mjs apps/marketing-site/dist
          if rg -n -i 'TURNSTILE_SECRET|PII_ENCRYPTION_KEY|PII_HMAC_KEY' apps/marketing-site/dist; then exit 1; fi
          rg -F 'challenges.cloudflare.com/turnstile/v0/api.js' apps/marketing-site/dist/index.html
          rg -F 'waitlist_signup' apps/marketing-site/dist/index.html
          node scripts/ci/marketing-presentation-deployment.mjs artifact
      - name: Recheck main, artifact and active deployment
        id: predeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          node scripts/ci/marketing-presentation-deployment.mjs predeploy
      - name: Deploy exact marketing artifact
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          node scripts/ci/marketing-presentation-deployment.mjs predeploy
          printf '%s\n' 'deployment submitted' > "$MARKETING_RELEASE_DIR/deploy-attempted"
          if ! npx --yes wrangler@4.123.0 pages deploy apps/marketing-site/dist \
            --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH" \
            --commit-hash "$RELEASE_SHA" --commit-dirty=false | tee "$RUNNER_TEMP/marketing-wrangler-output.txt"; then
            touch "$MARKETING_RELEASE_DIR/provider-outcome-unverified"
            exit 1
          fi
          preview_url="$(grep -Eo 'https://[a-z0-9-]+\.lythaus-marketing\.pages\.dev' "$RUNNER_TEMP/marketing-wrangler-output.txt" | head -n 1)"
          test -n "$preview_url"
          if ! MARKETING_DEPLOYMENT_URL="$preview_url" node scripts/ci/marketing-presentation-deployment.mjs bind; then
            touch "$MARKETING_RELEASE_DIR/provider-outcome-unverified"
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Verify exact Pages deployment evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_DEPLOYMENT_EVIDENCE_OUTPUT: ${{ runner.temp }}/marketing-presentation-release/pages-evidence.json
        run: |
          set -euo pipefail
          if ! node scripts/cloudflare/verify-pages-deployment.mjs; then
            touch "$MARKETING_RELEASE_DIR/provider-outcome-unverified"
            exit 1
          fi
          test "$(jq -r '.deploymentId' "$PAGES_DEPLOYMENT_EVIDENCE_OUTPUT")" = "$(jq -r '.deploymentId' "$MARKETING_RELEASE_DIR/candidate.json")"
      - name: Verify public routes, canonical domains and security headers
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marketing-pages"
          routes=(/ /about /ai-moderation /contact /features /guidelines /invite /pricing /privacy /signup /terms)
          for route in "${routes[@]}"; do
            name="${route//\//_}"; test -n "$name" || name="_root"
            response="$(curl --location --silent --show-error --max-time 20 --output "$RUNNER_TEMP/marketing-pages/${name}.html" --write-out '%{http_code}|%{url_effective}' "${PREVIEW_URL}${route}")"
            test "${response%%|*}" = 200
            [[ "${response#*|}" == "${PREVIEW_URL}"* && "${response#*|}" != *'#'* ]]
          done
          curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/marketing-sitemap.xml" --write-out '%{http_code}' "${PREVIEW_URL}/sitemap.xml" | grep -qx 200
          curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/marketing-robots.txt" --write-out '%{http_code}' "${PREVIEW_URL}/robots.txt" | grep -qx 200
          retired_brand='as''ora'; retired_cloud_host='az''ure''websites'
          if rg -in "(${retired_brand}\\.co\\.za|${retired_cloud_host}\\.net|lythaus-marketing\\.pages\\.dev)" "$RUNNER_TEMP/marketing-pages"; then exit 1; fi
          rg -Fqx 'Sitemap: https://lythaus.co/sitemap.xml' "$RUNNER_TEMP/marketing-robots.txt"
          rg -F '<loc>https://lythaus.co/' "$RUNNER_TEMP/marketing-sitemap.xml"
          curl --silent --show-error --max-time 20 --dump-header "$RUNNER_TEMP/marketing-headers.txt" --output /dev/null "${PREVIEW_URL}/"
          for header in 'X-Content-Type-Options: nosniff' 'Referrer-Policy: strict-origin-when-cross-origin' 'X-Frame-Options: DENY' 'Strict-Transport-Security: max-age=300' 'Content-Security-Policy:'; do
            rg -F -i "$header" "$RUNNER_TEMP/marketing-headers.txt"
          done
          rg -F 'challenges.cloudflare.com/turnstile/v0/api.js' "$RUNNER_TEMP/marketing-pages/_.html"
          rg -F 'waitlist_signup' "$RUNNER_TEMP/marketing-pages/_.html"
          node -e "import('./scripts/ci/marketing-presentation-deployment.mjs').then(x=>x.readPublicSurfaces())"
      - name: Verify live animation, responsive fallback and synthetic form flow
        env:
          MARKETING_LIVE_ORIGIN: https://lythaus.co
          MARKETING_LIVE_QA_DIR: ${{ runner.temp }}/marketing-presentation-release/browser
        run: node --test scripts/tests/marketing-presentation-live.browser.mjs
      - name: Verify live deployment and artifact binding again
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! node scripts/ci/marketing-presentation-deployment.mjs verify-current; then
            touch "$MARKETING_RELEASE_DIR/provider-outcome-unverified"
            exit 1
          fi
      - name: Write marketing-only release receipt
        run: |
          set -euo pipefail
          jq -n --slurpfile before "$MARKETING_RELEASE_DIR/before.json" --slurpfile candidate "$MARKETING_RELEASE_DIR/candidate.json" --slurpfile artifact "$MARKETING_RELEASE_DIR/artifact.json" --slurpfile scope "$MARKETING_RELEASE_DIR/scope.json" \
            '{schemaVersion:1,releaseType:"MARKETING_PRESENTATION_ONLY",ownerTest:true,sourceSha:$candidate[0].commitSha,previousDeployment:$before[0],deployment:$candidate[0],artifact:$artifact[0],scope:$scope[0],databaseRecovery:"NOT_APPLICABLE",recoveryCertified:false,workersDeployed:false,routes:"PASS",browser:"PASS",formFlow:"SYNTHETIC_INTERCEPTED",completedAt:now|todate}' > "$MARKETING_RELEASE_DIR/receipt.json"
      - name: Upload marketing-only release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-presentation-release-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/marketing-presentation-release
          retention-days: 7
          overwrite: false
          if-no-files-found: error
      - name: Roll back only the bound marketing deployment after failure
        if: ${{ always() && steps.predeploy.outcome == 'success' && steps.deploy.outcome != 'skipped' && (failure() || cancelled()) }}
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if test -f "$MARKETING_RELEASE_DIR/deploy-attempted" \
            && test -s "$MARKETING_RELEASE_DIR/candidate.json" \
            && ! test -f "$MARKETING_RELEASE_DIR/provider-outcome-unverified"; then
            node scripts/ci/marketing-presentation-deployment.mjs rollback
          elif test -f "$MARKETING_RELEASE_DIR/deploy-attempted"; then
            jq -n '{status:"BLOCKED_OR_UNCERTAIN",blocker:"marketing_provider_outcome_unverified_no_retry"}' > "$MARKETING_RELEASE_DIR/rollback.json"
            exit 1
          fi
      - name: Verify restored marketing surfaces
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        run: |
          set -euo pipefail
          if test -f "$MARKETING_RELEASE_DIR/deploy-attempted"; then
            node scripts/ci/marketing-presentation-deployment.mjs verify-rollback-surface
          fi
      - name: Preserve failure and rollback evidence
        if: ${{ always() && steps.predeploy.outcome == 'success' && steps.deploy.outcome != 'skipped' && (failure() || cancelled()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-presentation-failure-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/marketing-presentation-release
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
