name: Read-only Cloudflare billing diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed current main SHA for this diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-cloudflare-billing-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect billing access with redacted historical evidence
    if: github.repository == 'AsoraKK/Lythaus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require protected main and exact reviewed source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate boundaries using synthetic responses
        run: node --test scripts/tests/cloudflare-billing-diagnostic.test.mjs
      - name: Read billing history once and print only allowlisted evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare/inspect-billing-history.mjs | tee -a "$GITHUB_STEP_SUMMARY"
