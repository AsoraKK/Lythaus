name: PlanetScale bounded verifier stats permission

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current merged main SHA
        required: true
        type: string
      operation:
        description: Inspect authority, apply the approved grant, or revoke only this workflow's introduced grant
        required: true
        type: choice
        default: inspect
        options: [inspect, grant, revoke]
      grant_run_id:
        description: Required only for revoke; completed grant run containing its original receipt
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lythaus-production-planetscale-migrations
  cancel-in-progress: false

jobs:
  stats:
    name: Bound verifier stats to the approved role and main branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STATS_OPERATION: ${{ inputs.operation }}
      GRANT_RUN_ID: ${{ inputs.grant_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact current merged main and operation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY_ID" == 1010752912 ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$RELEASE_SHA" == "$(git rev-parse origin/main)" ]]
          case "$STATS_OPERATION" in
            inspect|grant) [[ -z "$GRANT_RUN_ID" ]] ;;
            revoke) [[ "$GRANT_RUN_ID" =~ ^[1-9][0-9]*$ ]] ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Validate bounded permission contract
        run: node --test scripts/tests/planetscale-verifier-stats.test.mjs
      - name: Retrieve original grant receipt for rollback
        if: inputs.operation == 'revoke'
        shell: bash
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/verifier-stats-grant-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GRANT_RUN_ID" > "$run_file"
          jq -e '.path == ".github/workflows/planetscale-verifier-stats.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "completed" and (.head_sha | test("^[0-9a-f]{40}$"))' "$run_file" > /dev/null
          gh run download "$GRANT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "planetscale-verifier-stats-$GRANT_RUN_ID" --dir "$RUNNER_TEMP/verifier-stats-original"
          echo "VERIFIED_GRANT_RUN_SHA=$(jq -r .head_sha "$run_file")" >> "$GITHUB_ENV"
          echo "STATS_RECEIPT_FILE=$RUNNER_TEMP/verifier-stats-original/summary.json" >> "$GITHUB_ENV"
      - name: Inspect or change only the approved stats membership
        env:
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verifier-stats"
          node scripts/ci/planetscale-verifier-stats.mjs > "$RUNNER_TEMP/verifier-stats/summary.json"
      - name: Publish bounded sanitized outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/verifier-stats/summary.json"
          if [[ -f "$report" ]]; then
            jq '{sourceMainSha,runId,operation,status,mutationOutcome,blockers,target,adminOptionHeld:.before.adminOptionHeld,grantorAuthority:.before.grantorAuthority,grantorIds:.before.grantorIds,directBefore:.before.direct,introducedGrant,directAfter:.afterMembership.direct,visibilityAfter:.verifierAfter.indexProgressVisibility}' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized before and after membership evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planetscale-verifier-stats-${{ github.run_id }}
          path: ${{ runner.temp }}/verifier-stats/summary.json
          if-no-files-found: ignore
