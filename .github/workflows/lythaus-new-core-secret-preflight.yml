name: New-core existing secret read-only preflight

on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Exact reviewed protected-main commit containing this read-only wrapper
        required: true
        type: string
      schema_sha:
        description: Exact approved schema candidate; no schema execution occurs
        required: true
        default: '050b1d1a3e973b367c28eae9617840e5d4816573'
        type: string
      target:
        description: Exact isolated target
        type: choice
        required: true
        options:
          - lythaus/lythaus-new-core/main
      confirm_read_only:
        description: Check existing credentials only; no schema application or credential changes
        type: boolean
        default: false
        required: true
      inspection:
        description: Select the existing credentials and database state to verify
        type: choice
        required: false
        default: schema-preflight
        options:
          - schema-preflight
          - installed-production-roles

permissions:
  contents: read
  actions: read

env:
  REQUESTED_CONTROL_SHA: ${{ inputs.control_sha }}
  REQUESTED_SCHEMA_SHA: ${{ inputs.schema_sha }}
  REQUESTED_TARGET: ${{ inputs.target }}
  CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
  NODE_OPTIONS: ''
  NODE_DEBUG: ''

concurrency:
  group: lythaus-new-core-existing-secrets-read-only
  cancel-in-progress: false

jobs:
  verify-gate:
    name: Verify existing review gate without provider secrets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify owner dispatch, main-only policy and existing owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/lythaus-new-core-secret-preflight.mjs --gate

  inspect-existing-inputs:
    name: Owner-reviewed read-only inspection of existing inputs
    if: inputs.inspection != 'installed-production-roles'
    needs: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '050b1d1a3e973b367c28eae9617840e5d4816573'
          path: schema-candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked dependencies before credential injection
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect only the three existing inputs; publish booleans only
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_CANDIDATE_DIRECTORY: ${{ github.workspace }}/schema-candidate
          LYTHAUS_NEW_CORE_MIGRATION_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_MIGRATION_DATABASE_URL }}
          LYTHAUS_NEW_CORE_VERIFIER_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_VERIFIER_DATABASE_URL }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
        run: node scripts/ci/lythaus-new-core-secret-preflight.mjs --inspect

  inspect-production-roles:
    name: Verify installed Privacy, Runtime and Jobs roles using read-only SQL
    if: inputs.inspection == 'installed-production-roles'
    needs: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 276b43265584ec0dc158e67cbdb13cb58ece75db
          path: worker-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked dependencies before credential injection
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require recorded owner review before credential injection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { verifyExistingGate } from './scripts/ci/lythaus-new-core-secret-preflight.mjs';
          await verifyExistingGate({ env: process.env, requireApproval: true });
          JS
      - name: Check scoped sessions, catalog grants and zero-row application reads
        env:
          REQUESTED_INSPECTION: ${{ inputs.inspection }}
          GH_TOKEN: ${{ github.token }}
          LYTHAUS_NEW_CORE_PRIVACY_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_PRIVACY_DATABASE_URL }}
          LYTHAUS_NEW_CORE_RUNTIME_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_RUNTIME_DATABASE_URL }}
          LYTHAUS_NEW_CORE_JOBS_DATABASE_URL: ${{ secrets.LYTHAUS_NEW_CORE_JOBS_DATABASE_URL }}
        run: node scripts/ci/new-core-production-role-check.mjs
