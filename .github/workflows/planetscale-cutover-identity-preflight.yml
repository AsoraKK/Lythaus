name: PlanetScale cutover identity preflight

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA for the selected protected inspection
        required: true
        type: string
      inspection:
        description: Existing inspection, read-only audit/install packet, or separately approved credential probe
        required: true
        type: choice
        default: identity
        options: [identity, restore-inventory, install-target, migration-role-audit, migration-probe, rebind-install-packet]
      migration_probe_approval:
        description: Separate source-bound one-use credential approval JSON; blank for every read-only mode
        required: false
        default: ''
        type: string
      rebind_connection:
        description: Existing connection or separately approved dedicated connection; packet inspection only
        required: false
        default: existing
        type: choice
        options: [existing, separate]

permissions:
  contents: read

concurrency:
  group: lythaus-planetscale-cutover-identity-preflight
  cancel-in-progress: false

jobs:
  migration_role:
    if: inputs.inspection == 'migration-role-audit' || inputs.inspection == 'migration-probe' || inputs.inspection == 'rebind-install-packet'
    name: ${{ inputs.inspection == 'rebind-install-packet' && 'Prepare read-only disabled installation approval packet' || inputs.inspection == 'migration-role-audit' && 'Audit intended migration role without issuing credentials' || 'Separate short-lived migration probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
      MIGRATION_PROBE_APPROVAL_JSON: ${{ inputs.migration_probe_approval }}
      INSPECTION: ${{ inputs.inspection }}
      ADMIN_REBIND_CONNECTION: ${{ inputs.rebind_connection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require first-attempt owner and exact protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1010752912
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = "${GITHUB_REPOSITORY%%/*}"
          test "$GITHUB_ACTOR_ID" = 211295889
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          if [[ "$INSPECTION" != rebind-install-packet ]]; then
            test "${ADMIN_REBIND_CONNECTION:-existing}" = existing
          fi
          if [[ "$INSPECTION" == migration-probe ]]; then
            node scripts/ci/run-planetscale-migration-probe.mjs validate-probe-approval
          else
            test -z "$MIGRATION_PROBE_APPROVAL_JSON"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked dependencies without protected inputs
        run: npm ci --ignore-scripts
      - name: Validate audit and dormant probe with synthetic inputs
        run: node --experimental-strip-types --test scripts/tests/planetscale-migration-role-probe.test.mjs scripts/tests/admin-subject-rebind-install-packet.test.mjs scripts/tests/admin-subject-rebind-connection.test.mjs
      - name: Protected audit or separately approved single probe
        env:
          GH_TOKEN: ${{ github.token }}
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PLANETSCALE_ADMIN_REBIND_DATABASE_URL: ${{ inputs.inspection == 'rebind-install-packet' && secrets.PLANETSCALE_ADMIN_REBIND_DATABASE_URL || '' }}
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ inputs.inspection == 'rebind-install-packet' && secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL || '' }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INSPECTION" == migration-probe ]]; then
            node scripts/ci/run-planetscale-migration-probe.mjs probe
          elif [[ "$INSPECTION" == rebind-install-packet ]]; then
            node scripts/ci/admin-subject-rebind-install-packet.mjs > "$RUNNER_TEMP/rebind-install-packet.json"
          else
            node scripts/ci/run-planetscale-migration-probe.mjs audit > "$RUNNER_TEMP/migration-role-audit.json"
          fi
      - name: Retain sanitized role audit
        if: always() && inputs.inspection == 'migration-role-audit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-role-audit-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-role-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain non-executable disabled installation approval packet
        if: always() && inputs.inspection == 'rebind-install-packet'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebind-install-packet-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rebind-install-packet.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain sanitized probe checkpoint
        if: always() && inputs.inspection == 'migration-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-probe-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-probe.json
          if-no-files-found: ignore
          retention-days: 7

  install_target:
    if: inputs.inspection == 'install-target'
    name: Compare existing migration target without connecting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Require existing binding for this inspection
        env:
          ADMIN_REBIND_CONNECTION: ${{ inputs.rebind_connection }}
        run: test "${ADMIN_REBIND_CONNECTION:-existing}" = existing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require first-attempt owner run on exact protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1010752912
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = "${GITHUB_REPOSITORY%%/*}"
          test "$GITHUB_ACTOR_ID" = 211295889
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate comparison without protected inputs
        run: |
          node --check scripts/ci/admin-subject-rebind-target-diagnostic.mjs
          node --test scripts/tests/admin-subject-rebind-target-diagnostic.test.mjs
      - name: Recheck main immediately before protected comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Report only target match booleans
        env:
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        run: node scripts/ci/admin-subject-rebind-target-diagnostic.mjs > "$RUNNER_TEMP/install-target-diagnostic.json"
      - name: Summarize private comparison
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/install-target-diagnostic.json"
          if [[ -s "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized target comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-rebind-install-target-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/install-target-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

  inspect:
    if: inputs.inspection == 'identity'
    name: Inspect protected production SQL identities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Require existing binding for this inspection
        env:
          ADMIN_REBIND_CONNECTION: ${{ inputs.rebind_connection }}
        run: test "${ADMIN_REBIND_CONNECTION:-existing}" = existing
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          git fetch --no-tags origin main
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$RELEASE_SHA" == "$(git rev-parse origin/main)" ]]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate read-only identity preflight
        run: |
          set -euo pipefail
          node --check scripts/ci/planetscale-cutover-identity-preflight.mjs
          npm run test:planetscale-production-migrations
          node --test scripts/tests/planetscale-cutover-identity-preflight.test.mjs

      - name: Recheck current main before protected reads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Inspect current main through existing protected credentials
        env:
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: lythaus
          PLANETSCALE_DATABASE: lythaus-core
          EVIDENCE_DIR: ${{ runner.temp }}/planetscale-cutover-identity
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/ci/planetscale-cutover-identity-preflight.mjs > "$EVIDENCE_DIR/summary.json"

      - name: Summarize identity and separate product authority status
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/planetscale-cutover-identity/summary.json"
          if [[ -s "$report" ]]; then
            jq '{sourceMainSha,status,blockers,productGrantAuthority}' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planetscale-cutover-identity-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/planetscale-cutover-identity
          if-no-files-found: ignore
          retention-days: 7

  restore_inventory:
    if: inputs.inspection == 'restore-inventory'
    name: Collect fixed main backup and role metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Require existing binding for this inspection
        env:
          ADMIN_REBIND_CONNECTION: ${{ inputs.rebind_connection }}
        run: test "${ADMIN_REBIND_CONNECTION:-existing}" = existing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require protected main in the existing repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1010752912
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Verify metadata boundaries without provider access
        run: |
          node --check scripts/ci/planetscale-native-restore-inventory.mjs
          node --test scripts/tests/planetscale-native-restore-inventory.test.mjs
      - name: Recheck current main before metadata reads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Read backup inventory and canonical role mappings
        env:
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        run: node scripts/ci/planetscale-native-restore-inventory.mjs > "$RUNNER_TEMP/native-restore-inventory.json"
      - name: Retain only sanitized restore metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-restore-inventory-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/native-restore-inventory.json
          if-no-files-found: ignore
          retention-days: 7
