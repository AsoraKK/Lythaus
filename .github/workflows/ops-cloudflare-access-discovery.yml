name: Discover Cloudflare Access release identity

on:
  push:
    branches:
      - ops/release-e19c5ac4
    paths:
      - .github/workflows/ops-cloudflare-access-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current admin Worker Access bindings read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is unavailable" >&2; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is unavailable" >&2; exit 2; }

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          settings_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/workers/scripts/lythaus-admin-api-development/settings")"
          jq -e '.success == true and (.result.bindings | type == "array")' <<<"$settings_json" >/dev/null

          binding_text() {
            local name="$1"
            jq -r --arg name "$name" '.result.bindings[] | select(.name == $name and .type == "plain_text") | .text' <<<"$settings_json" | head -n1
          }

          team_domain="$(binding_text ACCESS_TEAM_DOMAIN)"
          audiences="$(binding_text ACCESS_AUDIENCE)"
          jwks_url="$(binding_text ACCESS_JWKS_URL)"

          echo "CURRENT_ACCESS_TEAM_DOMAIN=${team_domain}"
          echo "CURRENT_ACCESS_AUDIENCE=${audiences}"
          echo "CURRENT_ACCESS_JWKS_URL=${jwks_url}"
          echo "CURRENT_ACCESS_BINDING_NAMES:"
          jq -r '.result.bindings[] | select(.type == "plain_text") | .name' <<<"$settings_json" | grep '^ACCESS_' || true

          [[ "$team_domain" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]] || {
            echo "Current admin Worker does not contain a materialized Access team domain." >&2
            exit 1
          }
          [[ "$jwks_url" == "https://${team_domain}/cdn-cgi/access/certs" ]] || {
            echo "Current admin Worker Access JWKS URL does not match its team domain." >&2
            exit 1
          }

      - name: Confirm live Zero Trust apps when token permission allows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          if ! apps_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/access/apps?per_page=1000" 2>/dev/null)"; then
            echo "Access Apps read permission is not present on this token."
            exit 0
          fi
          jq -e '.success == true and (.result | type == "array")' <<<"$apps_json" >/dev/null
          mapfile -t matching < <(jq -r '
            .result[]
            | select(.type == "self_hosted")
            | select((.domain // "") | test("^admin(-api)?\\.lythaus\\.co(?:/|$)"))
            | select((.aud // "") | length > 0)
            | [.domain, .aud] | @tsv
          ' <<<"$apps_json")
          echo "Matching live Access applications: ${#matching[@]}"
          printf '%s\n' "${matching[@]}"
