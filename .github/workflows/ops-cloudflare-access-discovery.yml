name: Discover Cloudflare Access release identity

on:
  push:
    branches:
      - ops/release-e19c5ac4
    paths:
      - .github/workflows/ops-cloudflare-access-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current admin Worker Access bindings read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          settings_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/workers/scripts/lythaus-admin-api-development/settings")"
          jq -e '.success == true and (.result.bindings | type == "array")' <<<"$settings_json" >/dev/null
          binding_text() {
            local name="$1"
            jq -r --arg name "$name" '.result.bindings[] | select(.name == $name and .type == "plain_text") | .text' <<<"$settings_json" | head -n1
          }
          team_domain="$(binding_text ACCESS_TEAM_DOMAIN)"
          audiences="$(binding_text ACCESS_AUDIENCE)"
          jwks_url="$(binding_text ACCESS_JWKS_URL)"
          echo "CURRENT_ACCESS_TEAM_DOMAIN=${team_domain}"
          echo "CURRENT_ACCESS_AUDIENCE=${audiences}"
          echo "CURRENT_ACCESS_JWKS_URL=${jwks_url}"

      - name: Inventory existing self-hosted Access applications read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          apps_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/access/apps?per_page=1000")"
          jq -e '.success == true and (.result | type == "array")' <<<"$apps_json" >/dev/null
          echo "SELF_HOSTED_ACCESS_APPS:"
          jq -r '.result[] | select(.type == "self_hosted") | [.id, (.name // ""), (.domain // ""), (.aud // "")] | @tsv' <<<"$apps_json"
