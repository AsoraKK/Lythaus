name: Discover Cloudflare Access release identity

on:
  push:
    branches:
      - ops/release-e19c5ac4
    paths:
      - .github/workflows/ops-cloudflare-access-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover Zero Trust organization and admin Access applications
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is unavailable outside the protected production environment" >&2; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is unavailable outside the protected production environment" >&2; exit 2; }

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          org_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/access/organizations")"
          apps_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/access/apps?per_page=1000")"

          jq -e '.success == true and (.result.auth_domain | type == "string")' <<<"$org_json" >/dev/null
          auth_domain="$(jq -r '.result.auth_domain' <<<"$org_json")"
          [[ "$auth_domain" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]] || { echo "Unexpected Zero Trust auth_domain" >&2; exit 1; }

          jq -e '.success == true and (.result | type == "array")' <<<"$apps_json" >/dev/null
          mapfile -t matching < <(jq -r '
            .result[]
            | select(.type == "self_hosted")
            | select((.domain // "") | test("^admin(-api)?\\.lythaus\\.co(?:/|$)"))
            | select((.aud // "") | length > 0)
            | [.domain, .aud] | @tsv
          ' <<<"$apps_json")

          if [[ "${#matching[@]}" -ne 2 ]]; then
            echo "Expected exactly two self-hosted Access applications covering admin.lythaus.co and/or admin-api.lythaus.co; found ${#matching[@]}." >&2
            printf '%s\n' "${matching[@]%%$'\t'*}" >&2 || true
            exit 1
          fi

          aud_one="${matching[0]#*$'\t'}"
          aud_two="${matching[1]#*$'\t'}"
          [[ "$aud_one" != "$aud_two" ]] || { echo "Access audience tags must be distinct" >&2; exit 1; }

          echo "ACCESS_TEAM_DOMAIN=${auth_domain}"
          echo "ACCESS_JWKS_URL=https://${auth_domain}/cdn-cgi/access/certs"
          echo "ACCESS_APP_1_DOMAIN=${matching[0]%%$'\t'*}"
          echo "ACCESS_APP_1_AUD=${aud_one}"
          echo "ACCESS_APP_2_DOMAIN=${matching[1]%%$'\t'*}"
          echo "ACCESS_APP_2_AUD=${aud_two}"
