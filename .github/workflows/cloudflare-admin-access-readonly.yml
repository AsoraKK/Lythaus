name: Read-only Cloudflare Admin Access check

on:
  workflow_dispatch:
    inputs:
      audit_identity_history:
        description: Collect sanitized identity and secret-write audit metadata; no authorization or provider changes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-access-readonly
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Admin UI and API Access rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check verifier syntax
        run: |
          node --check scripts/ci/cloudflare-admin-api-audience.mjs
          node --check scripts/ci/verify-cloudflare-admin-access.mjs
          node --check scripts/ci/collect-admin-identity-audit.mjs
          node --test scripts/tests/cloudflare-admin-api-audience.test.mjs
          node --test scripts/tests/admin-identity-audit.test.mjs
      - name: Verify exact Admin UI and API Access rules
        if: inputs.audit_identity_history != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ADMIN_API_AUDIENCE_SNAPSHOT: cee241b59a461d2c0199404312504688a92949276b74b1a2364464bf8554810c
        run: node scripts/ci/verify-cloudflare-admin-access.mjs
      - name: Collect bounded read-only identity and Worker audit metadata
        if: inputs.audit_identity_history == true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ADMIN_API_AUDIENCE_SNAPSHOT: cee241b59a461d2c0199404312504688a92949276b74b1a2364464bf8554810c
          REF_PROTECTED: ${{ github.ref_protected }}
          ADMIN_IDENTITY_AUDIT_REPORT: ${{ runner.temp }}/admin-identity-audit.json
          NODE_OPTIONS: ''
          NODE_DEBUG: ''
        run: node scripts/ci/collect-admin-identity-audit.mjs
      - name: Preserve sanitized identity audit evidence
        if: always() && inputs.audit_identity_history == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-identity-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-identity-audit.json
          if-no-files-found: ignore
          retention-days: 7
