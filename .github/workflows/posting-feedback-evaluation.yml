name: Posting feedback evaluation

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: posting-feedback-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posting_feedback_evaluation:
    name: Offline posting feedback evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked evaluation dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Validate offline evaluation at source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/ci/validate-posting-feedback-evaluation.mjs
