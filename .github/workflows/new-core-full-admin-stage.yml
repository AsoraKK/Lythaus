name: Stage first full new-core Admin
run-name: stage-first-full-admin at ${{ inputs.control_sha }}

on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Exact current protected main commit for the full Admin version and its connection pins
        required: true
        type: string
      confirm_stage_only:
        description: Confirm reviewed connector and route evidence and authorize one non-serving Admin version
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Serialize with isolated updates at workflow level and with the canonical
# release at job level. This job never changes traffic or routes.
concurrency:
  group: lythaus-new-core-isolated-setup
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1 && inputs.confirm_stage_only
    name: Stage full Admin without traffic
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: lythaus-production-workers
      cancel-in-progress: false
    env:
      REQUESTED_CONTROL_SHA: ${{ inputs.control_sha }}
      CONFIRM_STAGE_ONLY: ${{ inputs.confirm_stage_only }}
      NODE_DEBUG: ''
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
      - name: Verify the exact source and destination manifests
        run: |
          set -euo pipefail
          test "$REQUESTED_CONTROL_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/ci/verify-cloudflare-hyperdrive-targets.mjs --new-core-candidate --manifest-only
      - name: Build the full Admin handler and assets without provider credentials
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/control-panel ci --ignore-scripts --no-audit --no-fund
          node scripts/check-npm-audit.js
          node scripts/check-npm-audit.js apps/control-panel
          npm --prefix apps/control-panel run build
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run \
            --config apps/lythaus-admin-api/wrangler.jsonc --outdir "$RUNNER_TEMP/new-core-full-admin"
      - name: Upload the full Admin version without assigning traffic
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_READINESS_TOKEN: ${{ secrets.DATABASE_READINESS_TOKEN }}
          LYTHAUS_NEW_CORE_OWNER_EMAIL: ${{ secrets.LYTHAUS_NEW_CORE_OWNER_EMAIL }}
          PII_ENCRYPTION_KEY_V1: ${{ secrets.PII_ENCRYPTION_KEY_V1 }}
          PII_HMAC_KEY_V1: ${{ secrets.PII_HMAC_KEY_V1 }}
        run: node scripts/ci/new-core-full-admin-stage.mjs
      - name: Retain the protected first full Admin upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-full-admin-${{ github.sha }}
          path: ${{ runner.temp }}/new-core-full-admin/first-full-admin.json
          if-no-files-found: error
          retention-days: 30
