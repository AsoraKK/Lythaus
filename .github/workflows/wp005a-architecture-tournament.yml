name: WP005A authenticity architecture tournament

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lythaus-wp005a-architecture-tournament
  cancel-in-progress: false

jobs:
  bounded-tournament:
    name: Run bounded WP005A tournament
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Run WP005A contract tests
        run: npm run test:authenticity-wp005a

      - name: Run bounded tournament
        run: node --experimental-strip-types scripts/authenticity/wp005a-architecture-tournament.mjs --allow-network --output-dir="$RUNNER_TEMP/wp005a"

      - name: Upload sanitized WP005A evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lythaus-wp005a-${{ github.run_id }}
          path: ${{ runner.temp }}/wp005a
          if-no-files-found: error
