name: Apply approved bounded product privileges

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed current protected main SHA for the four approved product grants
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-production-planetscale-migrations
  cancel-in-progress: false

jobs:
  grant:
    name: Apply only the four approved runtime grants
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require exact reviewed protected main and first attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = AsoraKK/Lythaus
          test "$GITHUB_REPOSITORY_ID" = 1010752912
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Test bounded execution without provider access
        run: |
          node --check scripts/ci/product-privilege-grants.mjs
          node --test scripts/tests/product-privilege-grants.test.mjs
      - name: Recheck main immediately before protected execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Apply the fixed approved SQL and verify committed catalog state
        env:
          GH_TOKEN: ${{ github.token }}
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PLANETSCALE_SCHEMA_READ_DATABASE_URL: ${{ secrets.PLANETSCALE_SCHEMA_READ_DATABASE_URL }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/product-privilege-grants.mjs
      - name: Retain only sanitized grant and rollback provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-privilege-grants-${{ github.run_id }}
          path: ${{ runner.temp }}/product-privilege-grants.json
          if-no-files-found: ignore
          retention-days: 7
