name: WP007A-HR4 bounded FLUX.1 diagnostic

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  diagnostic:
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout merged trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4519909dd6cd7ecde282390dcfc8835cdc94b950
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce exact diagnostic boundary
        env:
          EXPECTED_SHA: 4519909dd6cd7ecde282390dcfc8835cdc94b950
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_BASE_REF" = main
          test "$BASE_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Record live FLUX.1 schema capabilities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module - <<'NODE'
          import { runModelSchemaPreflight } from './scripts/authenticity/wp007ahr-preflight.mjs';

          const result = await runModelSchemaPreflight({
            token: process.env.CLOUDFLARE_API_TOKEN,
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
          });
          const model = result.models.find((candidate) => candidate.modelId === '@cf/black-forest-labs/flux-1-schnell');
          const seed = model?.schemaCapabilities?.seed ?? {};
          console.log(JSON.stringify({
            status: result.status,
            modelStatus: model?.status ?? null,
            FLUX1_LIVE_SCHEMA_HAS_PROMPT: model?.schemaCapabilities?.prompt?.present ?? null,
            FLUX1_LIVE_SCHEMA_HAS_STEPS: model?.schemaCapabilities?.steps?.present ?? null,
            FLUX1_LIVE_SCHEMA_HAS_SEED: seed.present ?? null,
            FLUX1_LIVE_SCHEMA_SEED_TYPE: seed.type ?? null,
            FLUX1_LIVE_SCHEMA_SEED_MINIMUM: seed.minimum ?? null,
            FLUX1_LIVE_SCHEMA_SEED_MAXIMUM: seed.maximum ?? null,
          }));
          NODE

      - name: Run exactly one PROMPT_001 diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          set +e
          node --experimental-strip-types scripts/authenticity/wp007ahr4-flux1-diagnostic.mjs --allow-network | tee "$RUNNER_TEMP/wp007ahr4-flux1-diagnostic.json"
          diagnostic_status=${PIPESTATUS[0]}
          set -e
          test -s "$RUNNER_TEMP/wp007ahr4-flux1-diagnostic.json"
          cat "$RUNNER_TEMP/wp007ahr4-flux1-diagnostic.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\nDIAGNOSTIC_EXIT_CODE = %s\n' "$diagnostic_status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
