name: native-workers-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/lythaus-*/**'
      - 'packages/**'
      - 'database/planetscale/**'
      - 'scripts/validate-native-worker-config.mjs'
      - 'scripts/validate-native-scope.mjs'
      - 'scripts/validate-no-retired-provider-dependencies.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'database/planetscale/extensions/**'
      - 'infrastructure/cloudflare/native-scope.json'
      - 'infrastructure/cloudflare/native-hyperdrive-production.json'
      - 'scripts/ci/verify-cloudflare-hyperdrive-targets.mjs'
      - 'scripts/ci/verify-ai-gateway-paths.mjs'
      - 'scripts/ci/probe-production-workers.mjs'
      - 'scripts/ci/run-adr003-authenticated-acceptance.mjs'
      - 'scripts/ci/probe-budget-hard-stop.mjs'
      - 'scripts/tests/budget-contract.test.mjs'
      - 'scripts/tests/db-identity-contract.test.mjs'
      - 'scripts/tests/native-architecture-invariants.test.js'
      - 'tsconfig.native.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-workers-validation.yml'
  push:
    branches: [main, development]
    paths:
      - 'apps/lythaus-*/**'
      - 'packages/**'
      - 'database/planetscale/**'
      - 'scripts/validate-native-worker-config.mjs'
      - 'scripts/validate-no-retired-provider-dependencies.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'database/planetscale/extensions/**'
      - 'infrastructure/cloudflare/native-hyperdrive-production.json'
      - 'scripts/ci/verify-cloudflare-hyperdrive-targets.mjs'
      - 'scripts/ci/verify-ai-gateway-paths.mjs'
      - 'scripts/ci/probe-production-workers.mjs'
      - 'scripts/ci/run-adr003-authenticated-acceptance.mjs'
      - 'scripts/ci/probe-budget-hard-stop.mjs'
      - 'scripts/tests/budget-contract.test.mjs'
      - 'scripts/tests/db-identity-contract.test.mjs'
      - 'scripts/tests/native-architecture-invariants.test.js'
      - 'tsconfig.native.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:cloudflare-hyperdrive-targets:manifest
      - run: npm run validate:ai-gateway-paths
      - run: npm run typecheck:native
      - run: npm run validate:native-workers
      - run: npm run validate:native-scope
      - run: npm run validate:no-retired-provider-dependencies
      - run: npm run validate:planetscale-migrations
      - run: npm run validate:planetscale-extensions
      - run: npm run test:native-architecture
      - run: npm run test:database-identity
      - run: npm run test:budget
