name: native-workers-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/lythaus-*/**'
      - 'packages/**'
      - 'database/planetscale/**'
      - 'scripts/validate-native-worker-config.mjs'
      - 'scripts/validate-native-scope.mjs'
      - 'scripts/validate-native-azure-dependencies.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'database/planetscale/extensions/**'
      - 'infrastructure/cloudflare/native-scope.json'
      - 'scripts/tests/native-architecture-invariants.test.js'
      - 'tsconfig.native.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-workers-validation.yml'
  push:
    branches: [main, development]
    paths:
      - 'apps/lythaus-*/**'
      - 'packages/**'
      - 'database/planetscale/**'
      - 'scripts/validate-native-worker-config.mjs'
      - 'scripts/validate-native-azure-dependencies.mjs'
      - 'scripts/ci/apply-planetscale-production-migrations.mjs'
      - 'scripts/ci/verify-planetscale-production-schema.mjs'
      - 'scripts/validate-production-gates.mjs'
      - 'infrastructure/cloudflare/production-gates.json'
      - 'scripts/validate-planetscale-extensions.mjs'
      - 'database/planetscale/extensions/**'
      - 'scripts/tests/native-architecture-invariants.test.js'
      - 'tsconfig.native.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:native
      - run: npm run validate:native-workers
      - run: npm run validate:native-scope
      - run: npm run validate:native-azure-dependencies
      - run: npm run validate:planetscale-migrations
      - run: npm run validate:planetscale-extensions
      - run: npm run test:native-architecture
