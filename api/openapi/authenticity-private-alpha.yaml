{
  "paths": {
    "/authenticity/alpha/cases": {
      "get": {
        "operationId": "listAuthenticityPrivateAlphaCases",
        "summary": "List private alpha cases",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "responses": {"200": {"description": "Private alpha cases.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaCaseList"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      },
      "post": {
        "operationId": "createAuthenticityPrivateAlphaCase",
        "summary": "Create a text, image or mixed private alpha case",
        "description": "Author/admin-only, non-enforcing alpha. Image bytes remain in quarantine until finalisation. Polling does not start work.",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaCreateRequest"}}}},
        "responses": {"201": {"description": "Text case or upload session created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaCreateResponse"}}}}, "400": {"description": "Invalid input or consent.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "404": {"description": "Alpha unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "429": {"description": "Budget or cohort paused.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}": {
      "get": {
        "operationId": "getAuthenticityPrivateAlphaCase",
        "summary": "Get a private alpha result",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Private result and component states.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaCase"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      },
      "delete": {
        "operationId": "deleteAuthenticityPrivateAlphaCase",
        "summary": "Delete a private alpha case",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Deleted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/finalise": {
      "post": {
        "operationId": "finaliseAuthenticityPrivateAlphaCase",
        "summary": "Finalize a private alpha image upload",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"202": {"description": "Queued for analysis.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "400": {"description": "Invalid bytes or hash.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "409": {"description": "Expired or already finalized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/feedback": {
      "post": {
        "operationId": "submitAuthenticityPrivateAlphaFeedback",
        "summary": "Submit private alpha feedback",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaFeedback"}}}},
        "responses": {"202": {"description": "Feedback accepted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/review": {
      "post": {
        "operationId": "requestAuthenticityPrivateAlphaReview",
        "summary": "Request private alpha review",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaFeedback"}}}},
        "responses": {"202": {"description": "Review request accepted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/cancel": {
      "post": {
        "operationId": "cancelAuthenticityPrivateAlphaCase",
        "summary": "Cancel private alpha processing",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Cancelled.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/advice": {
      "post": {
        "operationId": "requestAuthenticityPrivateAlphaAdvice",
        "summary": "Request one bounded GPT-OSS explanation",
        "description": "Uses persisted evidence only. It cannot rerun SAFE, certify authorship, or change publication/reputation state.",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"202": {"description": "Advice queued.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "409": {"description": "No eligible evidence or attempt consumed.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/authenticity/alpha/cases/{caseId}/image": {
      "get": {
        "operationId": "getAuthenticityPrivateAlphaImage",
        "summary": "Get a private alpha image",
        "tags": ["AuthenticityPrivateAlpha"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Original quarantined image bytes.", "content": {"image/png": {}, "image/jpeg": {}}}, "404": {"description": "Unavailable or not authorized.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/admin/authenticity/alpha/cases": {
      "get": {
        "operationId": "listAdminAuthenticityPrivateAlphaCases",
        "summary": "List private alpha cases for authorized administrators",
        "tags": ["Admin"],
        "security": [{"bearerAuth": []}],
        "responses": {"200": {"description": "Audited administrator diagnostics.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAdminCaseList"}}}}, "403": {"description": "Administrator role required.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/admin/authenticity/alpha/cases/{caseId}": {
      "get": {
        "operationId": "getAdminAuthenticityPrivateAlphaCase",
        "summary": "Read private alpha diagnostics",
        "tags": ["Admin"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Audited administrator diagnostics.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAdminCase"}}}}, "403": {"description": "Administrator role required.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "404": {"description": "Case not found.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/admin/authenticity/alpha/cases/{caseId}/image": {
      "get": {
        "operationId": "getAdminAuthenticityPrivateAlphaImage",
        "summary": "Read a quarantined private alpha image",
        "tags": ["Admin"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "responses": {"200": {"description": "Original quarantined image bytes.", "content": {"image/png": {}, "image/jpeg": {}}}, "403": {"description": "Administrator role required.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "404": {"description": "Image not found.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/admin/authenticity/alpha/cases/{caseId}/review": {
      "post": {
        "operationId": "reviewAdminAuthenticityPrivateAlphaCase",
        "summary": "Record an administrator private alpha review",
        "tags": ["Admin"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaFeedback"}}}},
        "responses": {"202": {"description": "Review recorded.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "403": {"description": "Administrator role required.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    },
    "/admin/authenticity/alpha/cases/{caseId}/advice": {
      "post": {
        "operationId": "requestAdminAuthenticityPrivateAlphaAdvice",
        "summary": "Request one bounded private alpha explanation",
        "description": "The current administrator role cannot create a measured advice reservation. This route returns alpha_owner_advice_required; the owner requests advice through the authenticated owner route.",
        "tags": ["Admin"],
        "security": [{"bearerAuth": []}],
        "parameters": [{"$ref": "#/components/parameters/AlphaCaseId"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaFeedback"}}}},
        "responses": {"202": {"description": "Advice queued.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaAction"}}}}, "403": {"description": "Administrator role required.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}, "409": {"description": "Advice is unavailable or already consumed.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlphaError"}}}}}
      }
    }
  },
  "components": {
    "parameters": {"AlphaCaseId": {"name": "caseId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}},
    "schemas": {
      "AlphaCreateRequest": {"type": "object", "additionalProperties": false, "required": ["contentKind", "consentVersion", "trainingConsent"], "properties": {"contentKind": {"type": "string", "enum": ["text", "image", "text_image"]}, "text": {"type": "string", "maxLength": 20000}, "contentType": {"type": "string", "enum": ["image/png", "image/jpeg"]}, "size": {"type": "integer", "minimum": 1, "maximum": 10485760}, "checksumSha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "observerRequested": {"type": "boolean", "default": false}, "explanationRequested": {"type": "boolean", "default": false}, "consentVersion": {"type": "string", "enum": ["lythaus-authenticity-private-alpha-v0.1.0"]}, "trainingConsent": {"type": "boolean", "enum": [false]}}},
      "AlphaCreateResponse": {"type": "object", "additionalProperties": false, "required": ["caseId", "status"], "properties": {"caseId": {"type": "string", "format": "uuid"}, "status": {"type": "string"}, "uploadUrl": {"type": "string", "format": "uri"}, "expiresAt": {"type": "string", "format": "date-time"}, "contentType": {"type": "string"}}},
      "AlphaComponent": {"type": "object", "additionalProperties": false, "required": ["execution", "interpretation", "requested"], "properties": {"execution": {"type": "string", "enum": ["not_requested", "queued", "running", "completed", "skipped", "unsupported", "failed", "timed_out"]}, "interpretation": {"type": "string", "enum": ["not_requested", "available", "inconclusive", "unavailable"]}, "requested": {"type": "boolean"}, "reason": {"type": "string"}}},
      "AlphaCase": {"type": "object", "additionalProperties": false, "required": ["schemaVersion", "caseId", "contentKind", "status", "finding", "interpretation", "execution", "publicationEligible", "rewardsEligible"], "properties": {"schemaVersion": {"type": "string"}, "caseId": {"type": "string", "format": "uuid"}, "contentKind": {"type": "string", "enum": ["text", "image", "text_image"]}, "status": {"type": "string"}, "createdAt": {"type": "string", "format": "date-time"}, "updatedAt": {"type": "string", "format": "date-time"}, "expiresAt": {"type": "string", "format": "date-time"}, "reviewState": {"type": "string"}, "finding": {"type": "string", "enum": ["SYNTHETIC_LIKE_EVIDENCE", "NO_POSITIVE_SAFE_EVIDENCE", "INCONCLUSIVE", "UNAVAILABLE"]}, "interpretation": {"type": "string", "enum": ["not_requested", "available", "inconclusive", "unavailable"]}, "explanation": {"type": "string"}, "execution": {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/AlphaComponent"}}, "observer": {"type": "object", "additionalProperties": true}, "adviserStatus": {"type": "string"}, "limitations": {"type": "array", "items": {"type": "string"}}, "versions": {"type": "object", "additionalProperties": {"type": "string", "nullable": true}}, "hasText": {"type": "boolean"}, "hasImage": {"type": "boolean"}, "publicationEligible": {"type": "boolean", "enum": [false]}, "rewardsEligible": {"type": "boolean", "enum": [false]}, "reviews": {"type": "array", "items": {"$ref": "#/components/schemas/AlphaReview"}}}},
      "AlphaCaseList": {"type": "object", "additionalProperties": false, "required": ["items"], "properties": {"items": {"type": "array", "maxItems": 50, "items": {"$ref": "#/components/schemas/AlphaCase"}}}},
      "AlphaReview": {"type": "object", "additionalProperties": false, "required": ["id", "message", "policyVersion", "createdAt"], "properties": {"id": {"type": "string", "format": "uuid"}, "message": {"type": "string"}, "policyVersion": {"type": "string"}, "createdAt": {"type": "string", "format": "date-time"}}},
      "AlphaAction": {"type": "object", "additionalProperties": false, "properties": {"caseId": {"type": "string", "format": "uuid"}, "status": {"type": "string"}, "accepted": {"type": "boolean"}, "purgeStatus": {"type": "string", "enum": ["completed", "pending", "blocked"]}, "adviser": {"type": "string", "enum": ["GPT_OSS_PRIVATE_ALPHA_EXPLAINER"]}, "publicationEligible": {"type": "boolean", "enum": [false]}, "rewardsEligible": {"type": "boolean", "enum": [false]}}},
      "AlphaFeedback": {"type": "object", "additionalProperties": false, "required": ["message"], "properties": {"message": {"type": "string", "minLength": 1, "maxLength": 2000}}},
      "AlphaError": {"type": "object", "additionalProperties": false, "required": ["error"], "properties": {"error": {"type": "string"}}}
      ,"AlphaAdminCase": {"type": "object", "additionalProperties": true, "allOf": [{"$ref": "#/components/schemas/AlphaCase"}], "properties": {"diagnostics": {"type": "object", "additionalProperties": true}, "feedback": {"type": "array", "items": {"$ref": "#/components/schemas/AlphaReview"}}}}
      ,"AlphaAdminCaseList": {"type": "object", "additionalProperties": false, "required": ["items"], "properties": {"items": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/AlphaAdminCase"}}}}
    }
  }
}
