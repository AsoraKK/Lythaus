    OwnerNoteRequest: { type: object, additionalProperties: false, required: [expectedRevision, text], properties: { expectedRevision: { type: integer, minimum: 1 }, text: { type: string, minLength: 1 } } }
    OwnerEvidenceRequest: { type: object, additionalProperties: false, required: [expectedRevision, type, description], properties: { expectedRevision: { type: integer, minimum: 1 }, type: { type: string }, description: { type: string, minLength: 1 }, reference: { type: string, nullable: true } } }
    OwnerDecisionRequest: { type: object, additionalProperties: false, required: [expectedRevision, state, reason, memberMessage, evidenceIds], properties: { expectedRevision: { type: integer, minimum: 1 }, state: { type: string }, reason: { type: string }, memberMessage: { type: string, minLength: 1 }, evidenceIds: { type: array, maxItems: 100, items: { type: string, format: uuid } } } }
    MemberMutationResult: { type: object, additionalProperties: false, required: [request, recordId, replayed], properties: { request: { $ref: '#/components/schemas/MemberSupportRequest' }, recordId: { type: string, format: uuid, nullable: true }, replayed: { type: boolean } } }
    OwnerMutationResult: { type: object, additionalProperties: false, required: [request, recordId, replayed], properties: { request: { $ref: '#/components/schemas/OwnerSupportRequest' }, recordId: { type: string, format: uuid, nullable: true }, replayed: { type: boolean } } }
