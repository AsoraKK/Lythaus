    PrivateEvidence: { type: object, additionalProperties: false, required: [id, type, description, reference, revision, createdAt], properties: { id: { type: string, format: uuid }, type: { type: string }, description: { type: string }, reference: { type: string, nullable: true }, revision: { type: integer }, createdAt: { type: string, format: date-time } } }
    PrivateDecision: { type: object, additionalProperties: false, required: [id, fromState, toState, reason, evidenceIds, policyVersion, revision, createdAt], properties: { id: { type: string, format: uuid }, fromState: { type: string }, toState: { type: string }, reason: { type: string }, evidenceIds: { type: array, items: { type: string, format: uuid } }, policyVersion: { type: string }, revision: { type: integer }, createdAt: { type: string, format: date-time } } }
    OwnerPrivateRecords: { type: object, additionalProperties: false, required: [notes, nextNoteCursor, evidence, nextEvidenceCursor, decisions, nextDecisionCursor], properties: { notes: { type: array, items: { $ref: '#/components/schemas/PrivateNote' } }, nextNoteCursor: { type: integer, nullable: true }, evidence: { type: array, items: { $ref: '#/components/schemas/PrivateEvidence' } }, nextEvidenceCursor: { type: integer, nullable: true }, decisions: { type: array, items: { $ref: '#/components/schemas/PrivateDecision' } }, nextDecisionCursor: { type: integer, nullable: true } } }
    OwnerDetail: { type: object, additionalProperties: false, required: [request, messages, nextMessageCursor, private], properties: { request: { $ref: '#/components/schemas/OwnerSupportRequest' }, messages: { type: array, items: { $ref: '#/components/schemas/PublicMessage' } }, nextMessageCursor: { type: integer, nullable: true }, private: { $ref: '#/components/schemas/OwnerPrivateRecords' } } }
