paths:
  /support/options:
    servers: [{ url: https://api.lythaus.co/api }]
    get:
      operationId: supportFeedbackOptions
      summary: Read support form policy
      description: Authenticated member support options. The feature is default-off; a disabled feature returns 404. All responses are private and no-store.
      tags: [SupportFeedback]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Member support categories and bounded limits, headers: { Cache-Control: { $ref: '#/components/headers/SupportCacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SupportOptions' } } } }
        '400': { $ref: '#/components/responses/SupportBadRequest' }
        '401': { $ref: '#/components/responses/SupportUnauthorized' }
        '404': { $ref: '#/components/responses/SupportDisabledOrMissing' }
        '405': { $ref: '#/components/responses/SupportMethodNotAllowed' }
        '429': { $ref: '#/components/responses/SupportRateLimited' }
        '503': { $ref: '#/components/responses/SupportUnavailable' }
  /support/problems:
    servers: [{ url: https://api.lythaus.co/api }]
    get:
      operationId: supportProblemList
      summary: List the member's private problem reports
      tags: [SupportFeedback]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Private problem report history, headers: { Cache-Control: { $ref: '#/components/headers/SupportCacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MemberRequestPage' } } } }
        '400': { $ref: '#/components/responses/SupportBadRequest' }
        '405': { $ref: '#/components/responses/SupportMethodNotAllowed' }
        '401': { $ref: '#/components/responses/SupportUnauthorized' }
        '404': { $ref: '#/components/responses/SupportDisabledOrMissing' }
        '429': { $ref: '#/components/responses/SupportRateLimited' }
        '503': { $ref: '#/components/responses/SupportUnavailable' }
    post:
      operationId: supportProblemSubmit
      summary: Submit a private problem report
      description: Requires an Idempotency-Key. Evidence is not uploaded; only bounded request text is accepted. The report is visible to its submitter and authorized Lythaus owners.
      tags: [SupportFeedback]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemSubmission' } } } }
      responses:
        '201': { description: Report created, headers: { Cache-Control: { $ref: '#/components/headers/SupportCacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MemberMutationResult' } } } }
        '200': { description: Matching idempotent replay, headers: { Cache-Control: { $ref: '#/components/headers/SupportCacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MemberMutationResult' } } } }
        '400': { $ref: '#/components/responses/SupportBadRequest' }
        '405': { $ref: '#/components/responses/SupportMethodNotAllowed' }
        '401': { $ref: '#/components/responses/SupportUnauthorized' }
        '404': { $ref: '#/components/responses/SupportDisabledOrMissing' }
        '409': { $ref: '#/components/responses/SupportConflict' }
        '413': { $ref: '#/components/responses/SupportTooLarge' }
        '415': { $ref: '#/components/responses/SupportUnsupportedMedia' }
        '429': { $ref: '#/components/responses/SupportRateLimited' }
        '503': { $ref: '#/components/responses/SupportUnavailable' }
  /support/problems/{requestId}:
    servers: [{ url: https://api.lythaus.co/api }]
    get:
      operationId: supportProblemDetail
      summary: Read a private problem report and public messages
      tags: [SupportFeedback]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/MessageBefore' }]
      responses:
        '200': { description: Request and public conversation visible only to its submitter, headers: { Cache-Control: { $ref: '#/components/headers/SupportCacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MemberDetail' } } } }
        '400': { $ref: '#/components/responses/SupportBadRequest' }
        '401': { $ref: '#/components/responses/SupportUnauthorized' }
        '404': { $ref: '#/components/responses/SupportNotFoundOrDisabled' }
        '405': { $ref: '#/components/responses/SupportMethodNotAllowed' }
        '429': { $ref: '#/components/responses/SupportRateLimited' }
        '503': { $ref: '#/components/responses/SupportUnavailable' }
  /support/problems/{requestId}/messages:
    servers: [{ url: https://api.lythaus.co/api }]
    post:
      operationId: supportProblemReply
      summary: Reply to a private problem report
      tags: [SupportFeedback]
      security: [{ bearerAuth: [] }]
