        '400': { $ref: '#/components/responses/SupportBadRequest' }
        '401': { $ref: '#/components/responses/SupportUnauthorized' }
        '404': { $ref: '#/components/responses/SupportNotFoundOrDisabled' }
        '405': { $ref: '#/components/responses/SupportMethodNotAllowed' }
        '409': { $ref: '#/components/responses/SupportConflict' }
