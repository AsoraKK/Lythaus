      "get": {
        "operationId": "passkeyCapabilities",
        "summary": "Check optional passkey availability",
        "description": "Disabled by default. Returns enabled:false without schema access when the feature flag is off. Browser support is checked locally.",
        "tags": [
          "Passkeys"
        ],
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/PasskeyOrigin"
          },
          {
            "$ref": "#/components/parameters/PasskeyTransport"
          }
        ],
        "responses": {
          "503": { "$ref": "#/components/responses/PasskeyUnavailable" },
          "200": {
            "description": "Successful optional passkey operation; Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyCapability"
                }
              }
            }
          },
          "400": {
            "description": "Disabled feature or invalid input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "401": {
            "description": "Invalid credential, challenge, password, ownership or current account/session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "403": {
            "description": "Origin or browser transport is not authorized.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "429": {
            "description": "Request or account rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          }
        }
      }
    },
    "/auth/passkeys/register/options": {
      "post": {
        "operationId": "passkeyRegisterOptions",
        "summary": "Start passkey register",
        "description": "Five-minute, single-use challenge with exact origin and RP binding. Enrollment requires current password and a verified email account. Authenticated ceremonies are bound to the current access token and account token version. Anonymous login sets an HttpOnly Secure SameSite=Strict ceremony binding cookie. User verification is required; enrollment uses discoverable credentials and attestation:none.",
        "tags": [
          "Passkeys"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/PasskeyOrigin"
          },
          {
            "$ref": "#/components/parameters/PasskeyTransport"
          }
        ],
        "responses": {
          "413": { "$ref": "#/components/responses/PasskeyTooLarge" },
          "503": { "$ref": "#/components/responses/PasskeyUnavailable" },
          "200": {
            "description": "Successful optional passkey operation; Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyChallenge"
                }
              }
            }
          },
          "400": {
            "description": "Disabled feature or invalid input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "401": {
            "description": "Invalid credential, challenge, password, ownership or current account/session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "403": {
            "description": "Origin or browser transport is not authorized.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          },
          "429": {
            "description": "Request or account rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PasskeyError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PasskeyRegisterOptionsRequest"
              }
            }
          }
        }
      }
    },
    "/auth/passkeys/register/verify": {
      "post": {
        "operationId": "passkeyRegisterVerify",
        "summary": "Verify passkey register",
        "description": "Verifies the SimpleWebAuthn credential response, exact challenge/origin/RP, user verification and ownership. Challenges are consumed atomically before cryptographic verification, including failed attempts. Login requires the ceremony binding cookie and returns a standard session with the refresh token only in an HttpOnly cookie. Maintenance records at most one shared zero-point evidence event per owner/policy/UTC month. No reward weights are activated.",
        "tags": [
          "Passkeys"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/PasskeyOrigin"
