  "components": {
    "responses": {
      "PasskeyTooLarge": {
        "description": "Request body exceeds the 32 KiB ceremony/management limit (request_too_large).",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/PasskeyError" }
          }
        }
      },
      "PasskeyUnavailable": {
        "description": "Passkey or session-issuance configuration is unavailable (passkeys_not_configured or authentication_not_configured).",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/PasskeyError" }
          }
        }
      }
    },
    "parameters": {
      "PasskeyOrigin": {
        "in": "header",
        "name": "Origin",
        "required": true,
        "description": "Exact HTTPS PWA origin authorized by PASSKEY_ALLOWED_ORIGINS and CORS_ALLOWED_ORIGINS.",
        "schema": {
          "type": "string",
          "format": "uri"
        }
      },
      "PasskeyTransport": {
        "in": "header",
        "name": "X-Lythaus-Auth-Transport",
        "required": true,
        "schema": {
          "type": "string",
          "enum": [
            "cookie-v1"
          ]
        }
      },
      "PasskeyId": {
        "in": "path",
        "name": "passkeyId",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
      "PasskeyCapability": {
        "type": "object",
        "required": [
          "enabled"
        ],
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          }
        }
      },
      "PasskeyName": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64,
        "pattern": "^[^\\x00-\\x1F\\x7F]+$"
      },
      "PasskeyPassword": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "writeOnly": true
      },
      "PasskeyRegisterOptionsRequest": {
        "type": "object",
        "required": [
          "name",
          "password"
        ],
        "additionalProperties": false,
        "properties": {
          "name": {
            "$ref": "#/components/schemas/PasskeyName"
          },
          "password": {
