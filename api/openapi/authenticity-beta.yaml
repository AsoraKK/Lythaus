  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "cloudflareAccess": {
        "type": "apiKey",
        "in": "header",
        "name": "Cf-Access-Jwt-Assertion"
      }
    },
    "schemas": {
      "BetaError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "BetaFeedback": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "BetaSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "contentType",
          "size",
          "checksumSha256",
          "consentVersion",
          "trainingConsent"
        ],
        "properties": {
          "contentType": {
            "type": "string",
            "enum": [
              "image/png",
              "image/jpeg"
            ]
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10485760
          },
          "checksumSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "consentVersion": {
            "type": "string",
            "enum": [
              "lythaus-authenticity-beta-v0.1.0"
            ]
          },
          "trainingConsent": {
            "type": "boolean",
            "enum": [
              false
            ]
          }
        }
      },
      "BetaUpload": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "caseId",
          "uploadUrl",
          "expiresAt",
          "status",
          "contentType"
        ],
        "properties": {
          "caseId": {
            "type": "string",
            "format": "uuid"
          },
          "uploadUrl": {
            "type": "string",
            "format": "uri"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "uploading"
            ]
          },
          "contentType": {
            "type": "string"
          }
        }
      },
      "BetaCase": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "caseId",
          "status",
          "createdAt",
          "updatedAt",
          "expiresAt",
          "reviewState",
          "finding",
          "explanation",
          "advisoryStatus",
          "limitations",
          "versions",
          "publicationEligible",
          "rewardsEligible"
        ],
        "properties": {
          "schemaVersion": {
            "type": "string"
          },
          "caseId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "uploading",
              "queued",
              "analyzing",
              "complete",
              "inconclusive",
              "unsupported",
              "failed",
              "paused",
              "safety_review",
              "safety_blocked",
              "cancelled",
              "expired",
              "deleted"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "reviewState": {
            "type": "string",
            "enum": [
              "none",
              "requested",
              "reviewed"
            ]
          },
          "finding": {
            "type": "string",
            "enum": [
              "SYNTHETIC_LIKE_EVIDENCE",
              "NO_POSITIVE_SAFE_EVIDENCE",
              "INCONCLUSIVE",
              "UNAVAILABLE"
            ]
          },
          "explanation": {
            "type": "string"
          },
          "advisoryStatus": {
            "type": "string"
          },
          "limitations": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "versions": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "publicationEligible": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "rewardsEligible": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "reviews": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BetaReview"
            }
          }
        }
      },
      "BetaCaseList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/BetaCase"
            }
          }
        }
      },
      "BetaReview": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "message",
          "policyVersion",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "message": {
            "type": "string"
          },
          "policyVersion": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "BetaAdminCase": {
        "type": "object",
        "properties": {
          "schemaVersion": {
            "type": "string"
          },
          "caseId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "uploading",
              "queued",
              "analyzing",
              "complete",
              "inconclusive",
              "unsupported",
              "failed",
              "paused",
              "safety_review",
              "safety_blocked",
              "cancelled",
              "expired",
              "deleted"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "reviewState": {
            "type": "string",
            "enum": [
              "none",
              "requested",
              "reviewed"
            ]
          },
          "finding": {
            "type": "string",
            "enum": [
              "SYNTHETIC_LIKE_EVIDENCE",
              "NO_POSITIVE_SAFE_EVIDENCE",
              "INCONCLUSIVE",
              "UNAVAILABLE"
            ]
          },
          "explanation": {
            "type": "string"
          },
          "advisoryStatus": {
            "type": "string"
          },
          "limitations": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "versions": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "publicationEligible": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "rewardsEligible": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "reviews": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BetaReview"
            }
          },
          "feedback": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "diagnostics": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "BetaActionResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "caseId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string"
          },
          "accepted": {
            "type": "boolean"
          },
          "publicationEligible": {
            "type": "boolean",
            "enum": [
              false
            ]
          }
        }
      }
    }
  }
