      summary: Submit one immutable reviewer vote
      description: Only an independently assigned trained reviewer may vote. A vote is locked and cannot be changed.
      tags: [Appeals]
      security:
        - bearerAuth: []
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/requiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceAppealVoteRequest'
            examples:
              overturn:
                summary: Vote to overturn the appealed decision
                value:
                  decision: overturn
      responses:
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '200':
          description: Previously recorded idempotent vote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceAppealVoteResponse'
              examples:
                recorded:
                  summary: Immutable reviewer vote recorded
                  value:
                    voteId: 018b27d4-8a9c-7d9e-bf0e-9bf93c3fce43
                    appealId: 018b27d4-7f9b-7d9e-bf0e-9bf93c3fce43
                    decision: overturn
                    locked: true
        '201':
          description: Vote recorded and locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceAppealVoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
