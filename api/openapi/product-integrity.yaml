components:
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor returned by the preceding page.
      schema:
        type: string
        minLength: 1
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    limit100:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional caller-generated replay key. Completed requests, including safe validation failures, replay the stored response. A fresh in-flight duplicate returns `idempotency_in_progress`; an aged or ambiguous claim returns `idempotency_outcome_unknown` and is never automatically re-executed. If omitted, the mutation executes without replay protection.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    requiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required caller-generated replay key. Completed requests, including safe validation failures, replay the stored response. A fresh in-flight duplicate returns `idempotency_in_progress`; an aged or ambiguous claim returns `idempotency_outcome_unknown` and is never automatically re-executed.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
  responses:
    BadRequest:
      description: The request could not be validated or a domain invariant prevented it.
      content:
        application/json:
          schema:
              $ref: '#/components/schemas/ApiError'
    IdempotencyConflict:
      description: The idempotency key conflicts with another actor or payload, is still processing, or has an ambiguous outcome that requires reconciliation and must not be automatically retried under a new execution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            keyConflict:
              value: { error: idempotency_key_conflict, correlationId: 01K1LYTHAUSIDEMPOTENCY0001 }
            inProgress:
              value: { error: idempotency_in_progress, correlationId: 01K1LYTHAUSIDEMPOTENCY0002 }
            outcomeUnknown:
              value: { error: idempotency_outcome_unknown, correlationId: 01K1LYTHAUSIDEMPOTENCY0003 }
    Unauthorized:
      description: Authentication or required Cloudflare Access authorization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated principal lacks an entitlement or governance role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested resource is not available to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The requested state transition conflicts with the record's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RequestTooLarge:
      description: The JSON request body exceeds the route limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: The waitlist administration service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SafetyLimited:
      description: A stable rate or neutral anti-abuse limit was reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafetyLimitError'
  schemas:
    ApiError:
      type: object
      required: [error, correlationId]
      properties:
        error:
          type: string
        correlationId:
          type: string
    SafetyLimitError:
      type: object
      description: Stable, neutral anti-abuse limit response. No user-supplied content or detector result is disclosed.
      required: [error, correlationId]
      properties:
        error:
          type: string
          enum: [rate_limit_exceeded, post_daily_limit_reached, comment_daily_limit_reached, reaction_daily_limit_reached, appeal_daily_limit_reached, flag_daily_limit_reached, media_daily_limit_reached, relationship_change_limit_reached, export_cooldown_active, privacy_request_active]
        correlationId:
          type: string
    DeclaredCreationMode:
      type: string
      enum: [human, ai_assisted]
      description: Public author disclosure. AI-generated public content is not accepted.
    PublicAuthorshipLabel:
      type: string
      enum: [Human-authored, AI-assisted]
    ModerationState:
      type: string
      enum: [under_review, allowed, blocked]
    CursorPage:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null when exhausted.

    ReactionCounts:
      type: object
      description: Current reaction totals by supported reaction type.
      additionalProperties: false
      properties:
        like: { type: integer, minimum: 0, default: 0 }
        insightful: { type: integer, minimum: 0, default: 0 }
        support: { type: integer, minimum: 0, default: 0 }

    FeedItem:
      type: object
      required: [id, authorId, body, publishedAt, publicLabel, reactionCounts, viewerReaction]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        publishedAt: { type: string, format: date-time }
        publicLabel: { $ref: '#/components/schemas/PublicAuthorshipLabel' }
        reactionCounts: { $ref: '#/components/schemas/ReactionCounts' }
        viewerReaction: { type: string, enum: [like, insightful, support], nullable: true }
        topic: { type: string, nullable: true }
        regionCode: { type: string, nullable: true }
    PersonalFeedItem:
      type: object
      required: [id, authorId, body, declaredCreationMode, visibility, moderationState, publicLabel, reactionCounts, viewerReaction, createdAt]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
        visibility: { type: string, enum: [public, followers, private] }
        moderationState: { $ref: '#/components/schemas/ModerationState' }
        publicLabel: { $ref: '#/components/schemas/PublicAuthorshipLabel' }
        reactionCounts: { $ref: '#/components/schemas/ReactionCounts' }
        viewerReaction: { type: string, enum: [like, insightful, support], nullable: true }
        geoScope: { type: string, enum: [global, country, province, municipality, community, none], nullable: true }
        placeId: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        source: { type: string, nullable: true }
        explanationBasis: { type: string, nullable: true }
    PersonalFeedPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PersonalFeedItem' }
    DiscoveryFeedPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/FeedItem' }
    NewsBoardItem:
      type: object
      description: The Worker retains a redundant legacy `published_at` field for compatibility; clients consume the canonical `publishedAt` field.
      required: [id, title, publishedAt, reactionCounts, viewerReaction]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        post_id: { type: string, format: uuid, nullable: true }
        body: { type: string, nullable: true }
        authorId: { type: string, format: uuid, nullable: true }
        publishedAt: { type: string, format: date-time }
        reactionCounts: { $ref: '#/components/schemas/ReactionCounts' }
        viewerReaction: { type: string, enum: [like, insightful, support], nullable: true }
    NewsBoardFeedPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [access, items]
          properties:
            access: { type: string, enum: [full] }
            items:
              type: array
              items: { $ref: '#/components/schemas/NewsBoardItem' }

    CustomFeedRule:
      type: object
      additionalProperties: false
      properties:
        topic: { type: string, minLength: 1, maxLength: 80, pattern: '^[\\p{L}\\p{N} _.-]{1,80}$' }
        regionCode: { type: string, minLength: 2, maxLength: 20, pattern: '^[A-Z0-9-]{2,20}$' }
      anyOf:
        - required: [topic]
        - required: [regionCode]
    CustomFeed:
      type: object
      required: [id, name, rules]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CustomFeedRule' }
        created_at: { type: string, format: date-time }
    CustomFeedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomFeed' }
    CustomFeedCreateRequest:
      type: object
      additionalProperties: false
      required: [name, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CustomFeedRule' }
    CustomFeedUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CustomFeedRule' }
    CustomFeedDeleteResponse:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean, enum: [true] }

    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [body, declaredCreationMode]
      description: |
        The declaration is a deterministic public authorship disclosure. AI-generated
        content is rejected. For ai_assisted, the normalized body must contain fewer
        than 250 user-perceived Unicode characters (grapheme clusters).
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        parentId: { type: string, format: uuid }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
      x-lythaus-ai-assisted-max-graphemes-exclusive: 250
    CommentUpdateRequest:
      type: object
      additionalProperties: false
      required: [body]
      description: Body-only edits preserve the stored declaration; an explicit declaration may replace it, but generated public content remains blocked.
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
    Comment:
      type: object
      required: [id, authorId, body, depth, moderationState, deleted, createdAt, declaredCreationMode]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        body: { type: string, nullable: true }
        depth: { type: integer, enum: [0, 1] }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
        moderationState: { $ref: '#/components/schemas/ModerationState' }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Comment' }
    CommentSubmission:
      type: object
      required: [id, commentId, postId, body, depth, declaredCreationMode, moderationState]
      description: A comment or reply is accepted for moderation and is not immediately public.
      properties:
        id: { type: string, format: uuid }
        commentId: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        body: { type: string }
        depth: { type: integer, enum: [0, 1] }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
        moderationState: { type: string, enum: [under_review] }
    CommentUpdateResponse:
      type: object
      required: [id, body, declaredCreationMode, moderationState]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        declaredCreationMode: { $ref: '#/components/schemas/DeclaredCreationMode' }
        moderationState: { type: string, enum: [under_review] }
    CommentDeleteResponse:
      type: object
      required: [commentId, deleted]
      properties:
        commentId: { type: string, format: uuid }
        deleted: { type: boolean }

    ProductIntegrityProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 160 }
        bio: { type: string, maxLength: 2000 }
        trustPassportVisibility: { type: string, enum: [public_expanded, public_minimal, private] }
        accountabilityName:
          type: string
          minLength: 2
          maxLength: 160
          nullable: true
          description: Private encrypted accountability name. It is never returned by profile or activity APIs.
    ProductIntegrityPrivateProfileUser:
      type: object
      required: [id, displayName, reputationLevel, trustPassportVisibility, subscriptionTier, accountabilityIdentityDeclared]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        handle: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        trustPassportVisibility: { type: string, enum: [public_expanded, public_minimal, private] }
        reputationLevel: { type: integer, minimum: 0, maximum: 5 }
        reputation:
          type: object
          additionalProperties: true
        journalistVerified: { type: boolean }
        badges:
          type: array
          items: { type: object, additionalProperties: true }
        subscriptionTier: { type: string, enum: [free, premium, black] }
        accountabilityIdentityDeclared:
          type: boolean
          description: Whether a private accountability name is stored. This is not a verification claim and never discloses the name.
    ProductIntegrityPrivateProfileResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/ProductIntegrityPrivateProfileUser' }

    ReactionRequest:
      type: object
      additionalProperties: false
      required: [reactionType]
      properties:
        reactionType: { type: string, enum: [like, insightful, support] }
    ReactionResponse:
      type: object
      required: [postId, reactionType, changed]
      properties:
        postId: { type: string, format: uuid }
        reactionType: { type: string, enum: [like, insightful, support] }
        changed: { type: boolean }
    ReactionDeleteResponse:
      type: object
      required: [postId, removed]
      properties:
        postId: { type: string, format: uuid }
        removed: { type: boolean }
    FollowCreateRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    FollowChange:
      type: object
      required: [following]
      properties:
        following: { type: string, format: uuid }
        created: { type: boolean }
        removed: { type: boolean }
    FlagCreateRequest:
      type: object
      additionalProperties: false
      required: [contentType, contentId, reasonCode]
      properties:
        contentType: { type: string, minLength: 1, maxLength: 80 }
        contentId: { type: string, minLength: 1, maxLength: 128 }
        reasonCode: { type: string, minLength: 1, maxLength: 120 }
    FlagCreateResponse:
      type: object
      required: [flagId]
      properties:
        flagId: { type: string, format: uuid }
    MediaUploadSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [contentType, size, checksumSha256]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        checksumSha256: { type: string, pattern: '^[0-9A-Fa-f]{64}$' }
    MediaUploadSessionCreated:
      type: object
      required: [uploadSessionId, objectKey, putUrl, expiresAt, contentType, maxBytes, checksumSha256]
      properties:
        uploadSessionId: { type: string, format: uuid }
        objectKey: { type: string }
        putUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        maxBytes: { type: integer, maximum: 10485760 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    MediaUploadFinaliseResponse:
      type: object
      required: [uploadSessionId, status, eventId]
      properties:
        uploadSessionId: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        eventId: { type: string, format: uuid }
    FollowStatus:
      type: object
      required: [userId, following, followedBy, blocked]
      properties:
        userId: { type: string, format: uuid }
        following: { type: boolean }
        followedBy: { type: boolean }
        blocked: { type: boolean }
    TargetUserRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    RelationChange:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        blocked: { type: boolean }
        muted: { type: boolean }
    RelationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [userId, createdAt]
            properties:
              userId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    BookmarkCreateRequest:
      type: object
      additionalProperties: false
      required: [postId]
      properties:
        postId: { type: string, format: uuid }
    BookmarkChange:
      type: object
      required: [postId, bookmarked]
      properties:
        postId: { type: string, format: uuid }
        bookmarked: { type: boolean }
    BookmarkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [postId, createdAt]
            properties:
              postId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }

    ReputationPillars:
      type: object
      required: [accountability, contribution, conduct, sourcing, authenticity, reviewReliability]
      properties:
        accountability: { type: number }
        contribution: { type: number }
        conduct: { type: number }
        sourcing: { type: number }
        authenticity: { type: number }
        reviewReliability: { type: number }
    ReputationPublicV2:
      type: object
      required: [userId, level, reputationLevel, levelName, reputationStatus, reputationBand, policyVersion]
      properties:
        userId: { type: string, format: uuid }
        level: { type: integer, minimum: 0, maximum: 5 }
        reputationLevel: { type: integer, minimum: 0, maximum: 5 }
        levelName: { type: string }
        reputationStatus: { type: string, enum: [active, restricted, suspended, under_investigation] }
        reputationBand: { type: string, enum: [new, accountable, trusted, established] }
        policyVersion: { type: string, example: reputation-v2.0.0 }
    ReputationPrivateV2:
      allOf:
        - $ref: '#/components/schemas/ReputationPublicV2'
        - type: object
          required: [pillars, promotionBlockers, evaluatedAt]
          properties:
            pillars: { $ref: '#/components/schemas/ReputationPillars' }
            promotionBlockers:
              type: array
              items: { type: string }
            evaluatedAt: { type: string, format: date-time, nullable: true }
    ReputationLedgerEvent:
      type: object
      required: [id, eventType, impact, status, policyVersion, effectiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        contentId: { type: string, format: uuid, nullable: true }
        eventType: { type: string }
        pillar: { type: string, enum: [accountability, contribution, conduct, sourcing, authenticity, reviewReliability], nullable: true }
        impact: { type: string }
        status: { type: string, enum: [effective, withheld, reversed, expired] }
        explanationCode: { type: string, nullable: true }
        policyVersion: { type: string }
        appealId: { type: string, format: uuid, nullable: true }
        effectiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ReputationLedgerPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items, entries]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReputationLedgerEvent' } }
            entries: { type: array, items: { $ref: '#/components/schemas/ReputationLedgerEvent' } }

    ActivityEvent:
      type: object
      required: [id, userId, eventType, category, source, sourceEventId, correlationId, title, explanation, result, policyVersion, reputationEffect, appealable, retentionClass, metadata, retentionDays, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid, nullable: true }
        eventType: { type: string }
        category: { type: string, enum: [account, content, social, reputation, moderation, appeals, privacy, rewards] }
        source: { type: string, enum: [public_api, admin_api, jobs, workflow, system] }
        sourceEventId: { type: string, format: uuid }
        correlationId: { type: string }
        title: { type: string }
        explanation: { type: string }
        result: { type: string, enum: [succeeded, failed, withheld, reversed, pending] }
        reasonCode: { type: string, nullable: true }
        policyVersion: { type: string }
        objectType: { type: string, nullable: true }
        objectId: { type: string, format: uuid, nullable: true }
        reputationEffect: { type: string, enum: [none, positive, negative, reversed, withheld] }
        appealable: { type: boolean }
        retentionClass: { type: string, enum: [ordinary, security, moderation] }
        metadata: { type: object, additionalProperties: true }
        retentionDays: { type: integer, enum: [90, 365, 730] }
        createdAt: { type: string, format: date-time }
    ActivityPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items, entries]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
            entries: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }

    AppealCreateRequest:
      type: object
      additionalProperties: false
      required: [caseId, statement]
      description: The caller may appeal a resolved case for their post or comment, or an account case where the case content ID is the caller's user ID.
      properties:
        caseId: { type: string, format: uuid }
        statement: { type: string, minLength: 1, maxLength: 2000 }
    AppealCreateResponse:
      type: object
      required: [appealId, state, riskClass, policyVersion]
      properties:
        appealId: { type: string, format: uuid }
        state: { type: string, enum: [open] }
        riskClass: { type: string, enum: [standard, high] }
        policyVersion: { type: string, example: appeals-v1.0.0 }
    AppealOutcome:
      type: object
      required: [status, completedReviewers, totalWeight, overturnWeight, upholdWeight, winningShare, requiredAdjudicators, policyVersion]
      properties:
        status: { type: string, enum: [pending_quorum, no_consensus, pending_adjudication, adjudication_disagreement, resolved] }
        reviewerPanelDecision: { type: string, enum: [overturn, uphold], nullable: true }
        finalDecision: { type: string, enum: [overturn, uphold], nullable: true }
        completedReviewers: { type: integer, minimum: 0, maximum: 5 }
        totalWeight: { type: integer, minimum: 0, maximum: 6 }
        overturnWeight: { type: integer, minimum: 0, maximum: 6 }
        upholdWeight: { type: integer, minimum: 0, maximum: 6 }
        winningShare: { type: number, minimum: 0, maximum: 1 }
        requiredAdjudicators: { type: integer, enum: [1, 2] }
        policyVersion: { type: string, example: appeals-v1.0.0 }
    AppealDetail:
      type: object
      required: [id, case_id, state, risk_class, policy_version, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        state: { type: string, enum: [open, resolved] }
        risk_class: { type: string, enum: [standard, high] }
        policy_version: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        reviewer_panel_decision: { type: string, enum: [overturn, uphold], nullable: true }
        final_decision: { type: string, enum: [overturn, uphold], nullable: true }
        completed_reviewers: { type: integer, nullable: true }
        outcome_state: { type: string, nullable: true }
        reviewer_assigned: { type: boolean }
        reviewer_decision: { type: string, enum: [overturn, uphold], nullable: true }
    AppealDetailResponse:
      type: object
      required: [appeal]
      properties:
        appeal: { $ref: '#/components/schemas/AppealDetail' }
    GovernanceAppealVoteRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [overturn, uphold] }
    GovernanceAppealVoteResponse:
      type: object
      required: [voteId, appealId, decision, locked]
      properties:
        voteId: { type: string, format: uuid }
        appealId: { type: string, format: uuid }
        decision: { type: string, enum: [overturn, uphold] }
        locked: { type: boolean, enum: [true] }
    AppealRecusalResponse:
      type: object
      required: [appealId, assignmentId, state]
      properties:
        appealId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        state: { type: string, enum: [recused] }
    AppealReviewerAssignments:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, appeal_id, state, assigned_at, risk_class, expires_at, policy_version]
            properties:
              id: { type: string, format: uuid }
              appeal_id: { type: string, format: uuid }
              state: { type: string, enum: [assigned, recused, voted, replaced, expired] }
              assigned_at: { type: string, format: date-time }
              risk_class: { type: string, enum: [standard, high] }
              expires_at: { type: string, format: date-time }
              policy_version: { type: string }
              decision: { type: string, enum: [overturn, uphold], nullable: true }
              locked_at: { type: string, format: date-time, nullable: true }
    AppealAdjudicationRequest:
      type: object
      additionalProperties: false
      required: [decision, reasonCode]
      properties:
        decision: { type: string, enum: [overturn, uphold] }
        reasonCode: { type: string, pattern: '^[A-Z0-9_.:-]{2,80}$' }
    AppealAdjudicationResponse:
      allOf:
        - $ref: '#/components/schemas/AppealOutcome'
        - type: object
          required: [appealId]
          properties:
            appealId: { type: string, format: uuid }
    ReviewerQualificationState:
      type: string
      enum: [none, eligible, trained, suspended]
      description: Reviewer training is a distinct governance qualification; reputation level, including L5, is insufficient on its own.
    ReviewerQualificationUpdateRequest:
      type: object
      additionalProperties: false
      required: [state, reasonCode]
      properties:
        state: { $ref: '#/components/schemas/ReviewerQualificationState' }
        reasonCode: { type: string, pattern: '^[A-Z0-9_.:-]{2,80}$' }
    ReviewerQualificationResponse:
      type: object
      required: [reviewerId, state, policyVersion]
      properties:
        reviewerId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ReviewerQualificationState' }
        policyVersion: { type: string, example: appeals-v1.0.0 }
    PendingAppealAdjudication:
      type: object
      required: [appeal_id, case_id, risk_class, policy_version, created_at, expires_at, completed_reviewers, total_weight, winning_share, required_adjudicators, outcome_state, completed_adjudicators]
      properties:
        appeal_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        risk_class: { type: string, enum: [standard, high] }
        policy_version: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        reviewer_panel_decision: { type: string, enum: [overturn, uphold], nullable: true }
        completed_reviewers: { type: integer, minimum: 0, maximum: 5 }
        total_weight: { type: integer, minimum: 0, maximum: 6 }
        winning_share: { type: number, minimum: 0, maximum: 1 }
        required_adjudicators: { type: integer, enum: [1, 2] }
        outcome_state: { type: string, enum: [pending_adjudication, adjudication_disagreement] }
        completed_adjudicators: { type: integer, minimum: 0, maximum: 2 }
    PendingAppealAdjudicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PendingAppealAdjudication' }
    ModerationAppealResolvedOutboxPayload:
      type: object
      description: Internal-only payload for the `moderation.appeal.resolved` outbox event. It has no public HTTP route.
      x-lythaus-internal-event: moderation.appeal.resolved
      required: [appealId, subjectUserId, contentId, contentType, finalDecision, riskClass]
      properties:
        appealId: { type: string, format: uuid }
        subjectUserId: { type: string, format: uuid }
        contentId: { type: string, format: uuid }
        contentType: { type: string, enum: [post, comment, account] }
        finalDecision: { type: string, enum: [overturn, uphold] }
        riskClass: { type: string, enum: [standard, high] }
    ModerationAppealVoteLockedOutboxPayload:
      type: object
      description: Internal-only payload for `moderation.appeal.vote_locked`; durable reviewer-panel outcome computation and adjudicator notifications occur downstream. It has no public HTTP route.
      x-lythaus-internal-event: moderation.appeal.vote_locked
      required: [appealId, voteId, decision]
      properties:
        appealId: { type: string, format: uuid }
        voteId: { type: string, format: uuid }
        decision: { type: string, enum: [overturn, uphold] }

    Notification:
      type: object
      required: [id, notificationType, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        notificationType: { type: string }
        entityId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items, notifications, continuationToken, totalUnread]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            continuationToken: { type: string, nullable: true }
            totalUnread: { type: integer, minimum: 0 }
    NotificationActionResponse:
      type: object
      required: [id, action]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [read, dismiss] }
    NotificationUnreadCount:
      type: object
      required: [count, unreadCount]
      properties:
        count: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
    NotificationPreferences:
      type: object
      properties:
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        repliesEnabled: { type: boolean }
        moderationEnabled: { type: boolean }
        rewardsEnabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    NotificationPreferenceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        repliesEnabled: { type: boolean }
        moderationEnabled: { type: boolean }
        rewardsEnabled: { type: boolean }
    NotificationDeviceCreate:
      type: object
      additionalProperties: false
      required: [platform, token]
      properties:
        platform: { type: string, enum: [android, ios, web] }
        token: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    NotificationDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    NotificationDeviceCreated:
      type: object
      required: [id, platform]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, web] }
    NotificationDeviceRevoked:
      type: object
      required: [id, revoked]
      properties:
        id: { type: string, format: uuid }
        revoked: { type: boolean, enum: [true] }

    AdminItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
    AdminHealth:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: object, additionalProperties: true }
    WaitlistAdminItem:
      type: object
      additionalProperties: false
      required: [id, email, status, source, createdAt, retentionHold]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        status: { type: string, enum: [waiting, invited, converted, unsubscribed] }
        source: { type: string }
        createdAt: { type: string, format: date-time }
        retentionHold:
          type: boolean
          description: Whether a retention hold prevents automatic waitlist-record purging.
    WaitlistAdminResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WaitlistAdminItem' }
        nextCursor:
          type: string
          nullable: true
        summary:
          type: object
          additionalProperties: false
          required: [totalWaiting, last7Days]
          properties:
            totalWaiting: { type: integer, minimum: 0 }
            last7Days: { type: integer, minimum: 0 }
    WaitlistStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [waiting, invited, converted, unsubscribed] }
    WaitlistStatusResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [waiting, invited, converted, unsubscribed] }
    WaitlistRetentionHoldUpdate:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
          description: Whether the retention hold is active.
    WaitlistRetentionHoldResponse:
      type: object
      additionalProperties: false
      required: [id, retentionHold]
      properties:
        id: { type: string, format: uuid }
        retentionHold: { type: boolean }
    LegalHoldCreate:
      type: object
      additionalProperties: false
      required: [subjectId, reason]
      properties:
        subjectId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    LegalHoldResponse:
      type: object
      required: [id, active]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        active: { type: boolean }
    EditorialPublicationCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        postId: { type: string, format: uuid }
    EditorialPublicationResponse:
      type: object
      required: [id, published]
      properties:
        id: { type: string, format: uuid }
        published: { type: boolean, enum: [true] }
    ModerationDecisionRequest:
      type: object
      additionalProperties: false
      required: [outcome, reasonCode]
      properties:
        outcome: { type: string, enum: [allow, block, queue] }
        reasonCode: { type: string, pattern: '^[A-Z0-9_.:-]{2,80}$' }
        publicLabel:
          type: string
          description: Public categorical label. AI-generated content cannot be allowed for publication.
          enum: [Human-authored, AI-assisted, Under review]
    ModerationDecisionResponse:
      type: object
      required: [caseId, outcome]
      properties:
        caseId: { type: string, format: uuid }
        outcome: { type: string, enum: [allow, block, queue] }
        publicLabel: { type: string, nullable: true }
    AccountStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, reasonCode]
      properties:
        status: { type: string, enum: [active, suspended, locked] }
        reasonCode: { type: string, pattern: '^[A-Z0-9_.:-]{2,80}$' }
    AccountStatusResponse:
      type: object
      required: [userId, status]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, locked] }
    AccountTierUpdate:
      type: object
      additionalProperties: false
      required: [tier, reasonCode]
      properties:
        tier: { type: string, enum: [free, premium, black] }
        reasonCode: { type: string, pattern: '^[A-Z0-9_.:-]{2,80}$' }
    AccountTierResponse:
      type: object
      required: [userId, tier]
      properties:
        userId: { type: string, format: uuid }
        tier: { type: string, enum: [free, premium, black] }
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          description: Single-use opaque email-verification token.
    EmailVerificationResponse:
      type: object
      description: Private verification result. The response contains no user or email identifier.
      required: [state]
      properties:
        state:
          type: string
          enum: [verified]
    PrivacyExportDocument:
      type: object
      description: |
        Private JSON attachment generated for the authenticated subject's completed export.
        The exported record set is versioned and intentionally has no stable envelope.
      additionalProperties: true
paths:
  /admin/health:
    servers:
      - url: https://admin-api.lythaus.co/api
        description: Cloudflare Access-protected admin Worker
    get:
      operationId: adminHealth
      summary: Check admin Worker health
      tags: [Admin]
      security:
        - cloudflareAccess: []
      responses:
        '200':
          description: Admin Worker and database health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/privacy/requests:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: adminPrivacyRequestsList
      summary: List privacy requests
      tags: [Admin]
      security:
        - cloudflareAccess: []
      responses:
        '200':
          description: Recent privacy requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/moderation/cases:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: adminModerationCasesList
      summary: List moderation cases
      tags: [Admin]
      security:
        - cloudflareAccess: []
      responses:
        '200':
          description: Recent moderation cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/audit:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: productIntegrityAdminAuditList
      summary: List admin audit events
      tags: [Admin]
      security:
        - cloudflareAccess: []
      responses:
        '200':
          description: Recent audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/waitlist:
    servers:
      - url: https://admin.lythaus.co/api
    get:
      operationId: adminWaitlistList
      summary: List private beta waitlist signups
      description: Administrator-only PII access. Every successful view is written to the admin audit log.
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Decrypted waitlist rows and aggregate counts.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistAdminResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/SafetyLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/waitlist/{waitlistId}/status:
    servers:
      - url: https://admin.lythaus.co/api
    post:
      operationId: adminWaitlistStatusUpdate
      summary: Update a waitlist signup status
      description: Administrator and owner roles may update a waitlist record status. The response never includes email lookup or ciphertext fields.
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: waitlistId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistStatusUpdate'
      responses:
        '200':
          description: Waitlist status recorded.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/SafetyLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/waitlist/{waitlistId}/retention-hold:
    servers:
      - url: https://admin.lythaus.co/api
    post:
      operationId: adminWaitlistRetentionHoldUpdate
      summary: Set a waitlist retention hold
      description: Administrator and owner roles may set or release a retention hold. The response contains no email or encrypted-email fields.
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: waitlistId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRetentionHoldUpdate'
      responses:
        '200':
          description: Waitlist retention hold recorded.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistRetentionHoldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/SafetyLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/users/search:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: productIntegrityAdminUsersSearch
      summary: Search users
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Matching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItems'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/privacy/legal-holds:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: adminLegalHoldsList
      summary: List active and released legal holds
      tags: [Admin]
      security:
        - cloudflareAccess: []
      responses:
        '200':
          description: Legal holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: adminLegalHoldsCreate
      summary: Place a legal hold
      tags: [Admin]
      security:
        - cloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldCreate'
      responses:
        '201':
          description: Legal hold placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/privacy/legal-holds/{holdId}/clear:
    servers:
      - url: https://admin-api.lythaus.co/api
    post:
      operationId: adminLegalHoldsClear
      summary: Clear a legal hold
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Legal hold cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/editorial/publications:
    servers:
      - url: https://admin-api.lythaus.co/api
    post:
      operationId: adminEditorialPublicationsCreate
      summary: Publish an editorial News Board entry
      tags: [Admin]
      security:
        - cloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorialPublicationCreate'
      responses:
        '201':
          description: Editorial publication created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorialPublicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/moderation/cases/{caseId}/decision:
    servers:
      - url: https://admin-api.lythaus.co/api
    post:
      operationId: adminModerationDecision
      summary: Apply a moderation decision
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
      responses:
        '200':
          description: Moderation decision applied. An associated appeal remains open until the governance process resolves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/appeals/{appealId}/adjudications:
    servers:
      - url: https://admin-api.lythaus.co/api
        description: Cloudflare Access-protected admin Worker
    post:
      operationId: adminAppealsAdjudicate
      summary: Record a trained editorial appeal adjudication
      description: |
        This never auto-resolves an appeal. The shared governance policy evaluates
        the independently assigned reviewer quorum and then requires one trained
        adjudicator for standard risk or two for high risk. The outcome is applied
        only when the returned status is resolved.
      tags: [Admin]
      security:
        - cloudflareAccess: []
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealAdjudicationRequest'
            examples:
              uphold:
                value:
                  decision: uphold
                  reasonCode: APPEAL.PANEL_CONFIRMED
      responses:
        '200':
          description: Current governance evaluation and, only if resolved, the applied final outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealAdjudicationResponse'
              examples:
                resolved:
                  value:
                    appealId: 018b27d4-7f9b-7d9e-bf0e-9bf93c3fce43
                    status: resolved
                    reviewerPanelDecision: uphold
                    finalDecision: uphold
                    completedReviewers: 5
                    totalWeight: 5
                    overturnWeight: 1
                    upholdWeight: 4
                    winningShare: 0.8
                    requiredAdjudicators: 1
                    policyVersion: appeals-v1.0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/appeals/pending-adjudication:
    servers:
      - url: https://admin-api.lythaus.co/api
    get:
      operationId: adminAppealsPendingAdjudicationList
      summary: List pending appeal adjudications
      description: Editorial, administrator, and owner roles may list independent appeals awaiting adjudication. Only trained editorial adjudicators may record an adjudication.
      tags: [Admin, Appeals]
      security:
        - cloudflareAccess: []
      responses:
        '200':
