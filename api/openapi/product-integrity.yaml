          description: Quarantined upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Media uploads are disabled for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'media_daily_limit_reached: no more than 20 upload sessions per authenticated user per day.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyLimitError'

  /media/uploads/{uploadSessionId}/finalise:
    post:
      operationId: mediaUploadsFinalise
      summary: Finalise a quarantined media upload
      description: Verifies the uploaded object size and SHA-256 checksum, then queues private media review.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - name: uploadSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '200':
          description: Upload passed integrity checks and is queued for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadFinaliseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Media uploads are disabled for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /privacy/requests/{requestId}/export:
    get:
      operationId: privacyRequestExportDownload
      summary: Download my completed privacy export
      description: |
        Streams the authenticated subject's unexpired completed export as a private JSON
        attachment. The success payload is the export file itself, not an API envelope.
        Access is recorded as the `privacy.export_accessed` activity event.
      tags: [Privacy]
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private JSON export attachment.
          headers:
            Cache-Control:
              description: Private export responses are never cacheable by shared intermediaries.
              schema: { type: string, example: 'private, no-store' }
            Content-Disposition:
              description: Attachment filename for the requested export.
              schema: { type: string, example: 'attachment; filename="lythaus-export-018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a.json"' }
            ETag:
              description: Object entity tag supplied by private export storage.
              schema: { type: string }
            X-Content-SHA256:
              description: Hash recorded in the completed export manifest.
              schema: { type: string }
            X-Correlation-ID:
              description: Request correlation identifier.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyExportDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "export_not_found: the request is not this subject's completed, unexpired export."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 'export_unavailable: private export storage cannot currently serve the manifest object.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/email/verify:
    get:
      operationId: authEmailVerifyGet
      summary: Verify an email address with a query token
      description: Consumes a single-use email-verification token and returns only a private verification state.
      tags: [Auth]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '200':
          description: Email address verified.
          headers:
            Cache-Control:
              description: Verification responses are private and never cacheable.
              schema: { type: string, example: 'private, no-store' }
            X-Correlation-ID:
              description: Request correlation identifier.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
        '400':
          description: 'verification_token_invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'provider_unavailable when email sign-in is disabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: authEmailVerifyPost
      summary: Verify an email address with a JSON token
      description: Consumes a single-use email-verification token and returns only a private verification state.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          description: Email address verified.
          headers:
            Cache-Control:
              description: Verification responses are private and never cacheable.
              schema: { type: string, example: 'private, no-store' }
            X-Correlation-ID:
              description: Request correlation identifier.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
        '400':
          description: 'verification_token_invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'provider_unavailable when email sign-in is disabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
