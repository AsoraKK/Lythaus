components:
  parameters:
    appealId:
      name: appealId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CommunityBallotRequest:
      type: object
      additionalProperties: false
      required: [choice, reasonCode, expectedRevision, contextAcknowledged]
      properties:
        choice: { type: string, enum: [allow, retain, recuse, cannot_assess] }
        reasonCode: { type: string, enum: [rule_misapplied, rule_applies, conflict, insufficient_context] }
        expectedRevision: { type: integer, minimum: 0 }
        contextAcknowledged: { type: boolean, enum: [true] }
    CommunityBallotResponse:
      type: object
      additionalProperties: false
      required: [ballotId, revision, choice, castAt, created]
      properties:
        ballotId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        choice: { type: string, enum: [allow, retain, recuse, cannot_assess] }
        castAt: { type: string, format: date-time }
        created: { type: boolean }
    CommunityOwnBallot:
      type: object
      nullable: true
      additionalProperties: false
      required: [revision, choice, reason_code, cast_at]
      properties:
        revision: { type: integer, minimum: 1 }
        choice: { type: string, enum: [allow, retain, recuse, cannot_assess] }
        reason_code: { type: string, enum: [rule_misapplied, rule_applies, conflict, insufficient_context] }
        cast_at: { type: string, format: date-time }
    CommunityAppealOutcome:
      type: object
      nullable: true
      additionalProperties: false
      required: [result, restoration]
      properties:
        restoration: { type: string, enum: [not_applicable, restored, content_changed_or_deleted, independent_hold, publication_rule_hold] }
        result:
          type: object
          additionalProperties: false
          required: [policyVersion, rulesVersion, status, validBallots, allow, retain, reason]
          properties:
            policyVersion: { type: string, enum: [lythaus-monthly-rewards-2026-10-v1] }
            rulesVersion: { type: string }
            status: { type: string, enum: [resolved_allow, resolved_retain, unresolved] }
            validBallots: { type: integer, minimum: 0 }
            allow: { type: integer, minimum: 0 }
            retain: { type: integer, minimum: 0 }
            reason: { type: string, enum: [strict_majority, tie, no_quorum] }
    CommunityAppealEvidence:
      type: object
      nullable: true
      additionalProperties: false
      required: [preview, ruleContext, version, evidenceHash]
      properties:
        preview: { type: string, maxLength: 100000 }
        ruleContext: { type: string, maxLength: 4000 }
        version: { type: string, format: uuid }
        evidenceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CommunityAppealDetail:
      type: object
      additionalProperties: false
      required: [appealId, policyVersion, rulesVersion, state, reviewClass, opensAt, closesAt, extensions, question, ownBallot, outcome, evidence]
      properties:
        appealId: { type: string, format: uuid }
        policyVersion: { type: string, enum: [lythaus-monthly-rewards-2026-10-v1] }
        rulesVersion: { type: string }
        state: { type: string, enum: [submitted, triaged, open, closing, extended, resolved_allow, resolved_retain, unresolved, restricted_review, withdrawn] }
        reviewClass: { type: string, enum: [untriaged, standard, restricted] }
        opensAt: { type: string, format: date-time, nullable: true }
        closesAt: { type: string, format: date-time, nullable: true }
        extensions: { type: integer, minimum: 0 }
        question: { type: string, enum: ['Was the challenged rule correctly applied to this content version?'] }
        ownBallot: { $ref: '#/components/schemas/CommunityOwnBallot' }
        outcome: { $ref: '#/components/schemas/CommunityAppealOutcome' }
        evidence: { $ref: '#/components/schemas/CommunityAppealEvidence' }
    CommunityAppealQueue:
      type: object
      additionalProperties: false
      required: [state, items]
      properties:
        state: { type: string, enum: [available, no_case_available] }
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/CommunityAppealDetail' } }
    CommunityAppealWithdrawal:
      type: object
      required: [appealId, state]
      properties:
        appealId: { type: string, format: uuid }
        state: { type: string, enum: [withdrawn] }
    CommunityAppealTriageRequest:
      type: object
      additionalProperties: false
      required: [reviewClass, reasonCode]
      description: Standard routing requires a safe text rendition and rule context. Restricted routing forbids peer evidence. Neither route can replace an already opened review packet.
      properties:
        reviewClass: { type: string, enum: [standard, restricted] }
        safePreview: { type: string, minLength: 1, maxLength: 100000 }
        ruleContext: { type: string, minLength: 1, maxLength: 4000 }
        reasonCode: { type: string, pattern: '^[a-z][a-z0-9_]{1,79}$' }
    CommunityAppealTriageResponse:
      type: object
      required: [appealId, state, opensAt, closesAt]
      properties:
        appealId: { type: string, format: uuid }
        state: { type: string, enum: [open, restricted_review] }
        opensAt: { type: string, format: date-time, nullable: true }
        closesAt: { type: string, format: date-time, nullable: true }
    CommunityAppealTriageQueue:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [appealId, state, reviewClass, rulesVersion]
            properties:
              appealId: { type: string, format: uuid }
              state: { type: string, enum: [submitted, restricted_review, unresolved] }
              reviewClass: { type: string, enum: [untriaged, standard, restricted] }
              rulesVersion: { type: string }
    CommunityAppealTriageEvidence:
      type: object
      required: [appealId, state, challengedDecisionId, version, evidenceHash, evidence]
      properties:
        appealId: { type: string, format: uuid }
        state: { type: string }
        challengedDecisionId: { type: string, format: uuid }
        version: { type: string, format: uuid }
        evidenceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        evidence:
          type: object
          required: [frozen_content, classifier_evidence]
          properties:
            frozen_content:
              type: object
              required: [body, declaration]
              properties:
                body: { type: string }
                declaration: { type: string }
            classifier_evidence: { type: array, items: { type: object, additionalProperties: true } }
paths:
  /appeals/review/queue:
    get:
      operationId: communityAppealsQueue
      summary: List private eligible community reviews
      description: Random case ordering; no selected panel, live counts, voter identities or restricted evidence. Requires approved configuration and a verified eligible account. No suitable cases returns no_case_available.
      tags: [Appeals]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Private eligible case queue.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealQueue' } } }
        '401': { $ref: './product-integrity.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './product-integrity.yaml#/components/responses/Forbidden' }
        '503': { description: Community policy is not activated. }
  /appeals/{appealId}/withdraw:
    post:
      operationId: communityAppealsWithdraw
      summary: Withdraw an owned community appeal before closure
      tags: [Appeals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/appealId'
        - $ref: './product-integrity.yaml#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: Withdrawal recorded without a voting penalty.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealWithdrawal' } } }
        '401': { $ref: './product-integrity.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './product-integrity.yaml#/components/responses/NotFound' }
        '409': { $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict' }
        '503': { description: Community route is not configured. }
  /admin/appeals/community/queue:
    servers: [{ url: 'https://admin-api.lythaus.co/api' }]
    get:
      operationId: adminCommunityAppealsQueue
      summary: List appeals awaiting safe triage or accountable follow-up
      tags: [Admin]
      security: [{ cloudflareAccess: [] }]
      responses:
        '200':
          description: Case metadata only, for active conflict-free moderation staff.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealTriageQueue' } } }
        '401': { $ref: './product-integrity.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './product-integrity.yaml#/components/responses/Forbidden' }
        '429': { $ref: './product-integrity.yaml#/components/responses/SafetyLimited' }
        '503': { description: Community policy is not activated. }
  /admin/appeals/{appealId}/triage:
    servers: [{ url: 'https://admin-api.lythaus.co/api' }]
    post:
      operationId: adminCommunityAppealsTriage
      summary: Freeze a safe review packet or restrict a submitted appeal
      description: Active conflict-free moderation staff provide a safe text rendition and rule context. The review clock starts here. Requires approved rules and the active feature flag. This operation cannot alter a community outcome or reopen a triaged packet.
      tags: [Admin]
      security: [{ cloudflareAccess: [] }]
      parameters: [{ $ref: '#/components/parameters/appealId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealTriageRequest' } } }
      responses:
        '200':
          description: Triage recorded atomically with the case event.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealTriageResponse' } } }
        '400': { $ref: './product-integrity.yaml#/components/responses/BadRequest' }
        '401': { $ref: './product-integrity.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './product-integrity.yaml#/components/responses/Forbidden' }
        '404': { $ref: './product-integrity.yaml#/components/responses/NotFound' }
        '409': { description: The review packet is already frozen. }
        '429': { $ref: './product-integrity.yaml#/components/responses/SafetyLimited' }
        '503': { description: Community policy is not activated. }
  /admin/appeals/{appealId}/evidence:
    servers: [{ url: 'https://admin-api.lythaus.co/api' }]
    get:
      operationId: adminCommunityAppealsEvidence
      summary: Read frozen evidence for safe triage
      description: Active conflict-free moderation staff only. No ballots or live tally. Restricted material requires a separately approved specialist route and is refused by this endpoint.
      tags: [Admin]
      security: [{ cloudflareAccess: [] }]
      parameters: [{ $ref: '#/components/parameters/appealId' }]
      responses:
        '200':
          description: Private frozen evidence, never a peer preview.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAppealTriageEvidence' } } }
        '400': { $ref: './product-integrity.yaml#/components/responses/BadRequest' }
        '401': { $ref: './product-integrity.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './product-integrity.yaml#/components/responses/Forbidden' }
        '404': { $ref: './product-integrity.yaml#/components/responses/NotFound' }
        '429': { $ref: './product-integrity.yaml#/components/responses/SafetyLimited' }
        '503': { description: Community route is not configured. }
