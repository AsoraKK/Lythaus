openapi: 3.0.3
info:
  title: Lythaus API
  version: v7
  description: >
    HTTP contract for the Lythaus API. The active runtime is Cloudflare Workers
    backed by PlanetScale PostgreSQL through Hyperdrive. Initial authentication
    is Guest plus Email only. Production releases are coordinated from one
    reviewed main SHA; the release manifest and provider evidence remain
    outside this HTTP contract.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
x-lythaus-release:
  workflow: .github/workflows/production-release.yml
  manifest: scripts/ci/build-release-manifest.mjs
  migrationBaseline: 0013_marketing_waitlist.sql
  authenticationModes: [guest, email]
servers:
  - url: https://api.lythaus.co/api
    description: Lythaus MVP API gateway
tags:
  - name: Feed
    description: Feed retrieval endpoints.
  - name: Health
    description: Liveness monitoring endpoints.
  - name: Auth
    description: Email and guest authentication endpoints.
  - name: Posts
    description: Post authoring endpoints.
  - name: Media
    description: Quarantined image upload and review handoff endpoints.
  - name: Activity
    description: User-visible activity and audit timeline entries.
  - name: Social
    description: Follows, blocks, mutes, bookmarks, and reactions.
  - name: CustomFeeds
    description: Tier-limited personal feed configurations.
  - name: Appeals
    description: Independent reviewer appeal governance.
  - name: Notifications
    description: Notification delivery and preference controls.
  - name: Moderation
    description: Moderation workflows.
  - name: Admin
    description: Lythaus admin moderation and safety operations.
  - name: Privacy
    description: User data portability and account deletion (GDPR/CCPA).
  - name: Privacy Admin
    description: Data Subject Request and legal hold administration.
  - name: Reputation
    description: Reputation summaries and user-visible ledger entries.
  - name: Reactions
    description: Structured content reactions.
  - name: Rewards
    description: Tier-gated rewards and redemptions.
  - name: Waitlist
    description: Private beta waitlist registration.
paths:
  /waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the Lythaus private beta waitlist
      description: Returns the same neutral success response for new and duplicate submissions.
      tags: [Waitlist]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistSubmission'
      responses:
        '200':
          description: The submission was processed without disclosing prior membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSuccess'
        '400':
          description: Invalid email, JSON, consent version, or Turnstile verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistError'
        '413':
          description: Request body exceeded the waitlist limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistError'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistError'
        '429':
          description: Submission rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistError'
        '503':
          description: Waitlist or verification service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistError'
  /feed:
    $ref: './product-integrity.yaml#/paths/~1feed'
  /flags:
    $ref: './product-integrity.yaml#/paths/~1flags'
  /content/flags:
    $ref: './product-integrity.yaml#/paths/~1content~1flags'
  /media/uploads:
    $ref: './product-integrity.yaml#/paths/~1media~1uploads'
  /media/uploads/{uploadSessionId}/finalise:
    $ref: './product-integrity.yaml#/paths/~1media~1uploads~1{uploadSessionId}~1finalise'
  /health:
    get:
      operationId: getHealth
      summary: Service health probe
      description: Liveness/readiness check. No auth.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Health status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                  version:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit enforced
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema:
                type: integer
                minimum: 0
            X-RateLimit-Limit:
              description: Maximum requests allowed in the enforced window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Remaining requests before hitting the limit
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '502':
          description: Upstream dependency returned an unexpected response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadGatewayError'
        '503':
          description: Service temporarily unavailable (dependency outage or maintenance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /posts:
    post:
      operationId: posts_create
      summary: Create a post with moderation and AI authenticity checks
      description: >
        Create a post for the authenticated user. An authorship disclosure is
        required. Human-authored text may publish after review. AI-assisted text
        may publish only when its normalised, trimmed body is at most 249
        user-perceived Unicode characters and receives the categorical
        `AI-assisted` label. AI-generated public content is blocked and may exist
        only in an author-private feedback or appeal state where supported.
      tags:
        - Posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: './product-integrity.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            examples:
              human:
                summary: Human-authored public post
                value:
                  body: Local reporting from the community meeting.
                  declaredCreationMode: human
                  geoScope: community
                  placeId: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1c
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '201':
          description: Created post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              examples:
                published:
                  summary: Published human-authored post
                  value:
                    id: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a
                    authorId: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1b
                    content: Local reporting from the community meeting.
                    contentType: text
                    visibility: public
                    isNews: false
                    authorship:
                      authorshipLabel: Human-authored
                      declaredAuthorship: human
                      classificationSource: user_disclosure
                      classificationState: confirmed
                      reviewState: not_required
                      appealState: none
                      labelVersion: authorship-v1.0.0
                    createdAt: '2026-08-10T09:00:00Z'
                    updatedAt: '2026-08-10T09:00:00Z'
        '400':
          description: Invalid input or content blocked by moderation/AI policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Authenticated caller lacks permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Rate limit enforced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
  /admin/users/{userId}/tier:
    $ref: './product-integrity.yaml#/paths/~1admin~1users~1{userId}~1tier'
  /.well-known/jwks.json:
    get:
      operationId: authJwksGet
      summary: Get the public JWT verification key set
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Public JSON Web Key Set cached for five minutes.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
        '404':
          description: Opaque not-found response outside the canonical host boundary.
  /auth/email:
    post:
      operationId: authEmail
      summary: Register, sign in, or resend email verification
      description: >
        Registers an email account, signs in a verified account, or resends a
        verification message. Registration requires a Turnstile token when the
        production bot-protection gate is enabled.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAuthRequest'
            examples:
              login:
                summary: Verified email sign-in
                value:
                  mode: login
                  email: alice@example.com
                  password: correct-horse-battery-staple
              register:
                summary: Email registration
                value:
                  mode: register
                  email: alice@example.com
                  password: correct-horse-battery-staple
                  turnstileToken: turnstile_verified_token
              resendVerification:
                summary: Resend a verification message
                value:
                  mode: resend_verification
                  email: alice@example.com
      responses:
        '200':
          description: Authenticated token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSessionResponse'
              examples:
                success:
                  summary: Email session created
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    refreshToken: refresh_example_01K1LYTHAUS
                    tokenType: Bearer
                    expiresIn: 900
        '202':
          description: Registration or resend accepted; email verification is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationRequiredResponse'
              examples:
                registration:
                  value:
                    state: verification_required
                    userId: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a
                resend:
                  value:
                    state: verification_required
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid credentials or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The email account already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit enforced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Email authentication provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/email/verify:
    $ref: './product-integrity.yaml#/paths/~1auth~1email~1verify'
  /privacy/requests:
    get:
      operationId: privacyRequestStatus
      summary: Get the latest privacy request status
      description: Returns the authenticated user's latest matching asynchronous privacy request.
      tags:
        - Privacy
      security:
        - bearerAuth: []
      parameters:
        - name: requestType
          in: query
          required: false
          schema:
            type: string
            enum: [export, delete, rectify]
      responses:
        '200':
          description: Latest matching request, or null when none exists
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestStatusResponse'
              examples:
                processing:
                  value:
                    request:
                      requestId: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a
                      requestType: export
                      state: processing
                      acceptedAt: '2026-07-29T07:00:00Z'
                      completedAt: null
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    post:
      operationId: privacyRequestCreate
      summary: Submit an asynchronous privacy request
      description: |
        Records an export, account deletion, or rectification request and queues
        it for durable processing. Acceptance does not mean processing is complete.
      tags:
        - Privacy
      security:
        - bearerAuth: []
      parameters:
        - $ref: './product-integrity.yaml#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestCreate'
            examples:
              export:
                value:
                  requestType: export
      responses:
        '202':
          description: Privacy request accepted for processing
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestAccepted'
              examples:
                accepted:
                  value:
                    requestId: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a
                    requestType: export
                    state: received
                    acceptedAt: '2026-07-29T07:00:00Z'
        '400':
          description: Invalid privacy request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '429':
          description: 'privacy_request_active: an unfinished request of the same type already exists. export_cooldown_active: export requests are limited to one request per authenticated user in 30 days.'
          content:
            application/json:
              schema:
                $ref: './product-integrity.yaml#/components/schemas/SafetyLimitError'
  /privacy/requests/{requestId}/export:
    $ref: './product-integrity.yaml#/paths/~1privacy~1requests~1{requestId}~1export'
  /appeals:
    $ref: './product-integrity.yaml#/paths/~1appeals'
  /appeals/{id}:
    $ref: './product-integrity.yaml#/paths/~1appeals~1{id}'
  /appeals/{appealId}/vote:
    $ref: './product-integrity.yaml#/paths/~1appeals~1{appealId}~1vote'
  /appeals/{appealId}/recuse:
    $ref: './product-integrity.yaml#/paths/~1appeals~1{appealId}~1recuse'
  /appeals/reviewer/assignments:
    $ref: './product-integrity.yaml#/paths/~1appeals~1reviewer~1assignments'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate a refresh token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            examples:
              rotate:
                value:
                  refreshToken: refresh_example_01K1LYTHAUS
      responses:
        '200':
          description: Refresh token rotated and replacement session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSessionResponse'
              examples:
                rotated:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.rotated
                    refreshToken: refresh_example_01K1LYTHAUS_rotated
                    tokenType: Bearer
                    expiresIn: 900
        '400':
          description: Missing or invalid refresh-token request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Refresh token invalid, expired, reused, or tied to an inactive account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke all active sessions for the authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All active refresh families and sessions were revoked.
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut: { type: boolean, enum: [true] }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }
  /auth/password/reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Request an opaque password reset message
      description: Always returns the same neutral state so account existence is not disclosed.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, turnstileToken]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                turnstileToken: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
            examples:
              request:
                value:
                  email: member@example.com
                  turnstileToken: turnstile-token
      responses:
        '202':
          description: A reset message was issued if the account is eligible.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [reset_if_eligible] }
              examples:
                neutral:
                  value:
                    state: reset_if_eligible
        '400':
          description: Invalid request or Turnstile verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '429':
          description: Neutral authentication rate limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitError' }
  /auth/password/reset/complete:
    post:
      operationId: authPasswordResetComplete
      summary: Complete password reset and revoke existing sessions
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, writeOnly: true }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Password reset completed and prior sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [password_reset_completed] }
        '400':
          description: Invalid or expired reset token or invalid password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
  /auth/userinfo:
    get:
      operationId: authUserInfo
      summary: Get the authenticated user's current identity claims
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private current-user identity data.
          content:
            application/json:
              schema:
                type: object
                required: [id, sub, email, role, subscription_tier, reputation_level, reputation_policy_version, created_at, last_login_at]
                properties:
                  id: { type: string, format: uuid }
                  sub: { type: string, format: uuid }
                  email: { type: string, format: email }
                  role: { type: string, enum: [user, moderator, admin] }
                  subscription_tier: { type: string, enum: [free, premium, black] }
                  reputation_level: { type: integer, minimum: 0, maximum: 5 }
                  reputation_policy_version: { type: string }
                  created_at: { type: string, format: date-time }
                  last_login_at: { type: string, format: date-time }
              examples:
                authenticated:
                  value:
                    id: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1b
                    sub: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1b
                    email: member@example.com
                    role: user
                    subscription_tier: free
                    reputation_level: 0
                    reputation_policy_version: reputation-v2.0.0
                    created_at: '2026-08-01T09:00:00Z'
                    last_login_at: '2026-08-10T09:00:00Z'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }

  /storage/usage:
    get:
      operationId: storageUsageGet
      summary: Get the authenticated user's private storage ledger
      tags: [Privacy]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private storage ledger totals.
          content:
            application/json:
              schema:
                type: object
                required: [storage]
                properties:
                  storage:
                    type: object
                    required: [bytes_reserved, bytes_uploaded, bytes_approved, bytes_rejected, bytes_exports, object_count]
                    properties:
                      bytes_reserved: { type: integer, minimum: 0 }
                      bytes_uploaded: { type: integer, minimum: 0 }
                      bytes_approved: { type: integer, minimum: 0 }
                      bytes_rejected: { type: integer, minimum: 0 }
                      bytes_exports: { type: integer, minimum: 0 }
                      object_count: { type: integer, minimum: 0 }
                      last_reconciled_at: { type: string, format: date-time, nullable: true }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }
  /users/me/region:
    put:
      operationId: usersMeRegionUpdate
      summary: Update private region and visibility preferences
      tags: [Users, Privacy]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './product-integrity.yaml#/components/parameters/requiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                countryCode: { type: string, nullable: true, pattern: '^[A-Za-z0-9-]{2,32}$' }
                regionCode: { type: string, nullable: true, pattern: '^[A-Za-z0-9-]{2,32}$' }
                municipalityCode: { type: string, nullable: true, pattern: '^[A-Za-z0-9-]{2,32}$' }
                visibilityLevel: { type: string, enum: [private, region, country], default: private }
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '200':
          description: Region preferences updated.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean, enum: [true] }
        '400':
          description: Invalid region code or visibility level.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }
  /users/me/retention:
    put:
      operationId: usersMeRetentionUpdate
      summary: Update a private content-retention rule
      tags: [Users, Privacy]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './product-integrity.yaml#/components/parameters/requiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, retentionDays]
              properties:
                contentType: { type: string, enum: [post, posts, media] }
                retentionDays: { type: integer, minimum: 30, maximum: 3650 }
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '200':
          description: Retention preference updated.
          content:
            application/json:
              schema:
                type: object
                required: [contentType, retentionDays]
                properties:
                  contentType: { type: string, enum: [post, media] }
                  retentionDays: { type: integer, minimum: 30, maximum: 3650 }
        '400':
          description: Invalid retention content type or period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }

  /custom-feeds:
    $ref: './product-integrity.yaml#/paths/~1custom-feeds'
  /custom-feeds/{id}:
    $ref: './product-integrity.yaml#/paths/~1custom-feeds~1{id}'
  /custom-feeds/{id}/items:
    $ref: './product-integrity.yaml#/paths/~1custom-feeds~1{id}~1items'
  /feed/discover:
    $ref: './product-integrity.yaml#/paths/~1feed~1discover'
  /feed/news:
    $ref: './product-integrity.yaml#/paths/~1feed~1news'
  /news-board:
