  /posts/{id}:
    get:
      operationId: postsGet
      summary: Get a post by ID
      tags:
        - Posts
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: './product-integrity.yaml#/components/parameters/idempotencyKey'
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '200':
          description: Post view.
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: './product-integrity.yaml#/components/schemas/PersonalFeedItem'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: postsUpdate
      summary: Update a post with moderation and AI authenticity checks
      description: >
        Update a post owned by the caller. A body change requires a fresh
        declaredCreationMode; a visibility-only change preserves the stored
        declaration. Every accepted update returns the post to review.
      tags:
        - Posts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
            examples:
              bodyRevision:
                value:
                  body: Corrected local reporting from the community meeting.
                  declaredCreationMode: human
              visibilityOnly:
                value:
                  visibility: followers
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevisionResponse'
              examples:
                contentRevision:
                  value:
                    post:
                      id: 018f2c4e-8c2b-7b4e-8d2a-2e2f0b7e4b1a
                      body: Corrected local reporting from the community meeting.
                      declaredCreationMode: human
                      visibility: public
                      moderationState: under_review
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: postsReplace
      summary: Replace editable post fields and return the post to review
      tags: [Posts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: './product-integrity.yaml#/components/parameters/requiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePostRequest' }
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '200':
          description: Updated post returned to moderation review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevisionResponse'
        '400':
          description: Invalid request or deterministic declaration-policy rejection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }
    delete:
      operationId: postsDelete
      summary: Soft-delete a post owned by the authenticated user
      tags: [Posts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: './product-integrity.yaml#/components/parameters/requiredIdempotencyKey'
      responses:
        '409':
          $ref: './product-integrity.yaml#/components/responses/IdempotencyConflict'
        '200':
          description: Idempotent soft-delete result.
          content:
            application/json:
              schema:
                type: object
                required: [postId, deleted]
                properties:
                  postId: { type: string, format: uuid }
                  deleted: { type: boolean }
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedError' }

