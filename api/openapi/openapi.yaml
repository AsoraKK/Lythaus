components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cloudflareAccess:
      type: apiKey
      in: header
      name: CF-Access-Jwt-Assertion
      description: Cloudflare Access JWT assertion required by the admin Worker.
  schemas:
    WaitlistSubmission:
      type: object
      additionalProperties: false
      required: [email, turnstileToken, consentVersion]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        turnstileToken:
          type: string
          minLength: 10
          maxLength: 4096
          writeOnly: true
        consentVersion:
          type: string
          enum: [waitlist-v1]
    WaitlistSuccess:
      type: object
      additionalProperties: false
      required: [ok, status]
      properties:
        ok: { type: boolean, enum: [true] }
        status: { type: string, enum: [waitlisted] }
    WaitlistError:
      type: object
      additionalProperties: false
      required: [error, correlationId]
      properties:
        error:
          type: string
          enum: [invalid_email, invalid_json, invalid_consent_version, request_too_large, turnstile_required, turnstile_failed, turnstile_unavailable, rate_limit_exceeded, unsupported_content_type, waitlist_unavailable, request_failed]
        correlationId: { type: string }
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine readable error code
        message:
          type: string
          description: Human readable error description
    SimpleError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable or plain-language error identifier.
    RateLimitError:
      type: object
      required:
        - error
        - scope
        - limit
        - window_seconds
        - retry_after_seconds
        - trace_id
      properties:
        error:
          type: string
          description: Constant identifier for rate limit breaches
          enum:
            - rate_limited
        scope:
          type: string
          description: Scope of the limit that triggered the breach
          enum:
            - ip
            - user
            - route
            - auth_backoff
        limit:
          type: integer
          minimum: 0
          description: Maximum requests permitted within the window
        window_seconds:
          type: integer
          minimum: 1
          description: Window size for the limit in seconds
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Seconds until the limit resets
        trace_id:
          type: string
          description: Correlation identifier for tracing
        reason:
          type: string
          description: Additional context for specialized scopes (e.g. auth backoff)
          enum:
            - auth_backoff
    SubscriptionStatus:
      type: object
      required:
        - userId
        - tier
        - status
        - provider
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - accessLabel
        - manualGrantExpiresAt
        - manualGrantReviewAt
        - entitlements
      properties:
        userId:
          type: string
        tier:
          type: string
          enum:
            - free
            - premium
            - black
        status:
          type: string
          enum:
            - active
            - cancelled
            - past_due
            - expired
            - trialing
        provider:
          type: string
          nullable: true
          enum:
            - apple
            - google
            - stripe
            - manual
        currentPeriodEnd:
          type: string
          nullable: true
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        accessLabel:
          type: string
          enum:
            - Alpha access
          description: Manual Alpha entitlement label; no active payment system is implied.
        manualGrantExpiresAt:
          type: string
          nullable: true
          format: date-time
        manualGrantReviewAt:
          type: string
          nullable: true
          format: date-time
        entitlements:
          type: object
          required:
            - dailyPosts
            - dailyComments
            - dailyReactions
            - dailyAppeals
            - exportCooldownDays
            - maxMediaSizeMB
            - maxMediaPerPost
            - maxCustomFeeds
            - newsBoardAccessLevel
            - newsBoardPreview
            - postingRestricted
            - rewardLevelCap
            - rewardOptionsPerLevel
            - rewardChoiceBreadth
          properties:
            dailyPosts:
              type: integer
            dailyComments:
              type: integer
            dailyReactions:
              type: integer
            dailyAppeals:
              type: integer
            exportCooldownDays:
              type: integer
            maxMediaSizeMB:
              type: integer
            maxMediaPerPost:
              type: integer
            maxCustomFeeds:
              type: integer
              description: Maximum custom feeds available to this tier.
            newsBoardAccessLevel:
              type: string
              enum: [preview, full]
              description: Free receives preview; Premium and Black receive full access.
            newsBoardPreview:
              type: boolean
              description: Whether the tier can read the safe News Board preview.
            postingRestricted:
              type: boolean
              description: Whether normal posting is product-limited beyond abuse controls.
            rewardLevelCap:
              type: integer
              description: Highest reputation reward level available to this tier.
            rewardOptionsPerLevel:
              type: integer
              nullable: true
              description: Reward options per reputation level; null means all eligible rewards.
            rewardChoiceBreadth:
              type: string
              enum: [limited, increased, full]
    NewsSourceMetadata:
      type: object
      required:
        - type
        - name
        - publishedAt
        - ingestedAt
        - ingestedBy
        - ingestMethod
      properties:
        type:
          type: string
          enum:
            - journalist
            - curated
            - partner
            - wire
        name:
          type: string
        url:
          type: string
          format: uri
        feedUrl:
          type: string
          format: uri
        externalId:
          type: string
        publishedAt:
          type: string
          format: date-time
        ingestedAt:
          type: string
          format: date-time
        ingestedBy:
          type: string
        ingestMethod:
          type: string
          enum:
            - admin_api
            - timer
    PublicAuthorship:
      type: object
      additionalProperties: false
      required:
        - authorshipLabel
        - declaredAuthorship
        - classificationSource
        - classificationState
        - reviewState
        - appealState
        - labelVersion
      properties:
        authorshipLabel:
          type: string
          enum: [Human-authored, AI-assisted, Under review]
        declaredAuthorship:
          type: string
          enum: [human, assisted]
        classificationSource:
          type: string
          enum: [user_disclosure, automated_classification, human_review, appeal_outcome]
        classificationState:
          type: string
          enum: [confirmed, conflict, unavailable]
        reviewState:
          type: string
          enum: [not_required, pending, in_review, resolved]
        appealState:
          type: string
          enum: [none, eligible, pending, resolved]
        labelVersion:
          type: string
        classifiedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
    CreatePostRequest:
      type: object
      additionalProperties: false
      required:
        - body
        - declaredCreationMode
        - geoScope
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 100000
        declaredCreationMode:
          type: string
          description: Required user authorship disclosure. Public responses use categorical labels only.
          enum:
            - human
            - ai_assisted
        geoScope:
          type: string
          enum:
            - global
            - country
            - province
            - municipality
            - community
            - none
        placeId:
          type: string
          format: uuid
      oneOf:
        - title: Scoped post
          properties:
            geoScope:
              type: string
              enum: [country, province, municipality, community]
          required: [placeId]
        - title: Unscoped post
          properties:
            geoScope:
              type: string
              enum: [global, none]
          not:
            properties:
              placeId:
                type: string
            required: [placeId]
    UpdatePostRequest:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 100000
        declaredCreationMode:
          type: string
          description: Required with body changes. AI-generated public content is rejected.
          enum: [human, ai_assisted]
        visibility:
          type: string
          enum: [public, followers, private]
      oneOf:
        - title: Body revision
          required: [body, declaredCreationMode]
        - title: Declaration-only revision
          properties:
            declaredCreationMode:
              type: string
            body:
              type: string
          required: [declaredCreationMode]
          not:
            properties:
              body:
                type: string
            required: [body]
        - title: Visibility-only revision
          properties:
            visibility:
              type: string
            body:
              type: string
            declaredCreationMode:
              type: string
          required: [visibility]
          not:
            anyOf:
              - properties:
                  body:
                    type: string
                required: [body]
              - properties:
                  declaredCreationMode:
                    type: string
                required: [declaredCreationMode]
    PostRevision:
      type: object
      additionalProperties: false
      required: [id, body, declaredCreationMode, visibility, moderationState]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        declaredCreationMode:
          type: string
          enum: [human, ai_assisted]
        visibility:
          type: string
          enum: [public, followers, private]
        moderationState:
          type: string
          enum: [under_review]
    PostRevisionResponse:
      type: object
      additionalProperties: false
      required: [post]
      properties:
        post:
          $ref: '#/components/schemas/PostRevision'
    Post:
      type: object
      required:
        - id
        - authorId
        - content
        - contentType
        - visibility
        - isNews
        - authorship
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        authorId:
          type: string
        content:
          type: string
        contentType:
          type: string
          enum:
            - text
            - image
            - video
            - mixed
        mediaUrls:
          type: array
          items:
            type: string
            format: uri
        topics:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum:
            - public
            - followers
            - private
        isNews:
          type: boolean
        source:
          $ref: '#/components/schemas/NewsSourceMetadata'
        clusterId:
          type: string
        authorship:
          $ref: '#/components/schemas/PublicAuthorship'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RewardOffer:
      type: object
      required:
        - id
        - rewardLevel
        - title
        - description
        - partnerName
        - locked
        - redeemed
      properties:
        id:
          type: string
        rewardLevel:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        description:
          type: string
        partnerName:
          type: string
        locked:
          type: boolean
        lockReason:
          type: string
        redeemed:
          type: boolean
    RewardRedemption:
      type: object
      required:
        - id
        - userId
        - rewardId
        - rewardLevel
        - rewardTitle
        - redeemedAt
        - status
      properties:
        id:
          type: string
        userId:
          type: string
        rewardId:
          type: string
        rewardLevel:
          type: integer
        rewardTitle:
          type: string
        redeemedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [redeemed]
    RewardsMeResponse:
      type: object
      required:
        - subscriptionTier
        - reputationLevel
        - reputationBand
        - availableRewardLevels
        - maxOptionsPerLevel
        - redemptionStatus
        - fraudRiskStatus
        - offers
        - redemptionHistory
        - affiliateDisclosure
      properties:
        subscriptionTier:
          type: string
          enum: [free, premium, black]
        reputationLevel:
          type: integer
          minimum: 0
          maximum: 5
        reputationBand:
          type: string
        availableRewardLevels:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        maxOptionsPerLevel:
          type: integer
        redemptionStatus:
          type: string
          enum: [active, restricted]
        fraudRiskStatus:
          type: string
        offers:
          type: array
          items:
            $ref: '#/components/schemas/RewardOffer'
        redemptionHistory:
          type: array
          items:
            $ref: '#/components/schemas/RewardRedemption'
        affiliateDisclosure:
          type: string
    ErrorResponse:
      description: Canonical error envelope returned by handler-based endpoints.
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: INVALID_REQUEST
            message:
              type: string
              description: Human-readable description
              example: The request body is missing required field "text"
            correlationId:
              type: string
              description: Correlation ID for distributed tracing
              example: 01HZPQ2B3C4D5E6F7G8H9JABCD
            details:
              type: object
              additionalProperties: true
              description: Optional structured details (e.g. field-level validation errors)
    ValidationErrorResponse:
      description: 400 response with structured field-level validation failures.
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
              example: Request validation failed
            correlationId:
              type: string
            fields:
              type: array
              description: Per-field validation errors
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    example: text
                  message:
                    type: string
                    example: Field is required
                  constraint:
                    type: string
                    example: minLength
    UnauthorizedError:
      description: 401 – missing or invalid bearer token.
      oneOf:
        - $ref: '#/components/schemas/SimpleError'
        - $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: 403 – authenticated caller lacks required role or permission.
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - FORBIDDEN
                - INSUFFICIENT_ROLE
                - ACCOUNT_DISABLED
              example: FORBIDDEN
            message:
              type: string
              example: You do not have permission to perform this action
            correlationId:
              type: string
    PrivacyRequestCreate:
      description: An asynchronous privacy request submitted by the authenticated subject.
      type: object
      required:
        - requestType
      properties:
        requestType:
          type: string
          enum: [export, delete, rectify]
    PrivacyRequest:
      description: Current state of an asynchronous privacy request.
      type: object
      required: [requestId, requestType, state, acceptedAt]
      properties:
        requestId:
          type: string
          format: uuid
        requestType:
          type: string
          enum: [export, delete, rectify]
        state:
          type: string
          enum: [received, processing, blocked, completed, failed]
        acceptedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    PrivacyRequestAccepted:
      allOf:
        - $ref: '#/components/schemas/PrivacyRequest'
    PrivacyRequestStatusResponse:
      type: object
      required: [request]
      properties:
        request:
          type: object
          allOf:
            - $ref: '#/components/schemas/PrivacyRequest'
          nullable: true
    EmailSessionResponse:
      description: Direct email authentication or refresh-token rotation response.
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Short-lived JWT bearer token (15 minutes).
        refreshToken:
          type: string
          description: Rotating opaque refresh token.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds.
    EmailVerificationRequiredResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [verification_required]
        userId:
          type: string
          format: uuid
    EmailAuthRequest:
      description: Email registration, login, or verification-resend request.
      type: object
      additionalProperties: false
      required:
        - mode
        - email
      properties:
        mode:
          type: string
          enum: [login, register, resend_verification]
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        turnstileToken:
          type: string
          minLength: 10
          writeOnly: true
      oneOf:
        - title: Login
          properties:
            mode: { type: string, enum: [login] }
          required: [password]
        - title: Registration
          properties:
            mode: { type: string, enum: [register] }
          required: [password, turnstileToken]
        - title: Verification resend
          properties:
            mode: { type: string, enum: [resend_verification] }
    RefreshSessionRequest:
      oneOf:
        - $ref: '#/components/schemas/RefreshTokenRequest'
        - $ref: '#/components/schemas/LegacyRefreshTokenRequest'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
    LegacyRefreshTokenRequest:
      type: object
      additionalProperties: false
      deprecated: true
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true
    ServiceUnavailableError:
      description: 503 – service temporarily unavailable (dependency outage, maintenance window, or upstream timeout).
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - SERVICE_UNAVAILABLE
                - DEPENDENCY_UNAVAILABLE
                - MAINTENANCE
              example: SERVICE_UNAVAILABLE
            message:
              type: string
              example: Service temporarily unavailable. Please retry after the indicated delay.
            retryAfterSeconds:
              type: integer
              description: Suggested number of seconds to wait before retrying
              example: 30
            correlationId:
              type: string
    BadGatewayError:
      description: 502 – bad gateway (upstream service returned an invalid or unexpected response).
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - BAD_GATEWAY
                - UPSTREAM_ERROR
              example: BAD_GATEWAY
            message:
              type: string
              example: An upstream service returned an unexpected response. Please try again.
            correlationId:
              type: string
  headers:
    XCorrelationID:
      description: Server-generated correlation identifier for distributed tracing. Include in support requests.
      schema:
        type: string
        example: 01HZPQ2B3C4D5E6F7G8H9JABCD
