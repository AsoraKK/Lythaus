<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lythaus — a social platform for human-authored content.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="lythaus-release-id" content="__LYTHAUS_WEB_RELEASE_ID__">

  <!-- Open Graph -->
  <meta property="og:title" content="Lythaus">
  <meta property="og:description" content="A social platform for human-authored content.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lythaus.co/brand/lythaus-v1/lythaus-social-card-1200x630.78f698ef4283.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lythaus wordmark">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lythaus">
  <meta name="twitter:description" content="A social platform for human-authored content.">
  <meta name="twitter:image" content="https://lythaus.co/brand/lythaus-v1/lythaus-social-card-1200x630.78f698ef4283.png">
  <meta name="twitter:image:alt" content="Lythaus wordmark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lythaus">

  <!-- Favicon -->
  <link rel="icon" href="icons/lythaus-v1/favicon.e3dfdd675a74.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" type="image/x-icon">
  <link rel="icon" href="icons/lythaus-v1/favicon.116ff3e020c6.svg" sizes="any" type="image/svg+xml">
  <link rel="icon" href="icons/lythaus-v1/favicon-96x96.572a7b9a0d35.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="icons/lythaus-v1/apple-touch-icon.19122fd8c91b.png" sizes="180x180">

  <meta name="theme-color" content="#F7F4EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070706" media="(prefers-color-scheme: dark)">
  <title>Lythaus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="flutter-semantics.css">
  <link rel="stylesheet" href="startup-presentation.css">
</head>
<body>
  <div id="lythaus-startup" hidden>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="brand/lythaus-v1/lythaus-wordmark-white.5ba0451347e2.svg">
      <img src="brand/lythaus-v1/lythaus-wordmark-black.e450176663e0.svg" alt="Lythaus" width="144" height="40">
    </picture>
    <p role="status" aria-live="polite">Opening Lythaus…</p>
    <button type="button" hidden>Try again</button>
  </div>
  <script src="startup-presentation.js"></script>
  <noscript>Lythaus requires JavaScript to run. Please enable JavaScript in your browser.</noscript>
  <script src="release-update.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
